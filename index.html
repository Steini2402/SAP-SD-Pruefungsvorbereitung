<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAP SD Quiz">
<title>SAP SD Quiz</title>
<style>
:root{--bg:#EEF1F8;--sf:#fff;--ink:#14182B;--mute:#5B6280;--ac:#3B4BFF;--acs:#E3E6FF;--ok:#12A150;--oks:#D9F5E5;--no:#E5484D;--nos:#FDE3E4;--ln:#D6DAEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:28px 0 6px}
h2{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 22px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.primary{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:18px;margin-top:18px}
:root[data-theme="dark"] .primary{color:#0E1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0E1020}}
.ghost{padding:12px 16px;border-radius:12px;background:var(--acs);font-weight:600;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start}.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ln);margin-top:1px;display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .box{background:var(--ac);border-color:var(--ac);color:#fff}.opt.ok .box{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no .box{background:var(--no);border-color:var(--no);color:#fff}.opt.miss{border-color:var(--ok);border-style:dashed}.tag{display:block;font-size:13px;color:var(--mute);margin-top:4px}.menu{display:flex;justify-content:space-between;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);font-weight:600}.menu small{color:var(--mute);font-weight:400}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:18px}.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:4px}.crow{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:2px solid var(--ln);font-size:17px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--no);background:var(--nos)}
.opt:disabled{cursor:default}
.exp{margin:14px 2px 0;color:var(--mute);font-size:15px}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;margin:30px 0 4px;line-height:1}
.row{display:flex;gap:10px;margin-top:12px}
details{margin-top:28px;background:var(--sf);border-radius:16px;padding:14px 16px;border:1px solid var(--ln)}
summary{font-weight:600;cursor:pointer}
textarea{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:15px/1.4 inherit;resize:vertical}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
#msg{font-size:14px;margin:10px 0 0;min-height:1em}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[[1,"Welche der folgenden Aussagen zu den Organisationseinheiten Vertriebsweg und Sparte sind richtig?",[["Man benötigt neben der Verkaufsorganisation und der Sparte mindestens einen Vertriebsweg, um einen Vertriebsbereich abbilden zu können.",1],["Man benötigt mindestens eine Sparte, um Kundenaufträge anlegen zu können.",1],["Wenn bereits unterschiedliche Vertriebswege angelegt wurden, dann erübrigt sich die Anlage von eigenen Sparten.",0],["Es ist möglich, mit einer spartenübergreifenden Sparte mehrere Produktlinien zusammenzufassen.",1]]],[1,"In SAP werden ganz grob gesehen die Anwendungen und das Customizing unterschieden Welche Aussagen zum Customizing sind korrekt?",[["Man unterscheidet zwischen dem mandantenabhängigen und -unabhängigen Customizing.",1],["Im Customizing können Sie Modifikationen (Programmerweiterungen) am SAP-System durchführen.",0],["Im Customizing können Sie die unternehmensneutral ausgelieferten Funktionalitäten des SAP-System den spezifischen betriebswirtschaftlichen Anforderungen Ihres Unternehmens anpassen.",1]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Werk, Versandstelle, Lagerort und Buchungskreis sind richtig?",[["Das Werk spielt im Modul SD überhaupt keine Rolle.",0],["Die Versandstelle gibt an, von wo aus (räumlich gesehen) ein Vertriebsbereich versendet.",1],["Die Bewertung der Warenbestände erfolgt auf Ebene des Werkes.",1],["Ein Werk kann mehreren Verkaufsorganisationen zugeordnet werden.",1]]],[1,"Zur Abbildung des Vertriebsprozesses sind (werden)...",[["...keine eigenen Organisationseinheiten erforderlich. Es wird auf die allgemeinen Organisationseinheiten zurückgegriffen.",0],["...eigene Organisationseinheiten erforderlich.",1],["...ausschließlich solche Organisationseinheiten verwendet, die auch in der Anwendungskomponente SD zur Anwendung kommen.",0],["...Organisationseinheiten verwendet, die sowohl im Vertrieb als auch in den anderen Modulen des SAP Systems benötigt werden.",1]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Versandstelle ist richtig?",[["Die Organisationseinheit Versandstelle setzt das Vorhandensein der Organisationseinheit Lagerort voraus.",0],["Der Begriff Versandstelle bezieht sich immer auf real existierende Gegebenheiten, wie z.B. ein Tor, eine Rampe, etc. und gilt im Versandprozess nur als Zusatzinformation.",0],["Eine Versandstelle kann mehreren Werken zugeordnet sein.",1]]],[1,"Welche der folgenden Organisationseinheiten sind nötig, um einen Vertriebsbereich abzubilden?",[["Versandstelle",0],["Lagerort",0],["Vertriebsweg",1],["Verkaufsorganisation",1],["Sparte",1]]],[1,"Als Verkaufssachbearbeiter beginnen Sie oft Ihre Arbeit mit der Belegerfassung. Was können Sie tun, um schneller in diese Anwendung zu gelangen?",[["Sie können den Transaktionscode für die Anwendung in Ihrer Favoritenliste eintragen, um schneller zum Einstiegsbild zu gelangen.",1],["Sie können über Ihre SAP-GUI-Verknüpfung zur Schnellanmeldung gleichzeitig eine vorgegebene Transaktion aufrufen.",1],["Sie können über das Menü \"Zusätze\" eine Starttransaktion festlegen, damit sich sofort nach der Anmeldung die gewünschte Anwendung öffnet.",1],["Am Ende eines Arbeitstages gehen Sie jeweils zur Belegerfassung. Bei der Anmeldung am nächsten Morgen wird Ihnen dann direkt die Belegerfassungstransaktion angezeigt.",0]]],[1,"Sie möchten in der Transaktion \"VD03\" das Eingabefeld Verkaufsorganisation dauerhaft mit einem bestimmten Vorschlagswert belegen. Wie gehen Sie dabei vor?",[["Im Workplace tragen Sie den Parameterwert auf der Registerkarte \"Feldvorbelegungen\" ein.",0],["In den Benutzervorgaben tragen Sie auf der Registerkarte \"Parameter\" die Kombination aus Parametername und -wert ein.",1],["In der Erfassungsmaske tragen Sie in das gewünschte Feld den Wert ein. Anschließend drücken Sie die rechte Maustaste und wählen \"Parameterwert übernehmen\".",0]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Lagerort sind richtig?",[["Lagerorte werden immer über das sogenannte Lean Warehouse Management geführt.",0],["Der Lagerort dient der Lagerung des Materials an verschiedenen Orten oder Räumen innerhalb eines Werkes.",0],["Die Organisationseinheit Lagerort kann von allen logistischen Bereichen des SAP Systems genutzt werden.",1],["Der Lagerort dient der mengenmäßigen Bestandsführung.",1]]],[1,"Welche der folgenden Aussagen zu den Organisationseinheiten Versandstelle/Werk/Lagerort sind richtig?",[["Eine Versandstelle ist immer genau einem Werk eindeutig zugeordnet.",0],["Das Vorhandensein der Organisationseinheit Werk ist Voraussetzung dafür, dass Lieferungen erfasst und physisch versandt werden können.",0],["Die Versandstelle ist diejenige organisatorische Einheit im SAP System, die für die Abwicklung des Versands zuständig ist.",1],["Ein Lagerort bezeichnet einen physisch existierenden Ort innerhalb des Lagers.",0]]],[1,"Welche der folgenden Aussagen für Buchungskreis und Mandant sind richtig?",[["In jedem Mandanten werden jeweils komplett getrennte Stammsätze für Kunden gespeichert und gepflegt.",1],["In jedem Buchungskreis werden jeweils komplett getrennte Stammsätze für Kunden gespeichert und gepflegt.",0],["Ein Mandant kann nur einen Buchungskreis haben.",0],["Für einen Buchungskreis kann eine Bilanz erstellt werden.",1]]],[1,"Eine Organisationseinheit stellt (ist)...",[["...immer auch eine juristische Einheit dar.",0],["...immer eine organisatorische und (gleichzeitig) juristische Einheit dar.",0],["...einen Baustein in der betrieblichen Organisationsstruktur dar.",1],["...eine organisatorische und manchmal (gleichzeitig auch) eine juristische Einheit dar.",1]]],[1,"Sie befinden sich in der Transaktion \"Anfrage anlegen\". Sie möchten das bereits erfasste Belegdatum bei erneutem Start der Transaktion wieder verfügbar haben, da sie oft mehrmals hintereinander Anfragen mit demselben Datum erfassen. Das Belegdatum soll dabei als Vorschlagswert zur Verfügung stehen, der von Ihnen überschrieben werden kann. Wie gehen Sie dabei vor?",[["Sie wählen aus der Menüleiste \"System> Benutzervorgaben> nehmen Daten\".",0],["Sie wählen aus der Menüleiste \"System> Benutzervorgaben> eigene Daten\".",0],["Sie wählen aus der Menüleiste \"System> Benutzervorgaben> halten Daten\".",1]]],[1,"Mit Hilfe der Benutzervorgaben kann z.B. die Verkauforganisation als Benutzerparameter so festgelegt werden, dass dieser in Zukunft automatisch in den Feldern als Vorschlagswert eingetragen ist. Was ist in Bezug auf Benutzervorgaben zu beachten?",[["Benutzerparameter gehen nach einer Abmeldung verloren und müssen nach jeder Anmeldung neu eingetragen werden.",0],["Benutzerparameter gelten nur für den Benutzer, der die Parameter nach Anmeldung mit seinem Benutzernamen eingetragen hat.",1],["Benutzerparameter können später nicht mehr geändert werden.",0],["Die Verwendung von Benutzerparametern spart Zeit und verringert die Zahl der Fehleingaben.",1]]],[1,"Welche der folgenden Aussagen zur Versandstelle sind richtig?",[["Jede Auslieferung wird von (genau) einer Versandstelle bearbeitet.",1],["Einem Werk können mehrere Versandstellen zugeordnet werden.",1],["Das Vorhandensein von Versandstellen ist Voraussetzung dafür, dass Auslieferungen angelegt werden können.",1],["Die Versandstelle befindet sich immer auf Kopfebene im Kundenauftrag.",0]]],[1,"Sie wollen in einer Anwendung (z B. Verkauf) einen Stammsatz finden. Welche Hilfsmittel stehen Ihnen im SAP System zur Verfügung, um im System angelegte Stammsätze zu suchen?",[["Sofern zu einem Eingabefeld die Wertehilfe zur Verfügung steht, befindet sich neben dem Feld ein Druckknopf. Wenn Sie diesen Druckknopf anklicken, werden ihnen die Suchhilfen zu den Feldern angezeigt.",1],["Sie positionieren den Cursor im entsprechenden Feld. Anschließend drücken Sie die Funktionstaste \"F4\" und erhalten somit die Suchhilfen angezeigt.",1],["Sie rufen mit der Funktionstaste \"F1\" die Hilfe auf und lassen sich alle im System angelegten Datensätze anzeigen. Anschließend wählen Sie durch Doppelklick den richtigen Stammsstz aus.",0]]],[1,"Welche der folgenden Aussagen zum Vertriebsbereich ist richtig?",[["Ein Vertriebsbereich ist eine eigenständige Organisationseinheit.",0],["Die Verknüpfung Buchungskreis zu Vertriebsbereich erfolgt über die Organisationseinheit Verkaufsorganisation.",1],["Der Vertriebsbereich ist eine Kombination von Verkaufsorganisation, Versandstelle und Sparte.",0]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Verkaufsorganisation sind richtig?",[["Einem Buchungskreis können mehrere Verkaufsorganisationen zugeordnet werden.",1],["Über die Organisationseinheit Verkaufsorganisation wird der Vertriebsbereich dem Buchungskreis zugeordnet.",1],["Einer Verkaufsorganisation kann maximal ein Vertriebsweg zugeordnet werden.",0],["Einer Verkaufsorganisation können mehrere Werke zugeordnet werden.",1]]],[1,"Mit Hilfe von Modi können Sie mehrere Transaktionen gleichzeitig öffnen. Sie nutzen einen Modus, um jederzeit Stammdaten ändern zu können. Warum sollte ein Modus, der nicht mehr benötigt wird, geschlossen werden?",[["Viele geöffnete Modi verbrauchen mehr Ressourcen auf ihrem Rechner und verlangsamen diesen.",1],["Es kann vorkommen, dass Sie zwischen vielen geöffneten Modi nicht mehr wechseln können, da Sie beliebig viele Modi öffnen können.",0],["Es kann vorkommen, dass Daten aus Ihrem geöffneten Modus durch andere Benutzer überschrieben werden.",0],["Es kann vorkommen, dass Daten aus Ihrem geöffneten Modus durch andere Benutzer nicht bearbeitet werden können, da sie zur Bearbeitung gesperrt sind.",1]]],[1,"Sie befinden sich im SAP-System und wollen einen Stammsatz anzeigen Dazu lassen Sie sich über die Matchcode-Hilfe Werte anzeigen. Die Liste enthält, obwohl Sie sicher sind, dass der gesuchte Stammsatzvorhanden ist, diesen nicht. Woran kann dies liegen?",[["Sie haben nicht die nötigen Berechtigungen zur Anzeige des Stammsatzes.",0],["Ihre Einschränkungen in der Matchcodesuche schließen den Stammsatz aus.",1],["Es sind mehr Einträge vorhanden, als durch die \"maximale Trefferanzahl\" angezeigt werden können.",1]]],[1,"Alle Verkaufsbelege können in Form von Nachrichten ausgegeben werden. Welche Aussagen in Bezug auf Nachrichten treffen zu?",[["Über das Icon Druckansicht in der Bestellung kann die Nachricht am Bildschirm angezeigt werden.",1],["Nachrichten müssen immer sofort ausgegeben werden.",0],["Nachrichten werden in der Regel immer manuell ausgegeben. Nur in Ausnahmefällen wird ein Hintergrundjob dafür verwendet.",0],["Zur Ausgabe der Nachrichten stehen mehrere Möglichkeiten zur Verfügung. So können diese z.B. gedruckt, per Mail versendet oder gefaxt werden.",1]]],[2,"Welche der folgenden Aussagen zum Fakturabeleg sind zutreffend?",[["Die Faktura dient als Datenquelle für das Finanzwesen (FI), um den Sachbearbeiter im Rechnungswesen bei der Zahlungsüberwachung und -abwicklung zu unterstützen.",1],["Der Fakturabeleg ist in die drei Ebenen Kopf, Position und Einteilung gegliedert.",0],["Die Faktura ist ein Beleg des Bereiches Versand.",0],["Mehrere Auslieferungen können - sofern diese für die Faktura wesentliche Merkmale gemeinsam haben - zu einer Faktura zusammengefasst werden.",1]]],[2,"Sie erklären Ihrer Vertretung die Belegnummernvergabe im SAP System. In Ihrem Unternehmen werden alle Belegnummern intern vergeben. Sie erklären den Zusammenhang von Belegnummernkreis und Belegen. Welche Aussage ist richtig?",[["Einem Nummernkreis darf keine Belegart zugeordnet sein.",0],["Einer Belegart können mehrere Nummernkreise zugeordnet sein.",0],["Einer Belegart muss ein Nummernkreis zugeordnet sein.",1]]],[2,"Welche der folgenden Aussagen zum Lieferbeleg sind zutreffend?",[["Beim Anlegen des Lieferbelegs werden wichtige Informationen aus dem Kundenauftrag in den Lieferbeleg übernommen.",1],["Im Gegensatz zum Verkaufsbeleg kann der Lieferbeleg auch Einteilungen haben.",0],["Die Anlage des Lieferbelegs erfolgt in der SAP Terminologie typischerweise durch den Vertriebsmitarbeiter.",1],["Der Lieferbeleg ist das zentrale Steuerungselement im Versandprozess.",1]]],[2,"Welche der folgenden Aussagen zum Auslieferungsbeleg sind zutreffend?",[["Beim Anlegen des Auslieferungsbelges werden Daten, wie z.B. die Materialien und die bestätigten Mengen aus dem Kundenauftrag übernommen.",1],["Der Auslieferungsbeleg steuert, unterstützt und überwacht sämtliche Teilprozesse der Versandabwicklung.",1],["Wenn Sie einen Auslieferungsbeleg anzeigen möchten, dann ist folgender Pfad zu wählen Logistik -> Vertrieb -> Verkauf -> Auslieferung -> Anzeigen.",0],["Ein Auslieferungsbeleg kann nur erfasst werden, wenn vorher ein Kundenauftrag erfasst worden ist.",0]]],[2,"Häufig werden Belege mit Bezug zu Vorgängerbelegen angelegt. Mit Bezug zu welchen Vorgängerbelegen können Kundenanfragen angelegt werden?",[["Anfrage",1],["Auftrag",1],["Es ist nicht möglich eine Anfrage mit Bezug zu einem Vorgängerbeleg anzulegen.",0],["Angebot",1]]],[2,"Welche der folgenden Aussagen zu den Verkaufs- und Lieferbelegen ist richtig?",[["Lieferbelege (Auslieferungen) weisen grundsätzlich die Ebenen Kopf, Position und Einteilung auf.",0],["Aus einem Verkaufsbeleg heraus können mehrere Lieferbelege angelegt werden.",1],["Sowohl Verkaufs- als auch Lieferbelege (Auslieferungen) sind in die Ebenen Kopf, Position und Einteilung strukturiert.",0],["Jeder Position im Verkaufsbeleg entspricht genau eine Position im Lieferbeleg.",0]]],[2,"In der Anwendungskomponente (Sales & Distribution) werden verschiedene Verkaufsbelegarten unterschieden. Bei  welcher der folgenden Belegarten handelt es sich um Verkaufsbelege?",[["Gutschrift",0],["Retoure",1],["Faktura",0],["Terminauftrag",1],["Auslieferung",0]]],[2,"Verkaufsbelege sind Belege, die während des Vorverkaufs und der Auftragsbearbeitung erfasst werden. Welche der folgenden Aussagen zu den Verkaufsbelegen sind korrekt?",[["Ein Verkaufsbeleg, der einmal angelegt ist, bezieht sich immer auf einen Vertriebsbereich. Dieser ist abhängig vom Warenempfänger.",0],["Ein Verkaufsbeleg ist in die drei Ebenen Kopf, Position und Einteilung strukturiert.",1],["Die Erfassung eines Verkaufsbelegs findet in der Regel auf einem Übersichtsbild statt.",1],["Ein Verkaufsbeleg, der einmal angelegt ist, bezieht sich immer auf einen einzigen Vertriebsbereich. Dieser ist abhängig vom Auftraggeber.",1]]],[2,"Einige Belegarten bestehen aus den Ebenen Kopf, Position und Einteilung. Welche der folgenden Aussagen sind zutreffend?",[["Im Lieferplan verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",1],["Im Fakturabeleg verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",0],["Im Transportauftrag verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",0],["Im Kundenauftrag verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",1]]],[2,"Welche Aussagen sind zu Belegarten im Vertrieb zutreffend?",[["Die Verkaufsbelegarten steuern die Belege im Verkauf.",1],["Die Anfrageart steuert die Belege bei den Vorverkaufsaktivitäten.",0],["Die Lieferungsart steuert die Belege im Versand.",1],["Die Transportart steuert die Belege im Kommissionierungsprozess.",0],["Die Fakturaart steuert die Belege in der Fakturierung.",1]]],[3,"Sie möchten ein Kundenangebot erfassen. Welche der folgenden Aussagen sind zutreffend?",[["Bei der Anlage eines Kundenangebotes mit Bezug können sowohl einzelne Positionen der Anfrage als auch die Anfrage als ganzes in das Kundenangebot übernommen werden.",1],["Wenn mit einem Kunden individuelle Preisabsprachen existieren, dann sind bei der Angebotserstellung immer manuelle Preiseingaben erforderlich.",1],["Wird bei der Anlage eines Kundenangebotes kein Vertriebsbereich eingegeben, dann wird dieser aus den Stammdaten des Auftraggebers bzw. des Warenempfängers abgeleitet.",1],["Es ist möglich ein Kundenangebot mit Bezug auf ein anderes Kundenangebot zu erfassen.",1],["Über die Schaltfläche \"Anlegen mit Bezug\" können Sie nur auf bisher erfasste Anfragen zurückgreifen. Andere Belegarten können nicht als Bezugsquelle verwendet werden.",0]]],[3,"Wenn sie bei der Auftragsanlage keinen Warenempfänger eingeben, dann...",[["...kann der Auftrag nicht gespeichert werden.",0],["...muss der Warenempfänger bei der Auslieferung nachträglich erfasst werden.",0],["...wird automatisch der Warenempfänger gleich dem Auftraggeber gesetzt.",1]]],[3,"Über den Kundenauftrag können verschiedene Belegarten angelegt werden. Wird erneut die Transaktion VA01 (Kundenauftrag anlegen) aufgerufen, dann wird...",[["...immer die Verkaufsbelegart TA (Terminauftrag) vorgeschlagen.",0],["...wird in Abhängigkeit von den Vorbelegen (Anfrage, Kontakt, etc.) automatisch die richtige Verkaufsbelegart vorgeschlagen.",0],["...die zuletzt verwendete Verkaufsbelegart vorgeschlagen (falls im Benutzerstamm kein anderer Vorschlagswert hinterlegt ist).",1]]],[3,"Sie haben einen Kundenauftrag erfasst. Das Unvollständigkeitsprotokoll zeigt, dass die folgenden Daten fehlen: Zahlungsbedingungen, Bruttogewicht, Versandstelle und Auslieferungswerk. Welche der folgenden Aussagen sind in diesem Zusammenhang zutreffend?",[["Die oben angeführten Daten müssen (solange die Stammdaten nicht entsprechend gepflegt sind) bei der Auftragsanlage jedes Mal manuell erfasst werden.",1],["Die Funktionen des Unvollständigkeitsprotokoll gibt es in der Anwendungskomponente SD (Sales & Distribution) ausschließlich im Kundenauftrag und in der Lieferung.",1],["Den Begriff \"Unvollständigkeitsprotokoll\" gibt es in der SAP Terminologie nicht. Die oben angeführten Sachverhalte werden stattdessen im sog. Fehlerprotokoll ausgewiesen.",0],["Im Customizing ist eingestellt, welche Felder zum Unvollständigkeitsprotokoll gehören.",1]]],[3,"Sie haben einen Kundenauftrag angelegt. Dieser umfasst 2 Positionen. Welche der folgenden Aussagen sind zutreffend?",[["Mit einem Doppelklick auf eine Position gelangen sie in die Positionsebene. Auf der Registerkarte \"Konditionen\" können sie das Preisfindungsschema für die Position einsehen.",1],["Sie markieren die Position, deren Preisfindung sie analysieren möchten. Anschließend wählen Sie im Menü Springen/Position/Konditionen.",1],["Es ist nicht möglich, die Preisfindung aus der Anwendungskomponente SD heraus zu analysieren. Die Analyse der Preisfindung erfolgt über das Controlling.",0],["Es ist nicht möglich, aus der Transaktion \"Kundenauftrag anlegen\" heraus, die Preisfindung des Kundenauftrages als ganzes (Position 10 und 20 zusammengefasst) zu analysieren.",1]]],[3,"Wenn sie bei der Auftragsanlage im Einstiegsbild keine Organisationsdaten (Verkaufsorganisation, Vertriebsweg, etc.) eingeben, dann...",[["...wird der Auftrag ohne Organisationsdaten gespeichert.",0],["...werden die Organisationsdaten der letzten Auftragsanlage übernommen.",0],["...leitet das System den Vertriebsbereich automatisch aus dem Kundenstamm ab.",1]]],[3,"Welche der folgenden Vorschlagswerte im Terminauftrag werden aus den Konditionssätzen übernommen?",[["Rabatt",1],["Lieferkondition",0],["Fracht",1],["Preise",1],["Volumen",0]]],[3,"Sie legen einen Auftrag für den Kunden 200901 an. Sie sind sich nicht sicher, ob dieser Kunde Teillieferungen akzeptiert oder auf Komplettlieferungen besteht. Welche der folgenden Aussagen ist in diesem Zusammenhang zutreffend?",[["In der Lieferanten-Material-Info kann auf Einteilungsebene festgelegt werden, ob die Auftragsmenge gesplittet werden darf.",0],["Das Kennzeichen Komplettlieferung oder Teillieferung finden Sie im Kundenauftrag auf Einteilungsebene.",0],["Aus der Auftragsanlage heraus (Registerkarte: Versand) ist ersichtlich, ob Teillieferungen erlaubt sind.",1]]],[3,"Jeder Vertriebsbeleg enthält eine Vielzahl von Daten. Welche Aussagen sind in diesem Zusammenhang zutreffend?",[["Ein Kundenauftrag kann niemals Datenquelle für eine Auslieferung sein.",0],["Vorschlagswerte in Vertriebsbelegen können aus Vorgängerbelegen und auch aus den Stammdaten übernommen werden.",1],["Ein großer Teil der Daten wird automatisch aus verschiedenen Quellen übernommen. Diese Daten können manuell überschrieben werden.",1],["Die allgemeinen Daten im Kundenstamm sind bei der Anlage eines Vertriebsbelegs belanglos.",0]]],[3,"Ein Auftrag besteht, wie auch andere Verkaufsbelege, aus einem Belegkopf und einer oder mehreren Positionen, wobei jede dieser Positionen aus einer oder mehreren Einteilungen besteht. Welche Aussagen treffen in diesem Zusammenhang zu?",[["Der Belegkopf übersteuert immer die Einstellungen in den Positionsdetails.",0],["Die im Belegkopf stehenden Informationen wie die Zahlungsbedingungen gelten für den gesamten Auftrag.",1],["Im Belegkopf hinterlegte Informationen haben keine Auswirkung auf die Belegpositionen.",0],["In den Positionen eines Auftrags können zusätzliche Informationen gepflegt werden, die im Belegkopf nicht vorhanden sind.",1]]],[3,"Sie legen eine Auslieferung mit Bezug zu einem Kundenauftrag an. Der Kundenauftrag verfügt über 3 Einteilungen. Welche der folgenden Aussagen sind zutreffend?",[["Die Anzahl der Einteilungen im Lieferbeleg hängt auch davon ab, ob mit dem Kunden eine Teillieferungsvereinbarung existiert.",0],["Es werden nur Einteilungen mit bestätigten Mengen berücksichtigt.",1],["Der Lieferbeleg hat in der Folge mindestens 3 Einteilungen.",0]]],[3,"Der zentrale Schritt im Vertriebsprozess ist die Anlage eines Kundenauftrages. Welche der folgenden Aussagen zum Kundenauftrag sind zutreffend?",[["Wird ein Kundenauftrag \"mit Bezug\" angelegt, dann werden die meisten Daten des Vorgängerbelegs in den Auftrag übernommen (Gewichtung 1).",1],["Änderungen in den Kopfdaten des Kundenauftrags werden automatisch in bereits erfasste Auftragspositionen übernommen.",1],["Bereits bei der Anlage des Kundenauftrages werden bestimmte Daten für den Versand vom System ermittelt.",1],["Bereits bei der Anlage des Kundenauftrages wird auf das Konditionsschema zurückgegriffen und ein entsprechender Verkaufspreis errechnet.",0]]],[3,"Sie legen einen Kundenauftrag an. Dabei möchten Sie auch Materialien unterschiedlicher Sparten erfassen. Bewerten Sie die folgenden Aussagen zur Kundenauftrags-Bearbeitung.",[["Falls Sie bei der Auftragsanlage keine Sparte eingegeben haben, wird die Sparte aus dem Materialstamm der ersten Auftragsposition ermittelt.",0],["Im Customizing kann festgelegt werden, dass auch Materialien unterschiedlicher Sparten (spartenübergreifender Verkauf) in einem Verkaufsbeleg erfasst werden.",1],["Jeder Verkaufsbeleg muss einem Vertriebsbereich zugeordnet sein. Es ist daher nicht möglich, in einem Verkaufsbeleg Materialien unterschiedlicher Sparten zu erfassen.",0],["Wenn Sie bei Auftragsanlage keine Sparte eingegeben haben, dann wird die Sparte aus dem Kundenstammsatz des Auftragsgebers ermittelt.",1]]],[4,"Die Partnerrollen zum Kundenstamm werden im Kundenstamm bei den Vertriebsbereichsdaten hinterlegt. Kreuzen Sie an, welche der gegebenen Partnerrollen für eine komplette Verkaufs- und Vertriebsabwicklung (inkl. Faktura) zwingend erforderlich sind?",[["Warenempfänger",1],["Regulierer",1],["Ansprechpartner",0],["Auftraggeber",1],["Spediteur",0]]],[4,"Ihr Unternehmen besteht aus verschiedenen Organisationsebenen, die im SAP System abgebildet sind. Was bedeutet dies für die Anlage der Sicht Grunddaten von Materialstammsätzen?",[["Sie müssen pro Werk angelegt werden.",0],["Sie müssen pro Buchungskreis angelegt werden.",0],["Sie werden pro Mandant angelegt.",1]]],[4,"Sie möchten einen Auftrag erfassen. Welche der folgenden Aussagen zu den Partnerrollen sind richtig?",[["Der Auftraggeber kann sowohl auf Kopfebene als auch auf Positionsebene im Beleg festgelegt werden.",0],["Es ist möglich, einem Kundenstammsatz mehrere Warenempfänger zuzuordnen. Bei der Auftragserfassung muss der Bearbeiter den jeweiligen Warenempfänger auswählen.",1],["Aufträge, mit denen ausschließlich Dienstleistungen abgewickelt werden, brauchen keinen Warenempfänger, da auch keine Lieferung angelegt werden muss.",0],["Auftraggeber, Regulierer, Rechnungsempfänger und Warenempfänger werden immer aus dem Kundenstamm ermittelt, können aber auch im Kopf des Auftrages geändert werden.",1]]],[4,"Sie haben im Kundenstammsatz bei den Partnerrollen mehrere Warenempfänger hinterlegt. Welche der folgenden Aussagen ist zutreffend?",[["Es ist möglich, in einem Kundenstammsatz mehr als einen Warenempfänger zu hinterlegen.",1],["Aufträge, mit denen ausschließlich Dienstleistungen abgewickelt werden, brauchen keinen Warenempfänger, da auch keine Lieferung angelegt werden muss.",0],["Sollte bis zur Auftragsanlage kein Warenempfänger eingegeben worden sein, dann wird im SAP System standardmäßig der Warenempfänger gleich dem Auftraggeber gesetzt.",1],["Es ist nicht möglich, einen lieferrelevanten Auftrag ohne Warenempfänger anzulegen.",1]]],[4,"Die Materialnummer kann extern eingegeben werden. Welche Aussage zur externen Nummernvergabe trifft zu?",[["Die Materialnummer kann aus beliebig vielen Stellen bestehen.",0],["Es dürfen nur Ziffern verwendet werden.",0],["Die Materialnummer kann aus Buchstaben und Ziffern bestehen.",1],["Es dürfen nur Buchstaben verwendet werden.",0]]],[4,"Die Materialart steuert bei der Anlage von Materialien unter anderem folgende Dinge.",[["Die Art der Nummernvergabe.",1],["Die Sichten, die zum Erfassen angeboten werden.",1],["Die zulässige Beschaffungsart.",1],["Den Lagerort.",0]]],[4,"Welche der folgenden Aussagen zu den Materialstammdaten sind zutreffend?",[["Der Lagerort wird in den Materialstammdaten auf der Registerkarte \"Fakturendisposition\" hinterlegt.",0],["Jedes Material kann - über alle Vertriebsbereiche hinweg - nur einer einzigen Sparte zugeordnet werden.",0],["Durch Customizingeinstellungen können innerhalb einer Registerkarte verschiedene Felder zu Musseingabefeldern gemacht werden.",1],["Jedem Materialstammsatz ist eine Materialart zugeordnet.",1]]],[4,"Sie haben die Materialstammdaten des Materials MAT-4711 auf ein neues Material MAT-4712 kopiert. In der Folge stellen sie fest, dass nur ein Teil der Daten auf den neuen Materialstamm kopiert wurden. Was könnten die Ursachen dafür sein?",[["Sie haben bei der Sichtenauswahl nur einen Teil der Sichten ausgewählt, die kopiert werden sollen.",1],["Sie haben versäumt anzugeben, von welcher Vertriebssicht des Vorlagematerials sie die Stammdaten kopieren möchten.",0],["Sie haben nicht alle Registerkarten, deren Inhalte sie kopieren wollen, markiert.",1],["Es können nur die Grunddaten von einem Materialstamm auf einen anderen Materialstamm kopiert werden, andere Sichten müssen manuell nachgezogen werden.",0]]],[4,"Der Kundenstamm ist unterteilt in Allgemeine Daten, Vertriebsbereichsdaten und Buchungskreisdaten. Zur besseren Pflege der Daten sind diese auf verschiedene Registerkarten aufgeteilt. Welche der folgenden Registerkarten gehören zu den Kundenstamm Vertriebsbereichsdaten?",[["Faktura",1],["Partnerrollen",1],["Abladestellen",0],["Versand",1],["Exportdaten",0]]],[4,"Das Material MAT-4711 wird über verschiedene Verkaufsorganisationen (V100 und V200) und verschiedene Vertriebswege (V1, V2 und V3) verkauft. Welche der folgenden Aussagen ist zutreffend?",[["Bei jeder beliebigen Kombination aus Verkaufsorganisation und Vertriebsweg wird auf die gleichen Vertriebsbereichsdaten zurückgegriffen.",0],["Sollen für verschiedene Kombinationen aus Verkaufsorganisation und Vertriebsweg unterschiedliche Vertriebsstammdaten gelten, dann müssen diese vorher erfasst werden.",1],["Bei jeder beliebigen Kombination aus Verkaufsorganisation und Vertriebsweg wird auf die gleichen Allgemeinen Daten (Registerkarten Grunddaten 1, Grunddaten2) zurückgegriffen.",1],["Die Stammdaten aus einer beliebigen Kombination aus Verkaufsorganisation und Vertriebsweg können bei der Anlage der Vertriebsicht auch auf neue Vertriebsbereiche kopiert werden.",1]]],[4,"Die Muster GmbH hat 2 Vertriebsbereiche (A und B) angelegt. Im Vertriebsbereich A sind zwei Vertriebswege vorgesehen (Einzelhandel und Großhandel), im Vertriebsbereich B ist ein Vertriebsweg (Wiederverkäufer) vorgesehen. Der Kunde Name 200901 wird über beide Vertriebsbereiche bedient. Die allgemeinen Daten zum Debitor 200901 müssen...",[["...mindestens zweimal angelegt sein.",0],["...dreimal angelegt sein.",0],["...nur einmal angelegt sein.",1]]],[4,"Welche der folgenden Aussagen zu den Kundenstammdaten sind zutreffend?",[["Die Vertriebsbereichsdaten im Kundenstamm sind für alle Vertriebsbereiche ident.",0],["In den Vertriebsbereichsdaten eines Kundenstammes können mehrere Warenempfänger eingetragen sein.",1],["Die Vertriebsbereichsdaten sind von der gewählten Kombination aus Verkaufsorganisation, Vertriebsweg und Sparte abhängig.",1],["Durch Customizingeinstellungen können innerhalb einer Registerkarte verschiedene Felder ausgeblendet werden.",1]]],[4,"Die Muster GmbH verfügt über 2 Verkaufsorganisationen (Verkaufsorganisation V100 und V200). Sie möchten den Kunden 200901 über beide Verkaufsorganisationen beliefern. Die Verkaufsorganisaton V200 hat mit dem Kunden jedoch andere Incoterms vereinbart als die VerkaufsorganisationV100. Welche der nachfolgenden Aussagen sind zutreffend?",[["Einem einzelnen Unternehmen (hier Muster GmbH) kann nur eine einzige Verkaufsorganisation zugeordnet werden.",0],["Eine Kombination aus Verkaufsorganisation, Vertriebsweg und Sparte ergibt einen Vertriebsbereich.",1],["Es ist möglich für unterschiedliche Verkaufsorganisationen unterschiedliche Incoterms im Kundenstamm zu pflegen.",1],["Im SAP System ist es standardmäßig nicht vorgesehen, dass verschiedene Verkaufsorganisationen mit ein und demselben Kunden unterschiedliche Incoterms vereinbaren.",0]]],[4,"Welche der folgenden Aussagen zu den Partnerrollen ist zutreffend?",[["Der Regulierer ist für die Bezahlung der Rechnung zuständig.",1],["Rechnungsempfänger und Regulierer sind immer identisch.",0],["Auftraggeber und Regulierer sind immer identisch.",0]]],[4,"Zum Kunden 200901 und zum Material MAT-4711 existiert eine Kunden-Material-Info. Welche der folgenden Aussagen ist zutreffend?",[["Sind im Materialstamm MAT-4711 und in der Kunden-Material-Info abweichende Daten enthalten, dann werden bei der Belegbearbeitung die Daten des Materialstamms denen der Kunden-Material-Info vorgezogen.",0],["Sind im Kundenstamm 200901 und in der Kunden-Material-Info abweichende Daten enthalten, dann werden bei der Belegbearbeitung die Daten des Kundenstammes denen der Kunden-Material-Info vorgezogen.",0],["Wenn sie einen Auftrag für den Besteller 200901 erfassen, dann können Sie die einzelnen Bestellpositionen auch mit der Materialnummer des Kunden erfassen.",1],["Die Kunden-Material-Info wird verwendet, um Daten eines bestimmten Kunden und eines bestimmten Materials zu kombinieren.",1]]],[4,"Zum Anlegen des Materialstammes müssen Sichten ausgewählt werden. Welche Aussagen zu den Sichten treffen zu?",[["Es besteht kein Zusammenhang zwischen der Materialart und den auswählbaren Sichten.",0],["Der Pflegestatus gibt Auskunft über aktuell gepflegte Sichten.",1],["Alle relevanten Sichten müssen beim Erstanlegen ausgewählt werden, da weitere Sichten zu einem späteren Zeitpunkt nicht mehr hinzugefügt werden können.",0],["Die Sichten im Materialstamm verringern die Komplexität der dann enthaltenen Informationen, da sie dadurch in logische Gruppen unterteilt werden.",1]]]];
var app=document.getElementById("app"),deck=[],i=0,score=0,wrong=[],sess=[],stat={};
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var missed=load("sd-missed",[]),best=load("sd-best",null),know=load("sd-know",{});
missed.forEach(function(id){if(know[id]===undefined)know[id]=0});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function idx(q){return Q.indexOf(q)}
function stats(){
  var n=Q.length,ok=0,bad=0;
  Q.forEach(function(q,k){if(know[k]===1)ok++;else if(know[k]===0)bad++});
  var pct=Math.round(ok/n*100);
  var h='<div class="stat"><div class="big">'+pct+' %</div><p class="sub" style="margin:0 0 10px">Wissensstand: '+ok+' von '+n+' Fragen zuletzt richtig</p><div class="bar" style="margin-bottom:14px"><span style="width:'+pct+'%"></span></div>';
  [1,2,3,4].forEach(function(c){var t=0,g=0;Q.forEach(function(q,k){if(q[0]===c){t++;if(know[k]===1)g++}});var p=Math.round(g/t*100);h+='<div class="crow"><span>Kategorie '+c+'</span><span>'+p+' %</span></div><div class="bar" style="height:4px;margin-bottom:10px"><span style="width:'+p+'%"></span></div>'});
  h+='<p class="hint" style="margin:4px 0 0">'+bad+' zuletzt falsch, '+(n-ok-bad)+' noch nicht beantwortet.</p></div>';
  return h}
function home(){
  var cats=[1,2,3,4],h='<h1>SAP SD Quiz</h1><p class="sub">'+Q.length+' Fragen, Mehrfachauswahl'+(best!==null?' – Bestwert '+best+' %':'')+'</p>'+
  stats()+'<button class="primary" id="all" style="margin-top:6px">Alle Fragen mischen</button>'+
  '<button class="primary" id="exam" style="background:var(--acs);color:var(--ink)">Prüfung: 20 Zufallsfragen</button>'+
  '<p class="sub" style="margin:26px 0 10px">Nach Kategorie</p>';
  cats.forEach(function(c){var n=Q.filter(function(q){return q[0]===c}).length;h+='<button class="menu" data-c="'+c+'"><span>Kategorie '+c+'</span><small>'+n+' Fragen</small></button>'});
  h+='<button class="menu" id="mis"'+(missed.length?'':' disabled style="opacity:.5"')+'><span>Fehlerliste üben</span><small>'+missed.length+' Fragen</small></button>';
  app.innerHTML=h;
  document.getElementById("all").onclick=function(){start(Q)};
  document.getElementById("exam").onclick=function(){start(shuffle(Q).slice(0,20))};
  document.getElementById("mis").onclick=function(){if(missed.length)start(Q.filter(function(q,k){return missed.indexOf(k)>-1}))};
  app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){start(Q.filter(function(q){return q[0]===+b.dataset.c}))}});
}
function start(list){deck=shuffle(list);i=0;score=0;wrong=[];show()}
function show(){
  var q=deck[i],opts=shuffle(q[2]),nr=opts.filter(function(o){return o[1]}).length,sel={},done=false;
  app.innerHTML='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+deck.length+'" aria-valuenow="'+i+'"><span style="width:'+(i/deck.length*100)+'%"></span></div>'+
  '<div class="crow" style="align-items:center;margin-bottom:18px"><span class="sub" style="margin:0">Frage '+(i+1)+' von '+deck.length+' – Kategorie '+q[0]+'</span><button class="ghost" id="end" style="padding:8px 14px">Beenden</button></div><h2>'+esc(q[1])+'</h2>'+
  '<p class="sub" style="margin-top:-12px">Wähle '+nr+' richtige Antwort'+(nr>1?'en':'')+'.</p>'+
  '<div>'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'" aria-pressed="false"><span class="box"></span><span class="tx">'+esc(o[0])+'</span></button>'}).join("")+'</div><div id="fb" aria-live="polite"><button class="primary" id="chk" disabled style="opacity:.5">Antwort prüfen</button></div>';
  var btns=app.querySelectorAll(".opt"),chk=document.getElementById("chk");document.getElementById("end").onclick=function(){var a=done?i+1:i;a>0?result(a):home()};
  btns.forEach(function(b){b.onclick=function(){if(done)return;var k=b.dataset.k;sel[k]=!sel[k];b.classList.toggle("sel",sel[k]);b.setAttribute("aria-pressed",sel[k]);b.firstChild.textContent=sel[k]?"\u2713":"";var any=Object.keys(sel).some(function(x){return sel[x]});chk.disabled=!any;chk.style.opacity=any?1:.5}});
  chk.onclick=function(){
    done=true;var good=true;
    btns.forEach(function(b,k){var s=!!sel[k],r=!!opts[k][1];b.disabled=true;b.classList.remove("sel");
      if(s&&r){b.classList.add("ok");b.firstChild.textContent="\u2713"}
      else if(s&&!r){b.classList.add("no");b.firstChild.textContent="\u2715";good=false}
      else if(!s&&r){b.classList.add("miss");b.insertAdjacentHTML("beforeend","");b.querySelector(".tx").insertAdjacentHTML("beforeend",'<span class="tag">Richtig, aber nicht gewählt</span>');good=false}});
    var id=idx(q);
    if(good){score++;missed=missed.filter(function(x){return x!==id})}else{wrong.push(q);if(missed.indexOf(id)<0)missed.push(id)}
    save("sd-missed",missed);know[id]=good?1:0;save("sd-know",know);
    document.getElementById("fb").innerHTML='<p class="exp"><strong>'+(good?"Richtig.":"Nicht ganz.")+'</strong> '+(good?"Alle richtigen Antworten gewählt, keine falsche.":"Für einen Punkt müssen genau die richtigen Antworten gewählt sein.")+'</p><button class="primary" id="nx">'+(i+1<deck.length?"Weiter":"Ergebnis anzeigen")+'</button>'+(i+1<deck.length?'<button class="ghost" id="stop" style="width:100%;margin-top:10px">Jetzt beenden ('+(i+1)+' beantwortet)</button>':'');
    var nx=document.getElementById("nx");nx.onclick=function(){i++;i<deck.length?show():result()};nx.focus();var sp=document.getElementById("stop");if(sp)sp.onclick=function(){result(i+1)};
  };
}
function result(n){n=n||deck.length;
  var pct=Math.round(score/n*100);
  if(n>=20&&(best===null||pct>best)){best=pct;save("sd-best",pct)}
  var msg=pct>=70?"Bestanden-Niveau erreicht.":pct>=50?"Auf dem Weg – wiederhole die Fehler.":"Noch viel Luft nach oben. Übe die Fehlerliste.";
  app.innerHTML='<h1>Ergebnis</h1><div class="score">'+score+' / '+n+'</div><p class="sub">'+pct+' % richtig – '+msg+'</p>'+
  (wrong.length?'<button class="primary" id="rep">Falsche Fragen wiederholen ('+wrong.length+')</button>':'')+
  '<button class="primary" id="again" style="background:var(--acs);color:var(--ink)">Neue Runde</button><button class="ghost" id="hm" style="width:100%;margin-top:12px">Zum Start</button>';
  if(wrong.length)document.getElementById("rep").onclick=function(){start(wrong)};
  document.getElementById("again").onclick=function(){start(deck)};
  document.getElementById("hm").onclick=home;
}
home();
</script>
</body>
</html>
