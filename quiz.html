<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="author" content="Stefan Steinweg">
<meta name="theme-color" content="#3B4BFF">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>SAP SD Quiz</title>
<style>
:root{--bg:#EEF1F8;--sf:#fff;--ink:#14182B;--mute:#5B6280;--ac:#3B4BFF;--acs:#E3E6FF;--ok:#12A150;--oks:#D9F5E5;--no:#E5484D;--nos:#FDE3E4;--ln:#D6DAEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:28px 0 6px}
h2{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 22px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.primary{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:18px;margin-top:18px}
:root[data-theme="dark"] .primary{color:#0E1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0E1020}}
.ghost{padding:12px 16px;border-radius:12px;background:var(--acs);font-weight:600;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start}.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ln);margin-top:1px;display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .box{background:var(--ac);border-color:var(--ac);color:#fff}.opt.ok .box{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no .box{background:var(--no);border-color:var(--no);color:#fff}.opt.miss{border-color:var(--ok);border-style:dashed}.tag{display:block;font-size:13px;color:var(--mute);margin-top:4px}.menu{display:flex;justify-content:space-between;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);font-weight:600}.menu small{color:var(--mute);font-weight:400}.help h3{font-size:18px;margin:24px 0 6px}.help p,.help li{margin:0 0 8px;font-size:16px}.help ul{padding-left:20px;margin:0 0 8px}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:18px}.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:4px}.crow{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:2px solid var(--ln);font-size:17px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--no);background:var(--nos)}
.opt:disabled{cursor:default}
.exp{margin:14px 2px 0;color:var(--mute);font-size:15px}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;margin:30px 0 4px;line-height:1}
.row{display:flex;gap:10px;margin-top:12px}
details{margin-top:28px;background:var(--sf);border-radius:16px;padding:14px 16px;border:1px solid var(--ln)}
summary{font-weight:600;cursor:pointer}
textarea{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:15px/1.4 inherit;resize:vertical}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
#msg{font-size:14px;margin:10px 0 0;min-height:1em}
.qimg{display:block;width:100%;height:auto;border:1px solid var(--ln);border-radius:14px;margin:14px 0 18px;background:var(--sf)}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[[1,"Welche der folgenden Aussagen zu den Organisationseinheiten Vertriebsweg und Sparte sind richtig?",[["Man benötigt neben der Verkaufsorganisation und der Sparte mindestens einen Vertriebsweg, um einen Vertriebsbereich abbilden zu können.",1],["Man benötigt mindestens eine Sparte, um Kundenaufträge anlegen zu können.",1],["Wenn bereits unterschiedliche Vertriebswege angelegt wurden, dann erübrigt sich die Anlage von eigenen Sparten.",0],["Es ist möglich, mit einer spartenübergreifenden Sparte mehrere Produktlinien zusammenzufassen.",1]]],[1,"In SAP werden ganz grob gesehen die Anwendungen und das Customizing unterschieden Welche Aussagen zum Customizing sind korrekt?",[["Man unterscheidet zwischen dem mandantenabhängigen und -unabhängigen Customizing.",1],["Im Customizing können Sie Modifikationen (Programmerweiterungen) am SAP-System durchführen.",0],["Im Customizing können Sie die unternehmensneutral ausgelieferten Funktionalitäten des SAP-System den spezifischen betriebswirtschaftlichen Anforderungen Ihres Unternehmens anpassen.",1]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Werk, Versandstelle, Lagerort und Buchungskreis sind richtig?",[["Das Werk spielt im Modul SD überhaupt keine Rolle.",0],["Die Versandstelle gibt an, von wo aus (räumlich gesehen) ein Vertriebsbereich versendet.",1],["Die Bewertung der Warenbestände erfolgt auf Ebene des Werkes.",1],["Ein Werk kann mehreren Verkaufsorganisationen zugeordnet werden.",1]]],[1,"Zur Abbildung des Vertriebsprozesses sind (werden)...",[["...keine eigenen Organisationseinheiten erforderlich. Es wird auf die allgemeinen Organisationseinheiten zurückgegriffen.",0],["...eigene Organisationseinheiten erforderlich.",1],["...ausschließlich solche Organisationseinheiten verwendet, die auch in der Anwendungskomponente SD zur Anwendung kommen.",0],["...Organisationseinheiten verwendet, die sowohl im Vertrieb als auch in den anderen Modulen des SAP Systems benötigt werden.",1]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Versandstelle ist richtig?",[["Die Organisationseinheit Versandstelle setzt das Vorhandensein der Organisationseinheit Lagerort voraus.",0],["Der Begriff Versandstelle bezieht sich immer auf real existierende Gegebenheiten, wie z.B. ein Tor, eine Rampe, etc. und gilt im Versandprozess nur als Zusatzinformation.",0],["Eine Versandstelle kann mehreren Werken zugeordnet sein.",1]]],[1,"Welche der folgenden Organisationseinheiten sind nötig, um einen Vertriebsbereich abzubilden?",[["Versandstelle",0],["Lagerort",0],["Vertriebsweg",1],["Verkaufsorganisation",1],["Sparte",1]]],[1,"Als Verkaufssachbearbeiter beginnen Sie oft Ihre Arbeit mit der Belegerfassung. Was können Sie tun, um schneller in diese Anwendung zu gelangen?",[["Sie können den Transaktionscode für die Anwendung in Ihrer Favoritenliste eintragen, um schneller zum Einstiegsbild zu gelangen.",1],["Sie können über Ihre SAP-GUI-Verknüpfung zur Schnellanmeldung gleichzeitig eine vorgegebene Transaktion aufrufen.",1],["\"Sie können über das Menü \"\"Zusätze\"\" eine Starttransaktion festlegen, damit sich sofort nach der Anmeldung die gewünschte Anwendung öffnet.\"",1],["Am Ende eines Arbeitstages gehen Sie jeweils zur Belegerfassung. Bei der Anmeldung am nächsten Morgen wird Ihnen dann direkt die Belegerfassungstransaktion angezeigt.",0]]],[1,"\"Sie möchten in der Transaktion \"\"VD03\"\" das Eingabefeld Verkaufsorganisation dauerhaft mit einem bestimmten Vorschlagswert belegen. Wie gehen Sie dabei vor?\"",[["\"Im Workplace tragen Sie den Parameterwert auf der Registerkarte \"\"Feldvorbelegungen\"\" ein.\"",0],["\"In den Benutzervorgaben tragen Sie auf der Registerkarte \"\"Parameter\"\" die Kombination aus Parametername und -wert ein.\"",1],["\"In der Erfassungsmaske tragen Sie in das gewünschte Feld den Wert ein. Anschließend drücken Sie die rechte Maustaste und wählen \"\"Parameterwert übernehmen\"\".\"",0]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Lagerort sind richtig?",[["Lagerorte werden immer über das sogenannte Lean Warehouse Management geführt.",0],["Der Lagerort dient der Lagerung des Materials an verschiedenen Orten oder Räumen innerhalb eines Werkes.",0],["Die Organisationseinheit Lagerort kann von allen logistischen Bereichen des SAP Systems genutzt werden.",1],["Der Lagerort dient der mengenmäßigen Bestandsführung.",1]]],[1,"Welche der folgenden Aussagen zu den Organisationseinheiten Versandstelle/Werk/Lagerort sind richtig?",[["Eine Versandstelle ist immer genau einem Werk eindeutig zugeordnet.",0],["Das Vorhandensein der Organisationseinheit Werk ist Voraussetzung dafür, dass Lieferungen erfasst und physisch versandt werden können.",0],["Die Versandstelle ist diejenige organisatorische Einheit im SAP System, die für die Abwicklung des Versands zuständig ist.",1],["Ein Lagerort bezeichnet einen physisch existierenden Ort innerhalb des Lagers.",0]]],[1,"Welche der folgenden Aussagen für Buchungskreis und Mandant sind richtig?",[["In jedem Mandanten werden jeweils komplett getrennte Stammsätze für Kunden gespeichert und gepflegt.",1],["In jedem Buchungskreis werden jeweils komplett getrennte Stammsätze für Kunden gespeichert und gepflegt.",0],["Ein Mandant kann nur einen Buchungskreis haben.",0],["Für einen Buchungskreis kann eine Bilanz erstellt werden.",1]]],[1,"Eine Organisationseinheit stellt (ist)...",[["...immer auch eine juristische Einheit dar.",0],["...immer eine organisatorische und (gleichzeitig) juristische Einheit dar.",0],["...einen Baustein in der betrieblichen Organisationsstruktur dar.",1],["...eine organisatorische und manchmal (gleichzeitig auch) eine juristische Einheit dar.",1]]],[1,"\"Sie befinden sich in der Transaktion \"\"Anfrage anlegen\"\". Sie möchten das bereits erfasste Belegdatum bei erneutem Start der Transaktion wieder verfügbar haben, da sie oft mehrmals hintereinander Anfragen mit demselben Datum erfassen. Das Belegdatum soll dabei als Vorschlagswert zur Verfügung stehen, der von Ihnen überschrieben werden kann. Wie gehen Sie dabei vor?\"",[["\"Sie wählen aus der Menüleiste \"\"System> Benutzervorgaben> nehmen Daten\"\".\"",0],["\"Sie wählen aus der Menüleiste \"\"System> Benutzervorgaben> eigene Daten\"\".\"",0],["\"Sie wählen aus der Menüleiste \"\"System> Benutzervorgaben> halten Daten\"\".\"",1]]],[1,"Mit Hilfe der Benutzervorgaben kann z.B. die Verkauforganisation als Benutzerparameter so festgelegt werden, dass dieser in Zukunft automatisch in den Feldern als Vorschlagswert eingetragen ist. Was ist in Bezug auf Benutzervorgaben zu beachten?",[["Benutzerparameter gehen nach einer Abmeldung verloren und müssen nach jeder Anmeldung neu eingetragen werden.",0],["Benutzerparameter gelten nur für den Benutzer, der die Parameter nach Anmeldung mit seinem Benutzernamen eingetragen hat.",1],["Benutzerparameter können später nicht mehr geändert werden.",0],["Die Verwendung von Benutzerparametern spart Zeit und verringert die Zahl der Fehleingaben.",1]]],[1,"Welche der folgenden Aussagen zur Versandstelle sind richtig?",[["Jede Auslieferung wird von (genau) einer Versandstelle bearbeitet.",1],["Einem Werk können mehrere Versandstellen zugeordnet werden.",1],["Das Vorhandensein von Versandstellen ist Voraussetzung dafür, dass Auslieferungen angelegt werden können.",1],["Die Versandstelle befindet sich immer auf Kopfebene im Kundenauftrag.",0]]],[1,"Sie wollen in einer Anwendung (z B. Verkauf) einen Stammsatz finden. Welche Hilfsmittel stehen Ihnen im SAP System zur Verfügung, um im System angelegte Stammsätze zu suchen?",[["Sofern zu einem Eingabefeld die Wertehilfe zur Verfügung steht, befindet sich neben dem Feld ein Druckknopf. Wenn Sie diesen Druckknopf anklicken, werden ihnen die Suchhilfen zu den Feldern angezeigt.",1],["\"Sie positionieren den Cursor im entsprechenden Feld. Anschließend drücken Sie die Funktionstaste \"\"F4\"\" und erhalten somit die Suchhilfen angezeigt.\"",1],["\"Sie rufen mit der Funktionstaste \"\"F1\"\" die Hilfe auf und lassen sich alle im System angelegten Datensätze anzeigen. Anschließend wählen Sie durch Doppelklick den richtigen Stammsstz aus.\"",0]]],[1,"Welche der folgenden Aussagen zum Vertriebsbereich ist richtig?",[["Ein Vertriebsbereich ist eine eigenständige Organisationseinheit.",0],["Die Verknüpfung Buchungskreis zu Vertriebsbereich erfolgt über die Organisationseinheit Verkaufsorganisation.",1],["Der Vertriebsbereich ist eine Kombination von Verkaufsorganisation, Versandstelle und Sparte.",0]]],[1,"Welche der folgenden Aussagen zur Organisationseinheit Verkaufsorganisation sind richtig?",[["Einem Buchungskreis können mehrere Verkaufsorganisationen zugeordnet werden.",1],["Über die Organisationseinheit Verkaufsorganisation wird der Vertriebsbereich dem Buchungskreis zugeordnet.",1],["Einer Verkaufsorganisation kann maximal ein Vertriebsweg zugeordnet werden.",0],["Einer Verkaufsorganisation können mehrere Werke zugeordnet werden.",1]]],[1,"Mit Hilfe von Modi können Sie mehrere Transaktionen gleichzeitig öffnen. Sie nutzen einen Modus, um jederzeit Stammdaten ändern zu können. Warum sollte ein Modus, der nicht mehr benötigt wird, geschlossen werden?",[["Viele geöffnete Modi verbrauchen mehr Ressourcen auf ihrem Rechner und verlangsamen diesen.",1],["Es kann vorkommen, dass Sie zwischen vielen geöffneten Modi nicht mehr wechseln können, da Sie beliebig viele Modi öffnen können.",0],["Es kann vorkommen, dass Daten aus Ihrem geöffneten Modus durch andere Benutzer überschrieben werden.",0],["Es kann vorkommen, dass Daten aus Ihrem geöffneten Modus durch andere Benutzer nicht bearbeitet werden können, da sie zur Bearbeitung gesperrt sind.",1]]],[1,"Sie befinden sich im SAP-System und wollen einen Stammsatz anzeigen Dazu lassen Sie sich über die Matchcode-Hilfe Werte anzeigen. Die Liste enthält, obwohl Sie sicher sind, dass der gesuchte Stammsatzvorhanden ist, diesen nicht. Woran kann dies liegen?",[["Sie haben nicht die nötigen Berechtigungen zur Anzeige des Stammsatzes.",0],["Ihre Einschränkungen in der Matchcodesuche schließen den Stammsatz aus.",1],["\"Es sind mehr Einträge vorhanden, als durch die \"\"maximale Trefferanzahl\"\" angezeigt werden können.\"",1]]],[1,"Alle Verkaufsbelege können in Form von Nachrichten ausgegeben werden. Welche Aussagen in Bezug auf Nachrichten treffen zu?",[["Über das Icon Druckansicht in der Bestellung kann die Nachricht am Bildschirm angezeigt werden.",1],["Nachrichten müssen immer sofort ausgegeben werden.",0],["Nachrichten werden in der Regel immer manuell ausgegeben. Nur in Ausnahmefällen wird ein Hintergrundjob dafür verwendet.",0],["Zur Ausgabe der Nachrichten stehen mehrere Möglichkeiten zur Verfügung. So können diese z.B. gedruckt, per Mail versendet oder gefaxt werden.",1]]],[2,"Welche der folgenden Aussagen zum Fakturabeleg sind zutreffend?",[["Die Faktura dient als Datenquelle für das Finanzwesen (FI), um den Sachbearbeiter im Rechnungswesen bei der Zahlungsüberwachung und -abwicklung zu unterstützen.",1],["Der Fakturabeleg ist in die drei Ebenen Kopf, Position und Einteilung gegliedert.",0],["Die Faktura ist ein Beleg des Bereiches Versand.",0],["Mehrere Auslieferungen können - sofern diese für die Faktura wesentliche Merkmale gemeinsam haben - zu einer Faktura zusammengefasst werden.",1]]],[2,"Sie erklären Ihrer Vertretung die Belegnummernvergabe im SAP System. In Ihrem Unternehmen werden alle Belegnummern intern vergeben. Sie erklären den Zusammenhang von Belegnummernkreis und Belegen. Welche Aussage ist richtig?",[["Einem Nummernkreis darf keine Belegart zugeordnet sein.",0],["Einer Belegart können mehrere Nummernkreise zugeordnet sein.",0],["Einer Belegart muss ein Nummernkreis zugeordnet sein.",1]]],[2,"Welche der folgenden Aussagen zum Lieferbeleg sind zutreffend?",[["Beim Anlegen des Lieferbelegs werden wichtige Informationen aus dem Kundenauftrag in den Lieferbeleg übernommen.",1],["Im Gegensatz zum Verkaufsbeleg kann der Lieferbeleg auch Einteilungen haben.",0],["Die Anlage des Lieferbelegs erfolgt in der SAP Terminologie typischerweise durch den Vertriebsmitarbeiter.",1],["Der Lieferbeleg ist das zentrale Steuerungselement im Versandprozess.",1]]],[2,"Welche der folgenden Aussagen zum Auslieferungsbeleg sind zutreffend?",[["Beim Anlegen des Auslieferungsbelges werden Daten, wie z.B. die Materialien und die bestätigten Mengen aus dem Kundenauftrag übernommen.",1],["Der Auslieferungsbeleg steuert, unterstützt und überwacht sämtliche Teilprozesse der Versandabwicklung.",1],["Wenn Sie einen Auslieferungsbeleg anzeigen möchten, dann ist folgender Pfad zu wählen Logistik -> Vertrieb -> Verkauf -> Auslieferung -> Anzeigen.",0],["Ein Auslieferungsbeleg kann nur erfasst werden, wenn vorher ein Kundenauftrag erfasst worden ist.",0]]],[2,"Häufig werden Belege mit Bezug zu Vorgängerbelegen angelegt. Mit Bezug zu welchen Vorgängerbelegen können Kundenanfragen angelegt werden?",[["Anfrage",1],["Auftrag",1],["Es ist nicht möglich eine Anfrage mit Bezug zu einem Vorgängerbeleg anzulegen.",0],["Angebot",1]]],[2,"Welche der folgenden Aussagen zu den Verkaufs- und Lieferbelegen ist richtig?",[["Lieferbelege (Auslieferungen) weisen grundsätzlich die Ebenen Kopf, Position und Einteilung auf.",0],["Aus einem Verkaufsbeleg heraus können mehrere Lieferbelege angelegt werden.",1],["Sowohl Verkaufs- als auch Lieferbelege (Auslieferungen) sind in die Ebenen Kopf, Position und Einteilung strukturiert.",0],["Jeder Position im Verkaufsbeleg entspricht genau eine Position im Lieferbeleg.",0]]],[2,"In der Anwendungskomponente (Sales & Distribution) werden verschiedene Verkaufsbelegarten unterschieden. Bei  welcher der folgenden Belegarten handelt es sich um Verkaufsbelege?",[["Gutschrift",0],["Retoure",1],["Faktura",0],["Terminauftrag",1],["Auslieferung",0]]],[2,"Verkaufsbelege sind Belege, die während des Vorverkaufs und der Auftragsbearbeitung erfasst werden. Welche der folgenden Aussagen zu den Verkaufsbelegen sind korrekt?",[["Ein Verkaufsbeleg, der einmal angelegt ist, bezieht sich immer auf einen Vertriebsbereich. Dieser ist abhängig vom Warenempfänger.",0],["Ein Verkaufsbeleg ist in die drei Ebenen Kopf, Position und Einteilung strukturiert.",1],["Die Erfassung eines Verkaufsbelegs findet in der Regel auf einem Übersichtsbild statt.",1],["Ein Verkaufsbeleg, der einmal angelegt ist, bezieht sich immer auf einen einzigen Vertriebsbereich. Dieser ist abhängig vom Auftraggeber.",1]]],[2,"Einige Belegarten bestehen aus den Ebenen Kopf, Position und Einteilung. Welche der folgenden Aussagen sind zutreffend?",[["Im Lieferplan verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",1],["Im Fakturabeleg verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",0],["Im Transportauftrag verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",0],["Im Kundenauftrag verteilen sich die Daten auf die Ebenen Kopf, Position und Einteilung.",1]]],[2,"Welche Aussagen sind zu Belegarten im Vertrieb zutreffend?",[["Die Verkaufsbelegarten steuern die Belege im Verkauf.",1],["Die Anfrageart steuert die Belege bei den Vorverkaufsaktivitäten.",0],["Die Lieferungsart steuert die Belege im Versand.",1],["Die Transportart steuert die Belege im Kommissionierungsprozess.",0],["Die Fakturaart steuert die Belege in der Fakturierung.",1]]],[3,"Sie möchten ein Kundenangebot erfassen. Welche der folgenden Aussagen sind zutreffend?",[["Bei der Anlage eines Kundenangebotes mit Bezug können sowohl einzelne Positionen der Anfrage als auch die Anfrage als ganzes in das Kundenangebot übernommen werden.",1],["Wenn mit einem Kunden individuelle Preisabsprachen existieren, dann sind bei der Angebotserstellung immer manuelle Preiseingaben erforderlich.",1],["Wird bei der Anlage eines Kundenangebotes kein Vertriebsbereich eingegeben, dann wird dieser aus den Stammdaten des Auftraggebers bzw. des Warenempfängers abgeleitet.",1],["Es ist möglich ein Kundenangebot mit Bezug auf ein anderes Kundenangebot zu erfassen.",1],["\"Über die Schaltfläche \"\"Anlegen mit Bezug\"\" können Sie nur auf bisher erfasste Anfragen zurückgreifen. Andere Belegarten können nicht als Bezugsquelle verwendet werden.\"",0]]],[3,"Wenn sie bei der Auftragsanlage keinen Warenempfänger eingeben, dann...",[["...kann der Auftrag nicht gespeichert werden.",0],["...muss der Warenempfänger bei der Auslieferung nachträglich erfasst werden.",0],["...wird automatisch der Warenempfänger gleich dem Auftraggeber gesetzt.",1]]],[3,"Über den Kundenauftrag können verschiedene Belegarten angelegt werden. Wird erneut die Transaktion VA01 (Kundenauftrag anlegen) aufgerufen, dann wird...",[["...immer die Verkaufsbelegart TA (Terminauftrag) vorgeschlagen.",0],["...wird in Abhängigkeit von den Vorbelegen (Anfrage, Kontakt, etc.) automatisch die richtige Verkaufsbelegart vorgeschlagen.",0],["...die zuletzt verwendete Verkaufsbelegart vorgeschlagen (falls im Benutzerstamm kein anderer Vorschlagswert hinterlegt ist).",1]]],[3,"Sie haben einen Kundenauftrag erfasst. Das Unvollständigkeitsprotokoll zeigt, dass die folgenden Daten fehlen: Zahlungsbedingungen, Bruttogewicht, Versandstelle und Auslieferungswerk. Welche der folgenden Aussagen sind in diesem Zusammenhang zutreffend?",[["Die oben angeführten Daten müssen (solange die Stammdaten nicht entsprechend gepflegt sind) bei der Auftragsanlage jedes Mal manuell erfasst werden.",1],["Die Funktionen des Unvollständigkeitsprotokoll gibt es in der Anwendungskomponente SD (Sales & Distribution) ausschließlich im Kundenauftrag und in der Lieferung.",1],["\"Den Begriff \"\"Unvollständigkeitsprotokoll\"\" gibt es in der SAP Terminologie nicht. Die oben angeführten Sachverhalte werden stattdessen im sog. Fehlerprotokoll ausgewiesen.\"",0],["Im Customizing ist eingestellt, welche Felder zum Unvollständigkeitsprotokoll gehören.",1]]],[3,"Sie haben einen Kundenauftrag angelegt. Dieser umfasst 2 Positionen. Welche der folgenden Aussagen sind zutreffend?",[["\"Mit einem Doppelklick auf eine Position gelangen sie in die Positionsebene. Auf der Registerkarte \"\"Konditionen\"\" können sie das Preisfindungsschema für die Position einsehen.\"",1],["Sie markieren die Position, deren Preisfindung sie analysieren möchten. Anschließend wählen Sie im Menü Springen/Position/Konditionen.",1],["Es ist nicht möglich, die Preisfindung aus der Anwendungskomponente SD heraus zu analysieren. Die Analyse der Preisfindung erfolgt über das Controlling.",0],["\"Es ist nicht möglich, aus der Transaktion \"\"Kundenauftrag anlegen\"\" heraus, die Preisfindung des Kundenauftrages als ganzes (Position 10 und 20 zusammengefasst) zu analysieren.\"",1]]],[3,"Wenn sie bei der Auftragsanlage im Einstiegsbild keine Organisationsdaten (Verkaufsorganisation, Vertriebsweg, etc.) eingeben, dann...",[["...wird der Auftrag ohne Organisationsdaten gespeichert.",0],["...werden die Organisationsdaten der letzten Auftragsanlage übernommen.",0],["...leitet das System den Vertriebsbereich automatisch aus dem Kundenstamm ab.",1]]],[3,"Welche der folgenden Vorschlagswerte im Terminauftrag werden aus den Konditionssätzen übernommen?",[["Rabatt",1],["Lieferkondition",0],["Fracht",1],["Preise",1],["Volumen",0]]],[3,"Sie legen einen Auftrag für den Kunden 200901 an. Sie sind sich nicht sicher, ob dieser Kunde Teillieferungen akzeptiert oder auf Komplettlieferungen besteht. Welche der folgenden Aussagen ist in diesem Zusammenhang zutreffend?",[["In der Lieferanten-Material-Info kann auf Einteilungsebene festgelegt werden, ob die Auftragsmenge gesplittet werden darf.",0],["Das Kennzeichen Komplettlieferung oder Teillieferung finden Sie im Kundenauftrag auf Einteilungsebene.",0],["Aus der Auftragsanlage heraus (Registerkarte: Versand) ist ersichtlich, ob Teillieferungen erlaubt sind.",1]]],[3,"Jeder Vertriebsbeleg enthält eine Vielzahl von Daten. Welche Aussagen sind in diesem Zusammenhang zutreffend?",[["Ein Kundenauftrag kann niemals Datenquelle für eine Auslieferung sein.",0],["Vorschlagswerte in Vertriebsbelegen können aus Vorgängerbelegen und auch aus den Stammdaten übernommen werden.",1],["Ein großer Teil der Daten wird automatisch aus verschiedenen Quellen übernommen. Diese Daten können manuell überschrieben werden.",1],["Die allgemeinen Daten im Kundenstamm sind bei der Anlage eines Vertriebsbelegs belanglos.",0]]],[3,"Ein Auftrag besteht, wie auch andere Verkaufsbelege, aus einem Belegkopf und einer oder mehreren Positionen, wobei jede dieser Positionen aus einer oder mehreren Einteilungen besteht. Welche Aussagen treffen in diesem Zusammenhang zu?",[["Der Belegkopf übersteuert immer die Einstellungen in den Positionsdetails.",0],["Die im Belegkopf stehenden Informationen wie die Zahlungsbedingungen gelten für den gesamten Auftrag.",1],["Im Belegkopf hinterlegte Informationen haben keine Auswirkung auf die Belegpositionen.",0],["In den Positionen eines Auftrags können zusätzliche Informationen gepflegt werden, die im Belegkopf nicht vorhanden sind.",1]]],[3,"Sie legen eine Auslieferung mit Bezug zu einem Kundenauftrag an. Der Kundenauftrag verfügt über 3 Einteilungen. Welche der folgenden Aussagen sind zutreffend?",[["Die Anzahl der Einteilungen im Lieferbeleg hängt auch davon ab, ob mit dem Kunden eine Teillieferungsvereinbarung existiert.",0],["Es werden nur Einteilungen mit bestätigten Mengen berücksichtigt.",1],["Der Lieferbeleg hat in der Folge mindestens 3 Einteilungen.",0]]],[3,"Der zentrale Schritt im Vertriebsprozess ist die Anlage eines Kundenauftrages. Welche der folgenden Aussagen zum Kundenauftrag sind zutreffend?",[["\"Wird ein Kundenauftrag \"\"mit Bezug\"\" angelegt, dann werden die meisten Daten des Vorgängerbelegs in den Auftrag übernommen (Gewichtung 1).\"",1],["Änderungen in den Kopfdaten des Kundenauftrags werden automatisch in bereits erfasste Auftragspositionen übernommen.",1],["Bereits bei der Anlage des Kundenauftrages werden bestimmte Daten für den Versand vom System ermittelt.",1],["Bereits bei der Anlage des Kundenauftrages wird auf das Konditionsschema zurückgegriffen und ein entsprechender Verkaufspreis errechnet.",0]]],[3,"Sie haben bei der Auftragsanlage die folgenden Organisationsdaten eingegeben (siehe Abbildung). Welche der folgenden Aussagen ist zutreffend?",[["Der Auftrag kann erst dann erfasst werden, wenn auch die fehlenden Organisationsdaten (Verkaufsbüro und Verkäufergruppe) eingegeben worden sind.",0],["Im Customizing kann eingestellt werden, dass bei der nachfolgenden Erfassung des Auftrages nur Materialien der Sparte 01 erfasst werden können.",1],["Die Auftragsart TA bedeutet, dass der Auftrag unverzüglich - nachdem uns der Kunde einen Wunschliefertermin mitgeteilt hat ausgeführt werden muss.",0]],"bild4.jpg"],[3,"Sie legen einen Kundenauftrag an. Dabei möchten Sie auch Materialien unterschiedlicher Sparten erfassen. Bewerten Sie die folgenden Aussagen zur Kundenauftrags-Bearbeitung.",[["Falls Sie bei der Auftragsanlage keine Sparte eingegeben haben, wird die Sparte aus dem Materialstamm der ersten Auftragsposition ermittelt.",0],["Im Customizing kann festgelegt werden, dass auch Materialien unterschiedlicher Sparten (spartenübergreifender Verkauf) in einem Verkaufsbeleg erfasst werden.",1],["Jeder Verkaufsbeleg muss einem Vertriebsbereich zugeordnet sein. Es ist daher nicht möglich, in einem Verkaufsbeleg Materialien unterschiedlicher Sparten zu erfassen.",0],["Wenn Sie bei Auftragsanlage keine Sparte eingegeben haben, dann wird die Sparte aus dem Kundenstammsatz des Auftragsgebers ermittelt.",1]]],[4,"Die Partnerrollen zum Kundenstamm werden im Kundenstamm bei den Vertriebsbereichsdaten hinterlegt. Kreuzen Sie an, welche der gegebenen Partnerrollen für eine komplette Verkaufs- und Vertriebsabwicklung (inkl. Faktura) zwingend erforderlich sind?",[["Warenempfänger",1],["Regulierer",1],["Ansprechpartner",0],["Auftraggeber",1],["Spediteur",0]]],[4,"Ihr Unternehmen besteht aus verschiedenen Organisationsebenen, die im SAP System abgebildet sind. Was bedeutet dies für die Anlage der Sicht Grunddaten von Materialstammsätzen?",[["Sie müssen pro Werk angelegt werden.",0],["Sie müssen pro Buchungskreis angelegt werden.",0],["Sie werden pro Mandant angelegt.",1]]],[4,"Sie möchten einen Auftrag erfassen. Welche der folgenden Aussagen zu den Partnerrollen sind richtig?",[["Der Auftraggeber kann sowohl auf Kopfebene als auch auf Positionsebene im Beleg festgelegt werden.",0],["Es ist möglich, einem Kundenstammsatz mehrere Warenempfänger zuzuordnen. Bei der Auftragserfassung muss der Bearbeiter den jeweiligen Warenempfänger auswählen.",1],["Aufträge, mit denen ausschließlich Dienstleistungen abgewickelt werden, brauchen keinen Warenempfänger, da auch keine Lieferung angelegt werden muss.",0],["Auftraggeber, Regulierer, Rechnungsempfänger und Warenempfänger werden immer aus dem Kundenstamm ermittelt, können aber auch im Kopf des Auftrages geändert werden.",1]]],[4,"Sie haben im Kundenstammsatz bei den Partnerrollen mehrere Warenempfänger hinterlegt. Welche der folgenden Aussagen ist zutreffend?",[["Es ist möglich, in einem Kundenstammsatz mehr als einen Warenempfänger zu hinterlegen.",1],["Aufträge, mit denen ausschließlich Dienstleistungen abgewickelt werden, brauchen keinen Warenempfänger, da auch keine Lieferung angelegt werden muss.",0],["Sollte bis zur Auftragsanlage kein Warenempfänger eingegeben worden sein, dann wird im SAP System standardmäßig der Warenempfänger gleich dem Auftraggeber gesetzt.",1],["Es ist nicht möglich, einen lieferrelevanten Auftrag ohne Warenempfänger anzulegen.",1]]],[4,"Die Materialnummer kann extern eingegeben werden. Welche Aussage zur externen Nummernvergabe trifft zu?",[["Die Materialnummer kann aus beliebig vielen Stellen bestehen.",0],["Es dürfen nur Ziffern verwendet werden.",0],["Die Materialnummer kann aus Buchstaben und Ziffern bestehen.",1],["Es dürfen nur Buchstaben verwendet werden.",0]]],[4,"Die Materialart steuert bei der Anlage von Materialien unter anderem folgende Dinge.",[["Die Art der Nummernvergabe.",1],["Die Sichten, die zum Erfassen angeboten werden.",1],["Die zulässige Beschaffungsart.",1],["Den Lagerort.",0]]],[4,"Welche der folgenden Aussagen zu den Materialstammdaten sind zutreffend?",[["\"Der Lagerort wird in den Materialstammdaten auf der Registerkarte \"\"Fakturendisposition\"\" hinterlegt.\"",0],["Jedes Material kann - über alle Vertriebsbereiche hinweg - nur einer einzigen Sparte zugeordnet werden.",0],["Durch Customizingeinstellungen können innerhalb einer Registerkarte verschiedene Felder zu Musseingabefeldern gemacht werden.",1],["Jedem Materialstammsatz ist eine Materialart zugeordnet.",1]]],[4,"Sie haben die Materialstammdaten des Materials MAT-4711 auf ein neues Material MAT-4712 kopiert. In der Folge stellen sie fest, dass nur ein Teil der Daten auf den neuen Materialstamm kopiert wurden. Was könnten die Ursachen dafür sein?",[["Sie haben bei der Sichtenauswahl nur einen Teil der Sichten ausgewählt, die kopiert werden sollen.",1],["Sie haben versäumt anzugeben, von welcher Vertriebssicht des Vorlagematerials sie die Stammdaten kopieren möchten.",0],["Sie haben nicht alle Registerkarten, deren Inhalte sie kopieren wollen, markiert.",1],["Es können nur die Grunddaten von einem Materialstamm auf einen anderen Materialstamm kopiert werden, andere Sichten müssen manuell nachgezogen werden.",0]]],[4,"Der Kundenstamm ist unterteilt in Allgemeine Daten, Vertriebsbereichsdaten und Buchungskreisdaten. Zur besseren Pflege der Daten sind diese auf verschiedene Registerkarten aufgeteilt. Welche der folgenden Registerkarten gehören zu den Kundenstamm Vertriebsbereichsdaten?",[["Faktura",1],["Partnerrollen",1],["Abladestellen",0],["Versand",1],["Exportdaten",0]]],[4,"Das Material MAT-4711 wird über verschiedene Verkaufsorganisationen (V100 und V200) und verschiedene Vertriebswege (V1, V2 und V3) verkauft. Welche der folgenden Aussagen ist zutreffend?",[["Bei jeder beliebigen Kombination aus Verkaufsorganisation und Vertriebsweg wird auf die gleichen Vertriebsbereichsdaten zurückgegriffen.",0],["Sollen für verschiedene Kombinationen aus Verkaufsorganisation und Vertriebsweg unterschiedliche Vertriebsstammdaten gelten, dann müssen diese vorher erfasst werden.",1],["Bei jeder beliebigen Kombination aus Verkaufsorganisation und Vertriebsweg wird auf die gleichen Allgemeinen Daten (Registerkarten Grunddaten 1, Grunddaten2) zurückgegriffen.",1],["Die Stammdaten aus einer beliebigen Kombination aus Verkaufsorganisation und Vertriebsweg können bei der Anlage der Vertriebsicht auch auf neue Vertriebsbereiche kopiert werden.",1]]],[4,"Die Muster GmbH hat 2 Vertriebsbereiche (A und B) angelegt. Im Vertriebsbereich A sind zwei Vertriebswege vorgesehen (Einzelhandel und Großhandel), im Vertriebsbereich B ist ein Vertriebsweg (Wiederverkäufer) vorgesehen. Der Kunde Name 200901 wird über beide Vertriebsbereiche bedient. Die allgemeinen Daten zum Debitor 200901 müssen...",[["...mindestens zweimal angelegt sein.",0],["...dreimal angelegt sein.",0],["...nur einmal angelegt sein.",1]]],[4,"Welche der folgenden Aussagen zu den Kundenstammdaten sind zutreffend?",[["Die Vertriebsbereichsdaten im Kundenstamm sind für alle Vertriebsbereiche ident.",0],["In den Vertriebsbereichsdaten eines Kundenstammes können mehrere Warenempfänger eingetragen sein.",1],["Die Vertriebsbereichsdaten sind von der gewählten Kombination aus Verkaufsorganisation, Vertriebsweg und Sparte abhängig.",1],["Durch Customizingeinstellungen können innerhalb einer Registerkarte verschiedene Felder ausgeblendet werden.",1]]],[4,"Die Muster GmbH verfügt über 2 Verkaufsorganisationen (Verkaufsorganisation V100 und V200). Sie möchten den Kunden 200901 über beide Verkaufsorganisationen beliefern. Die Verkaufsorganisaton V200 hat mit dem Kunden jedoch andere Incoterms vereinbart als die VerkaufsorganisationV100. Welche der nachfolgenden Aussagen sind zutreffend?",[["Einem einzelnen Unternehmen (hier Muster GmbH) kann nur eine einzige Verkaufsorganisation zugeordnet werden.",0],["Eine Kombination aus Verkaufsorganisation, Vertriebsweg und Sparte ergibt einen Vertriebsbereich.",1],["Es ist möglich für unterschiedliche Verkaufsorganisationen unterschiedliche Incoterms im Kundenstamm zu pflegen.",1],["Im SAP System ist es standardmäßig nicht vorgesehen, dass verschiedene Verkaufsorganisationen mit ein und demselben Kunden unterschiedliche Incoterms vereinbaren.",0]]],[4,"Welche der folgenden Aussagen zu den Partnerrollen ist zutreffend?",[["Der Regulierer ist für die Bezahlung der Rechnung zuständig.",1],["Rechnungsempfänger und Regulierer sind immer identisch.",0],["Auftraggeber und Regulierer sind immer identisch.",0]]],[4,"Zum Kunden 200901 und zum Material MAT-4711 existiert eine Kunden-Material-Info. Welche der folgenden Aussagen ist zutreffend?",[["Sind im Materialstamm MAT-4711 und in der Kunden-Material-Info abweichende Daten enthalten, dann werden bei der Belegbearbeitung die Daten des Materialstamms denen der Kunden-Material-Info vorgezogen.",0],["Sind im Kundenstamm 200901 und in der Kunden-Material-Info abweichende Daten enthalten, dann werden bei der Belegbearbeitung die Daten des Kundenstammes denen der Kunden-Material-Info vorgezogen.",0],["Wenn sie einen Auftrag für den Besteller 200901 erfassen, dann können Sie die einzelnen Bestellpositionen auch mit der Materialnummer des Kunden erfassen.",1],["Die Kunden-Material-Info wird verwendet, um Daten eines bestimmten Kunden und eines bestimmten Materials zu kombinieren.",1]]],[4,"Zum Anlegen des Materialstammes müssen Sichten ausgewählt werden. Welche Aussagen zu den Sichten treffen zu?",[["Es besteht kein Zusammenhang zwischen der Materialart und den auswählbaren Sichten.",0],["Der Pflegestatus gibt Auskunft über aktuell gepflegte Sichten.",1],["Alle relevanten Sichten müssen beim Erstanlegen ausgewählt werden, da weitere Sichten zu einem späteren Zeitpunkt nicht mehr hinzugefügt werden können.",0],["Die Sichten im Materialstamm verringern die Komplexität der dann enthaltenen Informationen, da sie dadurch in logische Gruppen unterteilt werden.",1]]],[5,"Welche der folgenden Aussagen im Zusammenhang mit der Reklamationsbearbeitung ist zutreffend?",[["Beim Anlegen mit Bezug müssen immer alle Positionen des Referenzbeleges mit ihrer vollen Menge übernommen werden.",0],["Eine Rechnungskorrekturanforderung erfordert immer eine Faktura als Referenzbeleg.",1],["Ein Retourenvorgang kann immer erst dann fakturiert werden, wenn die Wareneingangsbuchung zur Retourenlieferung erfolgt ist.",0]]],[5,"Welche der folgenden Aussagen zur Retouren- und Gutschriftsabwicklung sind zutreffend?",[["Retoure, Gutschriftsanforderung, Lastschriftsanforderung und die Rechnungskorrekturanforderung sind Verkaufsbelegarten.",1],["Gut-/Lastschriften werden mit Bezug auf die Faktura angelegt.",1],["\"Sogenannte \"\"Rabattgutschriften\"\" können auch ohne Bezug auf die Faktura angelegt werden.\"",0],["Die Fakturierung einer Rechnungskorrekturanforderung erfolgt (im SAP Standardsystem) nach vorhergehender Prüfung und Genehmigung.",1]]],[5,"Einem Kunden wurde ein individuell ausgehandelter Rabatt nicht in voller Höhe abgezogen. Welche der folgenden Aussagen sind in dieser Situation zutreffend?",[["Sie legen eine Rechnungskorrekturanforderung an und fakturieren diese.",1],["Um obigen Vorgang mit einer Faktura abschließen zu können, ist ein eigener Genehmigungsschritt erforderlich.",1],["\"Sie legen eine sog. \"\"Rabattgutschrift\"\" an und fakturieren diese.\"",0],["Nachdem es sich um einen individuell ausgehandelten Rabatt handelt, hat der Kunde keinen Anspruch auf eine Gegenleistung.",0]]],[5,"Im Rahmen der Retouren- und Gutschriftsabwicklung sind Sie mit einer Reihe von Belegen konfrontiert. Welche der folgenden Aussagen sind in diesem Zusammenhang zutreffend?",[["Die Rechnungskorrekturanforderung ist ein Verkaufsbeleg, der verwendet wird wenn z.B. aufgrund von Mengen- oder Preisdifferenzen der Kunde eine Gutschrift haben möchte.",1],["\"Die sog. \"\"Rabattgutschrift\"\" wird verwendet, wenn bei der Fakturierung irrtümlicherweise der vereinbarte Rabatt nicht berücksichtigt worden ist.\"",0],["Gut- und Lastschriften sind Fakturenbelege.",1],["Die Retoure ist ein Lieferbeleg für die Rücksendung der Ware.",0]]],[5,"Der Kunde 200901 hat bei ihnen 13 Stück des Materials MAT-4711 gekauft Sie haben die Auslieferung getätigt und der Kunde hat bereits bezahlt. Nun meldet sich der Kunde mit einer Reklamation, da 1 Stück des Materials fehlerhaft ist. Sie einigen sich mit dem Kunden darauf, dass er das fehlerhafte Material behalten kann und den Preis für diesen Artikel gutgeschrieben. Klicken Sie die Aktivitäten an die notwendig sind, um obigen Vorgang im SAP System abbilden zu können.",[["Eine Gutschriftsanforderung anlegen.",1],["Eine Gutschrift anlegen.",1],["Eine Retoure anlegen.",0],["Eine Kommissionierung durchführen.",0],["Eine Wareneingangsbuchung durchführen.",0]]],[6,"Im Rahmen der Anzeige von Materialstammsätzen können über die Sicht Lagerortbestand auch Informationen über Bestände angezeigt werden. Welche Aussagen sind zutreffend?",[["Der gesamte, frei verwendbare Werksbestand kann angezeigt werden.",0],["Der Bestand für die jeweiligen Lagerorte kann angezeigt werden.",1],["Der reservierte Bestand für den jeweiligen Kunden kann angezeigt werden.",0],["Die Verbrauche der einzelnen Perioden werden angezeigt.",0]]],[6,"Sie befinden sich in der Bestandsübersicht (Transaktion MMBE) und möchten sich alle Bestände in Ihrem Werk zu einem bestimmten Material anzeigen lassen. Sie finden eine erhebliche Menge im Qualitätsprüfstand vor. Welche Aussage bezüglich dieser Bestandsart ist richtig?",[["Der Qualitätsprüfstand besteht lediglich aus der Summe der zu prüfenden Stichproben des Materials, der Rest der Wareneingänge wird bis zur Entscheidung über Annahme oder Rückweisung der Prüflose in den gesperrten Bestand gebucht.",0],["Der Qualitätsprüfstand beinhaltet auch die Lieferungen der Konsignationslieferanten. Erst nach erfolgter Freigabe durch das Qualitätsmanagement findet eine Umbuchung in den Konsignationsbestand statt.",0],["Über den Qualitätsprüfstand kann physisch erst nach einer Freigabe durch das Qualitätsmanagement verfügt werden, dispositiv ist dieser Bestand jedoch bereits jetzt verfügbar.",1]]],[6,"In der Bestandsübersicht (Transaktion MMBE) können Sie sich über den Gesamtbestand eines Materials informieren. Welche Informationen werden dort u.a. angezeigt?",[["\"Über den Menüeintrag \"\"Umfeld\"\" können z.B. alle offenen Bestellungen zu diesem Material aufgerufen werden.\"",1],["Es wird u.a. der sofort verfügbare Bestand des Materials angezeigt.",0],["Es wird u.a. der frei verwendbare Bestand des Materials angezeigt.",1]]],[6,"In der Bestandsübersicht wird Ihnen angezeigt, welche Menge von welchem Material vorrätig ist. Auf welcher Ebene werden die Bestände aus Sicht der Bestandsführung in einem SAP-System mengenmäßig geführt?",[["Auf der Lagerplatz-Ebene.",0],["Auf der Lagernummer-Ebene.",0],["Auf der Lagerort-Ebene.",1]]],[6,"Die Bewertung der Materialien erfolgt auf Ebene...",[["...des Lagerortes.",0],["...der Versandstelle.",0],["...des Werkes.",1],["...der Transportdispositionsstelle.",0]]],[7,"Welche der folgenden Aussagen zur SAP Terminologie ist zutreffend?",[["Die Begriffe Verkauf, Versand und Vertrieb werden in der SAP-Terminologie synonym verwendet.",0],["Die Begriffe Belege und Nachrichten werden in der SAP Terminologie synonym verwendet.",0],["Der Begriff Vertrieb (im SAP/R3 System) umfasst ausschließlich die Bereiche Verkauf und Versand.",0],["Nachrichten sind Informationen, die über verschiedene Medien, z.B. Mail, EDI oder Fax übermittelt werden.",1]]],[7,"Wählen Sie die richtige Reihenfolge des Vertriebszyklus.",[["Presales-Aktivitäten, Auftragsabwicklung, Bestandsführung, Lieferung, Fakturierung, Kundenzahlung",1],["Presales-Aktivitäten, Auftragsabwicklung, Kundenzahlung, Lieferung, Fakturierung, Bestandsführung",0],["Bestandsführung, Lieferung, Presales-Aktivitäten, Kundenzahlung, Fakturierung, Auftragsabwicklung",0]]],[7,"Die Anwendungskomponente Vertrieb (SD) des SAP Systems unterstützt den Vertriebssachbearbeiter bei der Abwicklung der Kundenaufträge, und zwar...",[["...von den Vorverkaufsaktivitäten bis hin zur Fakturierung an den Kunden.",1],["...von den Vorverkaufsaktivitäten bis hin zur Anlage eines Erlöskontos.",0],["...von den Vorverkaufsaktivitäten bis hin zur Definition einer Vertriebsstückliste.",0],["...von den Vorverkaufsaktivitäten bis hin zur Lieferantenbeurteilung.",0]]],[7,"Der Begriff Logistik bzw. Logistikmodule bezieht sich in der SAP Terminologie ausschließlich auf...",[["...den Beschaffungs- und Lagerbereich (Anwendungskomponente: Materials Management).",0],["...auf den Vertriebs- und Beschaffungs- und Lager- und Produktionsbereich (Anwendungskomponenten: SD, MM und PP).",1],["...den Produktionsbereich (Anwendungskomponente: SD und MM).",0],["...auf den Vertriebs- und Beschaffungs- bzw. Lagerbereich (Anwendungskomponenten: SD und MM).",0],["...den Vertriebsbereich (Anwendungskomponente: Sales and Distribution).",0]]],[7,"Welche der folgenden Aussagen zum Kommissionierungsvorgang ist zutreffend?",[["Der eigentliche Kommissioniervorgang ist Bestandteil der Anwendungskomponente MM (Materials Management).",0],["Um die Kommissionierung zu erleichtern, werden im SAP/R3 System sog. Kommissionierlisten erstellt.",1],["Durch den Einsatz des Vertriebsmoduls (Sales & Distribution) steigt der Bedarf an Kommissionen im Unternehmen.",0]]],[7,"Welche der folgenden Aussagen zur Warenausgangsbuchung sind zutreffend?",[["Die Warenausgangsbuchung kann erst dann erfolgen, wenn der Beleg vollständig kommissioniert ist.",1],["Die Warenausgangsbuchung (im Rahmen des Vertriebsprozesses) hat nur in den Logistikmodulen des SAP Systems Konsequenzen.",0],["Das SAP System ist grundsätzlich so voreingestellt, dass die Warenausgangsbuchung automatisch nach der Erstellung der Faktura erfolgt.",0],["Durch die Warenausgangsbuchung wird der mengenmäßige Lagerbestand aktualisiert.",1]]],[7,"Welche der folgenden Belege betreffen die Versandabwicklung?",[["Auslieferung",1],["Terminauftrag",0],["Transportauftrag",1],["Kontrakt",0]]],[7,"Der Vertriebsprozess umfasst eine Reihe verschiedener Aktivitäten. Welche der folgenden Aussagen zum SAP Vertriebsprozess (Anwendungskomponente SD) ist zutreffend?",[["Der Vertriebsprozess endet mit der Verbuchung der Zahlungseingänge des Kunden.",0],["Die einzelnen Schritte des Vertriebsprozesses können durch einzelne miteinander verknüpfte, elektronische Belege dargestellt werden.",1],["Der Vertriebsprozess umfasst die Bereiche Verkauf und Versand.",0],["Die Kundenauftragsabwicklung beginnt immer mit der Auftragsanlage.",0]]],[7,"Welche Aussagen zu Aufträgen und Auslieferungen treffen zu?",[["Ein einzelner Kundenauftrag kann nur zu einer einzigen Auslieferung führen.",0],["Es ist möglich Einzelpositionen - aus mehreren Aufträgen - zu einer einzigen Auslieferung zusammenzufassen.",1],["Es ist möglich, Auslieferungen als Hintergrund-Job anzulegen.",1],["Es ist möglich mehrere Aufträge zu einer einzigen Auslieferung zusammenzufassen.",1]]],[7,"\"Sie befinden sich in der Ansicht \"\"Belegfluß anzeigen\"\". Welche der folgenden Aussagen sind zutreffend?\"",[["Mit einem Doppelklick auf eine bestimmte, markierte Zelle, gelangen sie zu den Detailinformationen des Beleges.",1],["\"In der Ansicht \"\"Belegfluß\"\" anzeigen, finden Sie nur die Belege, die mit Bezug den anderen Belegen angelegt worden sind.\"",1],["Egal von welcher Transaktion aus (Anfrage, Angebot, Faktura, etc.) Sie die Ansicht Belegfluß aufrufen, erhalten Sie immer die gleiche Sicht auf die Vorgänger- und Nachfolgebelege.",0],["\"Wenn Sie die Schaltfläche \"\"Statusübersicht\"\" anklicken und die Funktion \"\"komplett expandieren\"\" aufgerufen worden ist, dann finden Sie die Positionsstati des Materials.\"",0]]],[7,"Sie finden den gegebenen Ausschnitt auf ihrem Bildschirm vor. Welche der folgenden Aussagen ist zutreffend?",[["Bei der gegebenen Darstellung handelt es sich um eine Systemnachricht.",0],["\"Bei der gegebenen Darstellung handelt es sich um das Bildschirmbild \"\"Statusübersicht\"\".\"",1],["\"Bei der gegebenen Darstellung handelt es sich um das Bildschirmbild \"\"Belegfluss\"\".\"",0]],"bild1.jpg"],[7,"Im Rahmen der Abwicklung des Vertriebsprozesses kommt es zu einer Reihe von Arbeitsschritten. Welche der folgenden Arbeitsschritte gehören zum Vertriebsprozess (Anwendungskomponente SD)?",[["Fakturierung",1],["Ermittlung der Lieferanten",0],["Rechnungsprüfung",0],["Angebotserstellung",1],["Versand",1]]],[7,"Welche der folgenden Aussagen zur Faktura sind zutreffend?",[["Auslieferungen werden nur dann bei der Fakturierung berücksichtigt, wenn der Warenausgang bereits verbucht wurde.",1],["Beim Anlegen der Faktura werden die Sachkonten automatisch fortgeschrieben. (Im Hauptbuch wird das Debitorenkonto des Kunden belastet, das Ertragskonto und eventuelle Steuerkonten werden entlastet).",1],["Das SAP System ist so voreingestellt, dass im Zuge der Erstellung der Faktura auch die Warenausgangsbuchung erfolgt.",0],["Die Fakturierung erfolgt in der Anwendungskomponente FI.",0]]],[7,"Sie finden den gegebenen Ausschnitt auf ihrem Bildschirm vor. Welche der folgenden Aussagen sind zutreffend?",[["Die Auslieferung wurde bereits gesichert aber noch kein Warenausgang gebucht.",1],["Die Auslieferung wurde noch nicht kommissioniert.",1],["\"Die Kommissionierung für die betreffende Lieferung wird durch die Pflege der Lagernummer und die Folgefunktion \"\"Transportauftrag anlegen\"\" durchgeführt.\"",0],["Aufgrund der gegebenen Abbildung kann nicht gesagt werden, ob die Auslieferung - mit oder ohne Bezug zu einem Vorgängerbeleg - angelegt worden ist.",1]],"bild2.jpg"],[7,"Der zentrale Schritt im Vertriebsprozess ist die Anlage eines Kundenauftrages. Welche der folgenden Aussagen zum Kundenauftrag sind richtig?",[["Ein im SAP/R3 System erfasstes Angebot, kann zur Anlage mehrerer Kundenaufträge führen.",1],["Die Anlage eines Kundenauftrages erfolgt in der SAP-Terminologie typischerweise durch den Verkäufer.",1],["Im SAP/R3 System ist es möglich, mehrere erfasste Angebote an einen Kunden (zu verschiedenen Materialien und/oder Dienstleistungen), zu einem einzigen Kundenauftrag zusammenzuführen.",1],["Ein Auslieferungsbeleg kann nur mit Bezug zu einem Kundenauftrag angelegt werden.",0],["Der Kundenauftrag ist das zentrale Steuerungselement des gesamten Vertriebsprozesses.",1]]],[7,"Welche der folgenden Aussagen zum Belegfluss sind zutreffend? Mit Hilfe des Belegflusses...",[["...kann der Fortschritt des Kundenauftrages überblickt werden.",1],["...können die Vorgängerbelege angezeigt werden.",1],["...kann direkt in den Beleg verzweigt werden.",1],["\"...die Durchführung der Funktion \"\"Belegfluß\"\" bzw. \"\"Belegfluß anzeigen\"\" erfordert standardmäßig einen eigenen Genehmigungsschritt.\"",0]]],[7,"Sie haben eine Anfrage eines Kunden erhalten. Welche der folgenden Aussagen sind in diesem Zusammenhang zutreffend?",[["Neben der Anfrage umfasst die Vorverkaufsphase die Belege Angebot und Kundenauftrag.",0],["Angebote können auch erstellt werden, ohne dass eine Anfrage von Kunden vorausgegangen ist.",1],["Die Anfrage kann als Grundlage für ein späteres Angebot herangezogen werden. Die angefragten Materialien müssen dadurch nicht erneut eingegeben werden.",1],["Bevor im SAP/R3 System ein Angebot erfasst werden kann, ist es erforderlich, dass eine entsprechende Anfrage erfasst worden ist.",0]]],[7,"Welche der folgenden Aussagen zum Belegfluss sind zutreffend?",[["Mit Doppelklick auf eine bestimmte Zeile (der Darstellung Belegfluss), kann das Positionsdetail des Beleges angezeigt werden.",1],["Nur wenn die Belege eines bestimmten Vertriebsprozesses mit Bezug zueinander angelegt wurden, ist es möglich, sich den zugehörigen (zusammenhängenden) Belegfluss anzusehen.",1],["Der Belegfluss zeigt die Historie aufeinander folgender Belege an.",1],["Die Statusübersicht zeigt unter anderem auch den Sachbearbeiter, der den jeweiligen Beleg in den Blegfluss gelegt hat.",0],["Jeder Vorgang im Vertrieb sollte über einen eigenen Belegnummerkreis verfügen.",1]]],[7,"Welche der folgenden Aussagen zum Vertriebsprozess sind zutreffend?",[["Daten aus der Vertriebsabwicklung können direkt in andere Bereiche wie zum Beispiel Materialwirtschaft (MM) und Rechnungswesen (FI, CO) übernommen werden.",1],["Die Statusübersicht gibt den Bearbeitungsstand verschiedener Teilschritte der Vertriebsaktivität wieder.",1],["Jede im SAP System vorgenommene und gesicherte Vertriebsaktivität wird durch einen Beleg dokumentiert.",1],["Der Begriff Vertrieb (im SAP System) umfasst ausschließlich die Bereiche Verkauf und Versand.",0]]],[7,"Welche Funktionen der Beschaffung können direkt aus dem bzw. durch den Kundenauftrag ausgelöst werden ?",[["Übergabe der Bedarfe an die Disposition.",1],["Organisation und Überwachung des Prozesses der Fremdbeschaffung.",0],["Prüfung der Verfügbarkeit der georderten Materialien.",1],["Kommunikation mit der Disposition bzw. die Steuerung, wie Kundenbedarfe abgedeckt werden sollen, z.B. aus dem Lagerbestand durch Fremdbeschaffung, durch Eigenfertigung etc.",0]]],[7,"\"Sie legen eine Auslieferung an. Danach klicken sie das Icon \"\"Belegfluss anzeigen\"\", um sich über den bisherigen Verlauf des Geschäftsfalles zu informieren. Welche der folgenden Informationen können Sie dem Bild Belegfluss entnehmen?\"",[["Den Sachbearbeiter, der den Beleg angelegt hat.",0],["Den Gesamtbearbeitungsstatus.",0],["Die Belegart.",1],["Den (die) Vorgängerbelege.",1]]],[7,"Sie finden den gegebenen Ausschnitt auf ihrem Bildschirm vor. Welche der folgenden Aussagen ist zutreffend?",[["\"Sie befinden sich in der Transaktion \"\"Kommissionierung ändern\"\".\"",0],["\"Sie befinden sich in der Transaktion \"\"Auslieferung ändern\"\".\"",1],["\"Sie befinden sich in der Transaktion \"\"Terminauftrag anlegen\"\".\"",0],["Die Warenausgangsbuchung ist noch ausständig.",1]],"bild2.jpg"],[7,"\"Welche der folgenden Aussagen zum \"\"Kundenauftrag\"\" sind zutreffend?\"",[["\"Der \"\"Kundenauftrag\"\" enthält die relevanten Informationen, die für die Kundenauftragsabwicklung nötig sind.\"",1],["Die Daten in einem Verkaufsbeleg verteilen sich immer ausschließlich auf die bei den Ebenen Kopf und Position.",0],["\"Im \"\"Kundenauftrag\"\" werden alle georderten Waren oder Dienstleistungen eines Kunden erfasst.\"",1],["\"Die Transaktion zum Anlegen eines Kundenauftrags befindet sich im \"\"Versand und Transport\"\" Bereich des Easy Access Menüs.\"",0]]],[7,"Sie möchten eine Kundenanfrage erfassen. Welche der folgenden Aussagen ist zutreffend?",[["Wenn sie bei der Anlage der Anfrage keinen Vertriebsbereich eingeben, dann wird dieser automatisch aus den Stammdaten des Rechnungsempfängers bzw. Regulierers abgeleitet.",0],["Existieren zu einem Auftraggeber bzw. Warenempfänger mehrere Vertriebsbereiche, dann erhalten Sie (wenn sie nicht sofort auf dem Einstiegsbild den Vertriebsbereich eingegeben haben) ein Dialogfenster mit den verschiedenen Vertriebsbereichen.",1],["Sie müssen zuallererst auf dem Einstiegsbild die Verkaufsorganisation, den Vertriebsweg und die Sparte eingeben.",0]]],[7,"Sie legen einen Kundenauftrag an. Sie haben sich für die Verkaufsbelegart Terminauftrag (TA) entschieden. Welche der folgenden Aussagen ist in diesem Zusammenhang zutreffend?",[["Kreditprüfung, Preisfindung, Verfügbarkeitsprüfung und andere Funktionen im Verkaufsprozess werden unter anderem über die ausgewählte Verkaufsbelegart aktiviert bzw. deaktiviert.",1],["Bei einem Terminauftrag handelt es sich um einen Auftrag der - zu einem bestimmten Termin ausgeführt werden muss.",0],["Die Wahl der Verkaufsbelegart hat Auswirkungen auf die Folgebelege.",1],["Ein Terminauftrag bezieht sich immer auf die Lieferung eines Sachguts.",0]]],[7,"Welche der folgenden Aussagen zum Thema Kommissionieren ist richtig?",[["Der Vorgang der Kommissionierung kann auch durch automatisierte Transportsysteme unterstützt werden.",1],["Die Begriffe Kommissionär und Kommissionierer werden in der SAP Terminologie synonym verwendet.",0],["Der Aufgabenbereich des Kommissionierers wird im Handelsgesetzbuch geregelt.",0]]],[7,"Die Anwendungskomponente Vertrieb (SD) unterstützt sämtliche Versandaktivitäten. Die Versandabwicklung beginnt",[["...mit dem Anlegen des Lieferbelegs (Auslieferung).",1],["...mit dem Kommissionieren",0],["...mit Anlegen des Transportauftrages.",0],["...mit dem Anlegen des Kundenauftrages.",0]]],[7,"Welche der folgenden Aussagen im Zusammenhang mit der Fakturierung sind zutreffend?",[["Der Fakturabeleg ist in die bei den Ebenen Kopf und Position gegliedert.",1],["Standardmäßig erfolgt im Anschluss an die Fakturierung eine automatische Warenausgangsbuchung.",0],["Beim Anlegen einer Faktura (F2) werden die Preise stets aus dem zugrundeliegenden Auftrag übernommen und die automatische Preisfindung nicht mehr durchgeführt.",1],["Beim Anlegen einer Faktura können die Konditionen (Preise etc.) nicht mehr verändert werden. Die Änderungen müssen stattdessen im zugrundeliegenden Auftrag vorgenommen werden.",1]]],[8,"Welche der folgenden Aussagen zur gegebenen Ausgangssituation (siehe Graphik) ist zutreffend? Anfangsbestand: 100 Stück, Bestehende Lieferantenbestellungen: 50 und 60 Stück, Bestehende Kundenorder: 100, 40 und 50 Stück. Sie erfassen einen zusätzlichen Kundenauftrag über 20 Stück, der Kunde verlangt eine schnellstmöglich Lieferung und erlaubt gegebenenfalls eine Aufteilung der Auftragsmengen (Teillieferungen).",[["Zum Wunschlieferdatum des Kunden können 20 Stück geliefert werden.",0],["Aufgrund der gegebenen Ausgangssituation (Kundenwünsche, sowie geplante Zu- und Abgänge) wird eine Einmallieferung mit 20 Stück - allerdings zu einem späteren Termin als dem Wunschliefertermin - bestätigt.",0],["Aufgrund der gegebenen Kundenwünsche (siehe Ausgangssituation) werden 2 Teillieferungen zu je 10 Stück bestätigt.",1]],"bild3.jpg"],[8,"Sie legen einen Kundenauftrag für den Kunden 200901 an. Sie erfassen das Material mit der Nummer MAT-4711. Die Verfügbarkeitsprüfung ergibt, dass sie zum Wunschlieferdatum keine Lieferung bestätigen können. Welche der folgenden Aussagen zur Verfügbarkeitsprüfung sind zutreffend (sinnvoll)?",[["Nur bei den Verkaufsbelegarten Terminauftrag, Barverkauf und Sofortauftrag wird eine Verfügbarkeitsprüfung durchgeführt.",0],["Im Customizing kann eingestellt werden bei welchen Vorgängen eine Verfügbarkeitsüberprüfung durchgeführt wird.",1],["Grundsätzlich ist das SAP System so voreingestellt, dass die Verfügbarkeitsprüfung nur vorhandene Bestände berücksichtigt. Zukünftige Zu- und Abgänge werden nicht berücksichtigt.",0],["Sie wissen, dass Bestände des Material MAT-4711 auch in einem anderen Werk vorhanden sind. Sie führen daher eine Verfügbarkeitsprüfung für dieses Werk durch. Nachdem in diesem Werk eine ausreichende Menge des Material MAT-4711 lagernd ist, bestätigen sie dem Kunden die Lieferung zum Wunschliefertermin.",1]]],[8,"Sie haben eine Auftragsposition erfasst. Da die Verfügbarkeitsprüfung auf Werksebene erfolgt, ist eine Angabe des (Auslieferungs-) Werkes erforderlich. Welche der folgenden Aussagen ist in diesem Zusammenhang zutreffend?",[["Falls weder im Materialstamm noch im Kundenstamm ein Auslieferungswerk angegeben ist, dann sucht das System im 3. Schritt nach einem Eintrag in einer allfällig vorhandenen Kunden-Material-Info.",0],["Bei  der Ermittlung des Auslieferungswerkes greift das System zunächst auf den Materialstamm und zweitens auf den Kundenstamm des Warenempfängers zu.",0],["Voraussetzung für eine Verfügbarkeitsprüfung ist, dass für jede Position ein Auslieferungswerk ermittelt wird.",1]]],[8,"Welche der folgenden Aussagen zur gegebenen Ausgangssituation (siehe Graphik) sind zutreffend? Anfangsbestand: 100 Stück, Bestehende Lieferantenbestellungen: 50 und 60 Stück, Bestehende Kundenorder: 100, 40 und 50 Stück. Sie erfassen einen zusätzlichen Kundenauftrag über 20 Stück, der Kunde verlangt eine schnellstmöglich Lieferung und erlaubt gegebenenfalls eine Aufteilung der Auftragsmengen (Teillieferungen).",[["Aufgrund des Wunschlieferdatums des Kunden führt das System die Versandterminierung durch und ermittelt das Bereitstellungsdatum.",1],["Zum Wunschlieferdatum des Kunden ist keine Lieferung möglich.",1],["Zum Wunschlieferdatum des Kunden können 20 Stück geliefert werden.",0],["Zum Wunschlieferdatum des Kunden können 10 Stück geliefert werden.",0]],"bild3.jpg"],[8,"Sie haben einen Kundenauftrag angelegt. Nun möchten Sie die dazugehörige Preisfindung analysieren. Welche der folgenden Aussagen ist zutreffend?",[["\"Die Preisfindung kann nicht aus dem Kundenauftrag heraus aufgerufen werden, es muss zusätzlich die Transaktion \"\"Konditionsschema analysieren\"\" aufgerufen werden.\"",0],["Die Preisfindung wird bereits bei der Auftragsanlage durchgeführt. Bereits in der Phase der Auftragsanlage erfolgt die Preisfindung.",1],["Die Preisfindung kann nur über das Controlling analysiert werden.",0]]],[8,"Welche der folgenden Aussagen zur Verfügbarkeitsprüfung sind zutreffend?",[["Eine Verfügbarkeitsprüfung wird nur dann durchgeführt, wenn sie im Customizing für den jeweiligen Vorgang festgelegt wurde. Damit eine Verfügbarkeitsprüfung bei der Kundenauftragsanlage durchgeführt wird, ist unter anderem einen entsprechende Customizingeinstellung für den betreffenden Vorgang (z.B. Terminauftrag anlegen) erforderlich.",1],["Im Customizing wird festgelegt, welche Bestände, Zugänge und Abgänge bei der Verfügbarkeitsprüfung berücksichtigt werden.",1],["Die Verfügbarkeitsprüfung kann mit oder ohne Einbeziehung der Wiederbeschaffungszeit erfolgen.",1],["Die Verfügbarkeitsprüfung erfolgt auf Ebene der Versandstelle.",0]]],[8,"Welche der folgenden Aussagen zum gegebenen Beispiel sind zutreffend (es werden keine Sonn- und Feiertage berücksichtigt)? Auftragsdatum: 17.Jänner, Wunschlieferdatum des Kunden: 31. Jänner, Transitzeit: 6 Tage, Ladezeit: 1 Tag, Richtzeit (Bereitstellen und Richten des Materials): 4 Tage, Transportdispovorlaufzeit: 2 Tage",[["Das Wunschlieferdatum des Kunden kann bestätigt werden.",1],["Die Auslieferung muss (spätestens) am 21. Jänner angelegt werden.",1],["Im gegebenen Beispiel wird die sog. Vorwärtsterminierung angewandt.",0],["Die Auslieferung muss (spätestens) am 23. Jänner angelegt werden.",0]]],[8,"Welche der folgenden Aussagen zum Thema Preisfindung sind zutreffend?",[["Es ist im SAP System nicht möglich, festgelegte Preise auf einen bestimmten Zeitraum zu beschränken.",0],["Da die Preise in den Materialstammdaten hinterlegt sind, sind bei individuellen Preisabsprachen mit Kunden immer auch manuelle Eingaben bei der Auftragsabwicklung erforderlich.",0],["Der Preis wird üblicherweise in Abhängigkeit von Verkaufsorganisationen und Vertriebsweg gepflegt.",1],["SAP unterstützt auch das Anlegen von kundenindividuellen Konditionssätzen.",1],["Die Preisfindung erfolgt über die sogenannte Parametertechnik.",0]]],[8,"Versandterminierung, Verfügbarkeitsprüfung, Materialbereitstellungsdatum und Wunschlieferdatum. Welche der folgenden Aussagen zu obigen Begriffen ist zutreffend?",[["Die Verfügbarkeitsprüfung findet zum Materialbereitstellungsdatum statt.",1],["Das Materialbereitstellungsdatum ist der frühestmögliche Zeitpunkt, zu dem dem Kunden die Lieferung zugesagt werden kann.",0],["Die Verfügbarkeitsprüfung erfolgt vor der Versandterminierung.",0],["Das Wunschlieferdatum des Kunden ist im Idealfall identisch mit dem Materialbereitstellungsdatum.",0]]],[8,"Rückwärts und Vorwärtsterminierung. Welche der folgenden Aussagen sind zutreffend?",[["Ausgangspunkt der Rückwartsterminierung ist das Wunschlieferdatum des Kunden.",1],["Ausgangspunkt der Vorwartsterminierung ist das Materialbereitstellungsdatum.",1],["Prinzipiell wird das Verfahren der Vorwärtsterminierung angewandt, nur wenn diese nicht möglich ist, das Verfahren der Rückwärtsterminierung.",0],["Ziel der Versand- und Transportterminierung ist es, die Transportkosten möglichst gering zu halten.",0]]],[8,"Sie erfassen einen Terminauftrag. Zum Wunschlieferdatum des Kunden kann die Lieferung - aus dem automatischen ermittelten Werk 1000 - nicht bestätigt werden. Sie wissen aber, dass das Material auch im Werk 2000 geführt wird. Weiters möchten sie sich anzeigen lassen, welche Größen bei der Verfügbarkeitsprüfung (Prüfumfang) mitberücksichtigt werden. Welche der folgenden Aussagen sind in diesem Zusammenhang zutreffend?",[["Sie können - während der Auftragsbearbeitung - manuell das Werk 2000 eingeben und die entsprechende Verfügbarkeitssituation ermitteln.",1],["Bei der Anlage einer Auftragsdisposition wird die Verfügbarkeitsprüfung automatisch durchlaufen. Das Ergebnis kann aber jederzeit auch manuell aufgerufen werden.",1],["Auch wenn sie den Bildschirm Verfügbarkeitskontrolle bereits verlassen haben, können Sie sich das Ergebnis erneut ansehen und dabei auch den Prüfumfang anzeigen lassen.",1],["Wenn eine Materialposition von der Verfügbarkeitsprüfung nicht zum Wunschliefertermin bestätigt werden kann, ist dies erst dann für den Anwender sichtbar, wenn er das Verfügbarkeitsdatum manuell aufruft.",0]]],[8,"Welche der Antwortmöglichkeiten zur nachfolgend beschriebenen Ausgangssituation sind zutreffend? Ausgangssituation zur Verfügbarkeitsprüfung für ein Lagermaterial im Kundenauftrag: Verfügbarer Werk-Bestand 100 Stück, Bestehende Lieferantenbestellungen: 50 und 60 Stück, Bestehende Kundenorder: 100 und 40 und 50 Stück. Der Kunde bestellt 20 Stück des Lagermaterials und verlangt eine Komplettlieferung.",[["Die Komplettlieferung der Kundenauftragsposition ist vor Eingang der Bestellungen dann möglich, wenn einem bestehenden Kundenauftrag bestätigte Mengen gekürzt werden. Durch eine neuerliche Verfügbarkeitsprüfung die rückständige Komplettlieferung vorgezogen werden.",1],["\"Durch Umschalten des \"\"Prüfumfanges\"\" der Verfügbarkeitsprüfung im Kundenauftrag kann die vom Kunden gewünschte Komplettlieferung in jedem Fall hergestellt werden.\"",0],["Das System bestätigt die volle Positionsmenge und Lieferung zum Wunschlieferdatum unabhängig vom Bestelleingang, da die tagesaktuelle (zum Zeitpunkt der Auftragserfassung) rechnerische Differenz zwischen 210 Zugang und 190 Abgang eine freie ATP-Menge (Available To Promise) von 20 ergibt.",0],["Aufgrund des Wunschlieferdatums des Kunden und unter Berücksichtigung sämtlicher Zugangs- und Abgangselemente sowie der Versandterminierung ermittelt das System den frühestmöglichen Termin für die komplette Auslieferung der Position. Dieser liegt nach Zugang der z. Bestellung über 60 Stück.",1]]],[8,"Welche der gegebenen Aussagen zur gegebenen Ausgangssituation sind zutreffend? Ausgangssituation: Werksbestand: 100Stück, Bestehende Lieferantenbestellungen: 50 und 60 Stück, Bestehende Kundenorder: 100 und 40 und 50 Stück. Sie erfassen einen zusätzlichen Kundenauftrag über 10 Stück.",[["Aufgrund der Verfügbarkeitsprüfung werden genau 10 Stück bestätigt.",1],["Aufgrund der Verfügbarkeitsprüfung könnten mehr als 10 Stück bestätigt werden.",1],["Die Verfügbarkeitsprüfung ergibt, dass sie weniger als 10 Stück bestätigen.",0],["Aufgrund der Verfügbarkeitsprüfung werden mehr als 10 Stück bestätigt.",0]]],[8,"Welche der folgenden Aussagen zur Verfügbarkeitsprüfung sind zutreffend? Die Verfügbarkeitsprüfung erfolgt...",[["...für keinen der oben genannten Tage.",0],["...für den Tag der Auftragsanlage.",0],["...für den Tag der Auslieferung.",0],["...für den Tag des Bereitstellungsdatums.",1]]]];
var app=document.getElementById("app"),deck=[],i=0,score=0,wrong=[],sess=[],stat={};

function help(){
  app.innerHTML='<div class="crow" style="align-items:center;margin-top:28px"><h1 style="margin:0">Hilfe</h1><button class="ghost" id="back">Zurück</button></div><div class="help">'+
  '<h3>So läuft eine Runde</h3><p>Du bekommst eine Frage mit mehreren Antworten. Oben steht, wie viele davon richtig sind. Tippe alle Antworten an, die du für richtig hältst, und dann auf „Antwort prüfen“. Grün markiert richtig gewählte Antworten, rot falsch gewählte. Gestrichelt grün sind richtige Antworten, die du nicht gewählt hast. Mit „Weiter“ kommt die nächste Frage.</p>'+
  '<h3>Punkte</h3><p>Einen Punkt gibt es nur, wenn genau die richtigen Antworten gewählt sind: alle richtigen und keine falsche. Das ist bewusst streng, damit du den Stoff wirklich sicher kannst.</p>'+
  '<h3>Beenden</h3><p>Mit „Beenden“ oben rechts oder „Jetzt beenden“ nach dem Prüfen kannst du jederzeit aufhören. Das Ergebnis zählt nur die Fragen, die du beantwortet hast. Eine gerade offene Frage zählt nicht mit.</p>'+
  '<h3>Startseite</h3><ul>'+
  '<li><strong>Wissensstand:</strong> Er zeigt in Prozent, wie viele Fragen du zuletzt richtig beantwortet hast, insgesamt und pro Kategorie. Fragen, die du noch nie beantwortet hast, zählen als nicht gewusst. Eine falsche Frage zählt wieder, sobald du sie richtig beantwortest.</li>'+
  '<li><strong>Alle Fragen mischen:</strong> Alle Fragen in zufälliger Reihenfolge.</li>'+
  '<li><strong>Prüfung:</strong> 20 zufällige Fragen. Dein Bestwert wird bei Runden mit mindestens 20 beantworteten Fragen aktualisiert.</li>'+

  '<li><strong>Fehlerliste:</strong> Fragen, die du zuletzt falsch hattest. Nach dem Ergebnis kannst du die falschen Fragen auch direkt wiederholen.</li></ul>'+
  '<h3>Dein Stand</h3><p>Wissensstand, Fehlerliste und Bestwert werden nur auf deinem Gerät im Browser gespeichert. Niemand sonst sieht sie. Nutze immer denselben Weg, also entweder das App-Symbol oder den Browser. Ganz unten auf der Startseite kannst du ihn mit „Lernstand zurücksetzen“ selbst löschen. Wenn du die Website-Daten im Browser löschst, ist er ebenfalls weg.</p>'+
  '<h3>Als App aufs Handy legen</h3><ul>'+
  '<li><strong>Android (Chrome):</strong> Menü oben rechts (drei Punkte), dann „Zum Startbildschirm hinzufügen“.</li>'+
  '<li><strong>iPhone (Safari):</strong> Teilen-Symbol, dann „Zum Home-Bildschirm“.</li>'+
  '<li><strong>iPhone (Chrome):</strong> Teilen-Symbol neben der Adresszeile, dann „Zum Home-Bildschirm“.</li></ul>'+
  '<h3>Fehler gefunden?</h3><p>Wenn eine Frage falsch oder unklar wirkt oder du Fragen zum Quiz hast, schreib mir per WhatsApp.</p><p><a class="ghost" style="display:inline-block;text-decoration:none;color:inherit" href="https://wa.me/491726202875?text=Hallo%20Stefan%2C%20zum%20SAP%20SD%20Quiz%3A%20" target="_blank" rel="noopener">Per WhatsApp schreiben</a></p><h3>Datenschutz</h3><p>Dein Lernstand bleibt auf deinem Gerät. Eine Statistik mit Google Analytics läuft nur mit deiner Zustimmung. <a href="index.html#datenschutz" style="color:inherit">Details und Widerruf</a></p></div>'+
  '<button class="primary" id="back2">Zur Startseite</button><p class="hint" style="text-align:center;margin-top:24px">Copyright © 2026 by Stefan Steinweg</p>';
  var bk=function(){home();window.scrollTo(0,0)};
  document.getElementById("back").onclick=bk;document.getElementById("back2").onclick=bk;window.scrollTo(0,0);
}
function stats(){
  var n=Q.length,ok=0,bad=0;
  Q.forEach(function(q,k){if(know[k]===1)ok++;else if(know[k]===0)bad++});
  var pct=Math.round(ok/n*100);
  var h='<div class="stat"><div class="big">'+pct+' %</div><p class="sub" style="margin:0 0 10px">Wissensstand: '+ok+' von '+n+' Fragen zuletzt richtig</p><div class="bar" style="margin-bottom:14px"><span style="width:'+pct+'%"></span></div>';

    document.getElementById("fb").innerHTML='<p class="exp"><strong>'+(good?"Richtig.":"Nicht ganz.")+'</strong> '+(good?"Alle richtigen Antworten gewählt, keine falsche.":"Für einen Punkt müssen genau die richtigen Antworten gewählt sein.")+'</p><button class="primary" id="nx">'+(i+1<deck.length?"Weiter":"Ergebnis anzeigen")+'</button>'+(i+1<deck.length?'<button class="ghost" id="stop" style="width:100%;margin-top:10px">Jetzt beenden ('+(i+1)+' beantwortet)</button>':'');

  };

function result(n){n=n||deck.length;
