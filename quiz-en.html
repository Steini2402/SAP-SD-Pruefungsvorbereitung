<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAP SD Quiz">
<meta name="author" content="Stefan Steinweg">
<meta name="theme-color" content="#3B4BFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest-en.webmanifest">
<title>SAP SD Quiz</title>
<style>
:root{--bg:#EEF1F8;--sf:#fff;--ink:#14182B;--mute:#5B6280;--ac:#3B4BFF;--acs:#E3E6FF;--ok:#12A150;--oks:#D9F5E5;--no:#E5484D;--nos:#FDE3E4;--ln:#D6DAEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:28px 0 6px}
h2{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 22px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.primary{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:18px;margin-top:18px}
:root[data-theme="dark"] .primary{color:#0E1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0E1020}}
.ghost{padding:12px 16px;border-radius:12px;background:var(--acs);font-weight:600;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start}.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ln);margin-top:1px;display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .box{background:var(--ac);border-color:var(--ac);color:#fff}.opt.ok .box{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no .box{background:var(--no);border-color:var(--no);color:#fff}.opt.miss{border-color:var(--ok);border-style:dashed}.tag{display:block;font-size:13px;color:var(--mute);margin-top:4px}.menu{display:flex;justify-content:space-between;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);font-weight:600}.menu small{color:var(--mute);font-weight:400}.help h3{font-size:18px;margin:24px 0 6px}.help p,.help li{margin:0 0 8px;font-size:16px}.help ul{padding-left:20px;margin:0 0 8px}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:18px}.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:4px}.crow{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:2px solid var(--ln);font-size:17px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--no);background:var(--nos)}
.opt:disabled{cursor:default}
.exp{margin:14px 2px 0;color:var(--mute);font-size:15px}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;margin:30px 0 4px;line-height:1}
.row{display:flex;gap:10px;margin-top:12px}
details{margin-top:28px;background:var(--sf);border-radius:16px;padding:14px 16px;border:1px solid var(--ln)}
summary{font-weight:600;cursor:pointer}
textarea{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:15px/1.4 inherit;resize:vertical}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
#msg{font-size:14px;margin:10px 0 0;min-height:1em}
.qimg{display:block;width:100%;height:auto;border:1px solid var(--ln);border-radius:14px;margin:14px 0 18px;background:var(--sf)}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[[1,"Which of the following statements about the organizational units distribution channel and division are correct?",[["In addition to the sales organization and the division, you need at least one distribution channel to be able to map a sales area.",1],["You need at least one division to be able to create sales orders.",1],["If different distribution channels have already been created, there is no need to create separate divisions.",0],["With a cross-division division you can group several product lines.",1]]],[1,"Roughly speaking, SAP distinguishes between applications and Customizing. Which statements about Customizing are correct?",[["A distinction is made between client-dependent and client-independent Customizing.",1],["In Customizing you can make modifications (program enhancements) to the SAP system.",0],["In Customizing you can adapt the company-neutral functions delivered with the SAP system to the specific business requirements of your company.",1]]],[1,"Which of the following statements about the organizational units plant, shipping point, storage location and company code are correct?",[["The plant plays no role at all in the SD module.",0],["The shipping point specifies from where (spatially) a sales area ships.",1],["Inventory is valuated at plant level.",1],["A plant can be assigned to several sales organizations.",1]]],[1,"To map the sales process, ...",[["...no dedicated organizational units are required. The general organizational units are used.",0],["...dedicated organizational units are required.",1],["...only organizational units that are also used in the SD application component are used.",0],["...organizational units are used that are needed both in sales and in the other modules of the SAP system.",1]]],[1,"Which of the following statements about the organizational unit shipping point is correct?",[["The organizational unit shipping point requires the organizational unit storage location to exist.",0],["The term shipping point always refers to real physical facilities, such as a gate or a ramp, and only counts as additional information in the shipping process.",0],["A shipping point can be assigned to several plants.",1]]],[1,"Which of the following organizational units are required to map a sales area?",[["Shipping point",0],["Storage location",0],["Distribution channel",1],["Sales organization",1],["Division",1]]],[1,"As a sales clerk you often start your work with document entry. What can you do to get into this application faster?",[["You can enter the transaction code for the application in your favorites list to reach the initial screen faster.",1],["You can call a predefined transaction at the same time via your SAP GUI shortcut for quick logon.",1],["You can define a start transaction via the “Extras” menu so that the desired application opens immediately after logon.",1],["At the end of each working day you go to document entry. When you log on the next morning, the document entry transaction is displayed directly.",0]]],[1,"In transaction “VD03” you want to permanently preset the input field sales organization with a specific default value. How do you proceed?",[["In the Workplace you enter the parameter value on the “Field defaults” tab.",0],["In the user defaults you enter the combination of parameter name and value on the “Parameters” tab.",1],["In the entry screen you enter the value in the desired field. Then you right-click and select “Apply parameter value”.",0]]],[1,"Which of the following statements about the organizational unit storage location are correct?",[["Storage locations are always managed via so-called Lean Warehouse Management.",0],["The storage location is used to store material at different places or rooms within a plant.",0],["The organizational unit storage location can be used by all logistics areas of the SAP system.",1],["The storage location is used for quantity-based inventory management.",1]]],[1,"Which of the following statements about the organizational units shipping point/plant/storage location are correct?",[["A shipping point is always uniquely assigned to exactly one plant.",0],["The existence of the organizational unit plant is a prerequisite for deliveries to be created and physically shipped.",0],["The shipping point is the organizational unit in the SAP system responsible for processing shipping.",1],["A storage location designates a physically existing place within the warehouse.",0]]],[1,"Which of the following statements about company code and client are correct?",[["Completely separate customer master records are stored and maintained in each client.",1],["Completely separate customer master records are stored and maintained in each company code.",0],["A client can only have one company code.",0],["A balance sheet can be created for a company code.",1]]],[1,"An organizational unit is ...",[["...always also a legal entity.",0],["...always an organizational and (at the same time) legal entity.",0],["...a building block in the organizational structure of a company.",1],["...an organizational and sometimes (at the same time) also a legal entity.",1]]],[1,"You are in the transaction “Create Inquiry”. You want the document date you already entered to be available again when you restart the transaction, because you often enter several inquiries in a row with the same date. The document date should be available as a default value that you can overwrite. How do you proceed?",[["From the menu bar you choose “System > User Profile > Take Data”.",0],["From the menu bar you choose “System > User Profile > Own Data”.",0],["From the menu bar you choose “System > User Profile > Hold Data”.",1]]],[1,"With user defaults, for example, the sales organization can be set as a user parameter so that it is entered automatically as a default value in the fields in the future. What should you keep in mind regarding user defaults?",[["User parameters are lost after logging off and must be entered again after every logon.",0],["User parameters only apply to the user who entered them with their user name after logging on.",1],["User parameters cannot be changed later.",0],["Using user parameters saves time and reduces the number of input errors.",1]]],[1,"Which of the following statements about the shipping point are correct?",[["Each delivery is processed by exactly one shipping point.",1],["Several shipping points can be assigned to a plant.",1],["The existence of shipping points is a prerequisite for deliveries to be created.",1],["The shipping point is always at header level in the sales order.",0]]],[1,"You want to find a master record in an application (e.g. Sales). Which tools are available in the SAP system to search for master records created in the system?",[["If value help is available for an input field, there is a pushbutton next to the field. When you click this pushbutton, the search helps for the fields are displayed.",1],["You position the cursor in the relevant field. Then you press the function key “F4” and the search helps are displayed.",1],["You call up help with the function key “F1” and have all records created in the system displayed. Then you select the correct master record by double-clicking.",0]]],[1,"Which of the following statements about the sales area is correct?",[["A sales area is an independent organizational unit.",0],["The link from company code to sales area is made via the organizational unit sales organization.",1],["The sales area is a combination of sales organization, shipping point and division.",0]]],[1,"Which of the following statements about the organizational unit sales organization are correct?",[["Several sales organizations can be assigned to a company code.",1],["The sales organization assigns the sales area to the company code.",1],["A maximum of one distribution channel can be assigned to a sales organization.",0],["Several plants can be assigned to a sales organization.",1]]],[1,"With the help of sessions you can open several transactions at the same time. You use a session so that you can change master data at any time. Why should a session that is no longer needed be closed?",[["Many open sessions use more resources on your computer and slow it down.",1],["It can happen that you can no longer switch between many open sessions, because you can open any number of sessions.",0],["It can happen that data from your open session is overwritten by other users.",0],["It can happen that data from your open session cannot be edited by other users because it is locked for editing.",1]]],[1,"You are in the SAP system and want to display a master record. You have values displayed via the matchcode help. Although you are sure that the master record you are looking for exists, the list does not contain it. What could be the reason?",[["You do not have the necessary authorizations to display the master record.",0],["Your restrictions in the matchcode search exclude the master record.",1],["There are more entries than can be displayed by the “maximum number of hits”.",1]]],[1,"All sales documents can be output in the form of messages. Which statements about messages are correct?",[["Via the Print Preview icon in the order, the message can be displayed on screen.",1],["Messages must always be output immediately.",0],["Messages are usually output manually. A background job is only used in exceptional cases.",0],["Several options are available for outputting messages. For example, they can be printed, sent by email or faxed.",1]]],[2,"Which of the following statements about the billing document are correct?",[["Billing serves as a data source for Financial Accounting (FI) to support the accounting clerk with payment monitoring and processing.",1],["The billing document is divided into the three levels header, item and schedule line.",0],["Billing is a document of the shipping area.",0],["Several deliveries can be combined into one billing document, provided they share characteristics that are essential for billing.",1]]],[2,"You are explaining document number assignment in the SAP system to your substitute. In your company, all document numbers are assigned internally. You explain the relationship between document number range and documents. Which statement is correct?",[["No document type may be assigned to a number range.",0],["Several number ranges can be assigned to one document type.",0],["A number range must be assigned to a document type.",1]]],[2,"Which of the following statements about the delivery document are correct?",[["When the delivery document is created, important information from the sales order is copied into the delivery document.",1],["In contrast to the sales document, the delivery document can also have schedule lines.",0],["In SAP terminology, the delivery document is typically created by the sales employee.",1],["The delivery document is the central control element in the shipping process.",1]]],[2,"Which of the following statements about the delivery document are correct?",[["When the delivery document is created, data such as the materials and the confirmed quantities are copied from the customer order.",1],["The delivery document controls, supports and monitors all sub-processes of shipping processing.",1],["If you want to display a delivery document, you have to choose the following path: Logistics -> Sales and Distribution -> Sales -> Delivery -> Display.",0],["A delivery document can only be created if a customer order has been created beforehand.",0]]],[2,"Documents are often created with reference to preceding documents. With reference to which preceding documents can customer inquiries be created?",[["Inquiry",1],["Order",1],["It is not possible to create an inquiry with reference to a preceding document.",0],["Quotation",1]]],[2,"Which of the following statements about sales and delivery documents is correct?",[["Delivery documents (deliveries) generally have the levels header, item and schedule line.",0],["Several delivery documents can be created from one sales document.",1],["Both sales documents and delivery documents (deliveries) are structured into the levels header, item and schedule line.",0],["Each item in the sales document corresponds to exactly one item in the delivery document.",0]]],[2,"In the application component (Sales & Distribution) a distinction is made between various sales document types. Which of the following document types are sales documents?",[["Credit memo",0],["Return",1],["Invoice",0],["Scheduling agreement",1],["Delivery",0]]],[2,"Sales documents are documents that are recorded during pre-sales and order processing. Which of the following statements about sales documents are correct?",[["A sales document, once created, always refers to one sales area. This depends on the ship-to party.",0],["A sales document is structured into the three levels header, item and schedule line.",1],["A sales document is usually recorded on an overview screen.",1],["A sales document, once created, always refers to a single sales area. This depends on the sold-to party.",1]]],[2,"Some document types consist of the levels header, item and schedule line. Which of the following statements are correct?",[["In the scheduling agreement, the data is distributed across the levels header, item and schedule line.",1],["In the billing document, the data is distributed across the levels header, item and schedule line.",0],["In the shipment, the data is distributed across the levels header, item and schedule line.",0],["In the customer order, the data is distributed across the levels header, item and schedule line.",1]]],[2,"Which statements about document types in sales are correct?",[["The sales document types control the documents in sales.",1],["The inquiry type controls the documents in pre-sales activities.",0],["The delivery type controls the documents in shipping.",1],["The shipment type controls the documents in the picking process.",0],["The billing type controls the documents in billing.",1]]],[3,"You want to create a customer quotation. Which of the following statements are correct?",[["When creating a customer quotation with reference, both individual items of the inquiry and the inquiry as a whole can be copied into the customer quotation.",1],["If individual price agreements exist with a customer, manual price entries are always required when creating a quotation.",1],["If no sales area is entered when creating a customer quotation, it is derived from the master data of the sold-to party or the ship-to party.",1],["It is possible to create a customer quotation with reference to another customer quotation.",1],["Via the \"Create with reference\" button you can only use inquiries recorded so far. Other document types cannot be used as a reference source.",0]]],[3,"If you do not enter a ship-to party when creating the order, then...",[["...the order cannot be saved.",0],["...the ship-to party must be entered subsequently in the delivery.",0],["...the ship-to party is automatically set equal to the sold-to party.",1]]],[3,"Various document types can be created via the customer order. If transaction VA01 (Create customer order) is called up again, then...",[["...the sales document type TA (scheduling agreement) is always proposed.",0],["...the correct sales document type is proposed automatically depending on the preceding documents (inquiry, contact, etc.).",0],["...the sales document type used last is proposed (provided no other default value is stored in the user master record).",1]]],[3,"You have recorded a customer order. The incompletion log shows that the following data is missing: payment terms, gross weight, shipping point and delivering plant. Which of the following statements are correct in this context?",[["As long as the master data is not maintained accordingly, the data listed above has to be entered manually every time the order is created.",1],["In the SD (Sales & Distribution) application component, the functions of the incompletion log exist exclusively in the customer order and in the delivery.",1],["The term \"incompletion log\" does not exist in SAP terminology. The facts listed above are shown in the so-called error log instead.",0],["Customizing defines which fields belong to the incompletion log.",1]]],[3,"You have created a customer order. It comprises 2 items. Which of the following statements are correct?",[["By double-clicking an item you reach the item level. On the \"Conditions\" tab you can view the pricing procedure for the item.",1],["You select the item whose pricing you want to analyze. Then you choose Goto/Item/Conditions in the menu.",1],["It is not possible to analyze pricing from within the SD application component. Pricing is analyzed via Controlling.",0],["It is not possible to analyze the pricing of the customer order as a whole (items 10 and 20 combined) from within the \"Create customer order\" transaction.",1]]],[3,"If you do not enter organizational data (sales organization, distribution channel, etc.) on the initial screen when creating the order, then...",[["...the order is saved without organizational data.",0],["...the organizational data of the last order created is copied.",0],["...the system derives the sales area automatically from the customer master.",1]]],[3,"Which of the following default values in the scheduling agreement are copied from the condition records?",[["Discount",1],["Delivery terms",0],["Freight",1],["Prices",1],["Volume",0]]],[3,"You are creating an order for customer 200901. You are not sure whether this customer accepts partial deliveries or insists on complete deliveries. Which of the following statements is correct in this context?",[["In the vendor-material info record, it can be defined at schedule line level whether the order quantity may be split.",0],["You find the complete delivery or partial delivery indicator in the customer order at schedule line level.",0],["From within order creation (tab: Shipping) you can see whether partial deliveries are allowed.",1]]],[3,"Every sales document contains a large amount of data. Which statements are correct in this context?",[["A customer order can never be a data source for a delivery.",0],["Default values in sales documents can be copied from preceding documents as well as from master data.",1],["A large part of the data is copied automatically from various sources. This data can be overwritten manually.",1],["The general data in the customer master is irrelevant when creating a sales document.",0]]],[3,"An order, like other sales documents, consists of a document header and one or more items, whereby each of these items consists of one or more schedule lines. Which statements are correct in this context?",[["The document header always overrides the settings in the item details.",0],["The information in the document header, such as the payment terms, applies to the entire order.",1],["Information stored in the document header has no effect on the document items.",0],["Additional information that does not exist in the document header can be maintained in the items of an order.",1]]],[3,"You are creating a delivery with reference to a customer order. The customer order has 3 schedule lines. Which of the following statements are correct?",[["The number of schedule lines in the delivery document also depends on whether a partial delivery agreement exists with the customer.",0],["Only schedule lines with confirmed quantities are taken into account.",1],["The delivery document subsequently has at least 3 schedule lines.",0]]],[3,"The central step in the sales process is the creation of a customer order. Which of the following statements about the customer order are correct?",[["If a customer order is created \"with reference\", most of the data of the preceding document is copied into the order (weighting 1).",1],["Changes in the header data of the customer order are copied automatically into order items already recorded.",1],["Certain data for shipping is already determined by the system when the customer order is created.",1],["Already when the customer order is created, the condition schema is used and a corresponding sales price is calculated.",0]]],[3,"Which of the following statements regarding complaint processing is correct?",[["When creating with reference, all items of the reference document must always be copied with their full quantity.",0],["An invoice correction request always requires an invoice as the reference document.",1],["A returns process can only be billed once the goods receipt posting for the returns delivery has been made.",0]],"bild4.jpg"],[3,"You are creating a customer order. You also want to record materials from different divisions. Assess the following statements about customer order processing.",[["If you did not enter a division when creating the order, the division is determined from the material master of the first order item.",0],["In Customizing it can be defined that materials from different divisions (cross-division sales) can also be recorded in one sales document.",1],["Every sales document must be assigned to a sales area. It is therefore not possible to record materials from different divisions in one sales document.",0],["If you did not enter a division when creating the order, the division is determined from the customer master record of the sold-to party.",1]]],[4,"The partner functions for the customer master are stored in the customer master under the sales area data. Tick which of the given partner functions are absolutely required for a complete sales and distribution process (including billing).",[["Ship-to party",1],["Payer",1],["Contact person",0],["Sold-to party",1],["Forwarding agent",0]]],[4,"Your company consists of various organizational levels that are mapped in the SAP system. What does this mean for creating the basic data view of material master records?",[["They have to be created per plant.",0],["They have to be created per company code.",0],["They are created per client.",1]]],[4,"You want to create an order. Which of the following statements about partner functions are correct?",[["The sold-to party can be defined both at header level and at item level in the document.",0],["It is possible to assign several ship-to parties to one customer master record. When entering the order, the clerk has to select the respective ship-to party.",1],["Orders that only process services do not need a ship-to party, since no delivery has to be created either.",0],["Sold-to party, payer, bill-to party and ship-to party are always determined from the customer master, but can also be changed in the header of the order.",1]]],[4,"You have stored several ship-to parties in the customer master record under the partner functions. Which of the following statements is correct?",[["It is possible to store more than one ship-to party in a customer master record.",1],["Orders that only process services do not need a ship-to party, since no delivery has to be created either.",0],["If no ship-to party has been entered by the time the order is created, the SAP system sets the ship-to party equal to the sold-to party by default.",1],["It is not possible to create a delivery-relevant order without a ship-to party.",1]]],[4,"The material number can be entered externally. Which statement about external number assignment is correct?",[["The material number can consist of any number of characters.",0],["Only digits may be used.",0],["The material number can consist of letters and digits.",1],["Only letters may be used.",0]]],[4,"When materials are created, the material type controls the following things, among others:",[["The type of number assignment.",1],["The views that are offered for entry.",1],["The permitted procurement type.",1],["The storage location.",0]]],[4,"Which of the following statements about material master data are correct?",[["The storage location is stored in the material master data on the \"Billing\" tab.",0],["Each material can be assigned to only a single division — across all sales areas.",0],["Through customizing settings, various fields within a tab can be made mandatory-entry fields.",1],["A material type is assigned to every material master record.",1]]],[4,"You have copied the material master data of material MAT-4711 to a new material MAT-4712. As a result, you notice that only part of the data was copied to the new material master. What could be the reasons for this?",[["You only selected part of the views to be copied during view selection.",1],["You failed to specify from which sales view of the reference material you want to copy the master data.",0],["You did not select all the tabs whose contents you want to copy.",1],["Only the basic data can be copied from one material master to another; other views must be updated manually.",0]]],[4,"The customer master is divided into general data, sales area data and company code data. To make data maintenance easier, these are split across different tabs. Which of the following tabs belong to the customer master sales area data?",[["Billing",1],["Partner functions",1],["Unloading points",0],["Shipping",1],["Export data",0]]],[4,"The material MAT-4711 is sold through different sales organizations (V100 and V200) and different distribution channels (V1, V2 and V3). Which of the following statements is correct?",[["For any combination of sales organization and distribution channel, the same sales area data is used.",0],["If different sales master data is to apply to different combinations of sales organization and distribution channel, it must be created beforehand.",1],["For any combination of sales organization and distribution channel, the same general data (tabs Basic Data 1, Basic Data 2) is used.",1],["The master data from any combination of sales organization and distribution channel can also be copied to new sales areas when the sales view is created.",1]]],[4,"Muster GmbH has created 2 sales areas (A and B). In sales area A, two distribution channels are provided (retail and wholesale); in sales area B, one distribution channel is provided (resellers). Customer Name 200901 is served through both sales areas. The general data for debtor 200901 must be...",[["...created at least twice.",0],["...created three times.",0],["...created only once.",1]]],[4,"Which of the following statements about customer master data are correct?",[["The sales area data in the customer master is identical for all sales areas.",0],["Several ship-to parties can be entered in the sales area data of a customer master.",1],["The sales area data depends on the chosen combination of sales organization, distribution channel and division.",1],["Through customizing settings, various fields within a tab can be hidden.",1]]],[4,"Muster GmbH has 2 sales organizations (sales organization V100 and V200). You want to supply customer 200901 through both sales organizations. However, sales organization V200 has agreed different Incoterms with the customer than sales organization V100. Which of the following statements are correct?",[["Only a single sales organization can be assigned to an individual company (here Muster GmbH).",0],["A combination of sales organization, distribution channel and division forms a sales area.",1],["It is possible to maintain different Incoterms in the customer master for different sales organizations.",1],["In the SAP system, it is not provided by default that different sales organizations agree different Incoterms with one and the same customer.",0]]],[4,"Which of the following statements about partner functions is correct?",[["The payer is responsible for paying the invoice.",1],["Bill-to party and payer are always identical.",0],["Sold-to party and payer are always identical.",0]]],[4,"A customer-material info record exists for customer 200901 and material MAT-4711. Which of the following statements is correct?",[["If the material master MAT-4711 and the customer-material info record contain differing ividually negotiated discount in full. Which of the following statements are correct in this situation?",[["You create an invoice correction request and bill it.",1],["To complete the above process with an invoice, a separate approval step is required.",1],["You create a so-called \"rebate credit memo\" and bill it.",0],["Since it is an individually negotiated discount, the customer has no entitlement to anything in return.",0]]],[5,"In returns and credit memo processing you are confronted with a number of documents. Which of the following statements are correct in this context?",[["The invoice correction request is a sales document used when, for example, the customer wants a credit memo because of quantity or price differences.",1],["The so-called \"rebate credit memo\" is used when the agreed discount was mistakenly not taken into account during billing.",0],["Credit and debit memos are billing documents.",1],["The return is a delivery document for sending the goods back.",0]]],[5,"Customer 200901 bought 13 units of material MAT-4711 from you. You have made the delivery and the customer has already paid. Now the customer contacts you with a complaint because 1 unit of the material is defective. You agree with the customer that he may keep the defective material and that the price for this item will be credited. Click the activities that are necessary to represent the above process in the SAP system.",[["Create a credit memo request.",1],["Create a credit memo.",1],["Create a return.",0],["Carry out picking.",0],["Carry out a goods receipt posting.",0]]],[6,"When displaying material master records, information about stocks can also be shown via the storage location stock view. Which statements are correct?",[["The entire freely usable plant stock can be displayed.",0],["The stock for the respective storage locations can be displayed.",1],["The stock reserved for the respective customer can be displayed.",0],["The consumption of the individual periods is displayed.",0]]],[6,"You are in the stock overview (transaction MMBE) and want to display all stocks in your plant for a particular material. You find a considerable quantity in quality inspection stock. Which statement about this stock type is correct?",[["Quality inspection stock consists only of the sum of the samples to be inspected; the rest of the goods receipts is posted to blocked stock until a decision on acceptance or rejection of the inspection lots is made.",0],["Quality inspection stock also includes deliveries from consignment vendors. Only after release by quality management is it transferred to consignment stock.",0],["Quality inspection stock can only be physically used after release by quality management, but for planning purposes this stock is already available now.",1]]],[6,"In the stock overview (transaction MMBE) you can obtain information on the total stock of a material. Which information is displayed there, among other things?",[["Via the menu item \"Environment\", for example, all open purchase orders for this material can be called up.",1],["Among other things, the immediately available stock of the material is displayed.",0],["Among other things, the freely usable stock of the material is displayed.",1]]],[6,"The stock overview shows you which quantity of which material is in stock. At which level are stocks managed quantity-wise from the inventory management perspective in an SAP system?",[["At storage bin level.",0],["At warehouse number level.",0],["At storage location level.",1]]],[6,"Materials are valuated at the level of...",[["...the storage location.",0],["...the shipping point.",0],["...the plant.",1],["...the transportation planning point.",0]]],[7,"Which of the following statements about SAP terminology is correct?",[["The terms sales, shipping and distribution are used synonymously in SAP terminology.",0],["The terms documents and messages are used synonymously in SAP terminology.",0],["The term distribution (in the SAP R/3 system) covers exclusively the areas of sales and shipping.",0],["Messages are information transmitted via various media, e.g. mail, EDI or fax.",1]]],[7,"Choose the correct order of the sales cycle.",[["Pre-sales activities, order processing, inventory management, delivery, billing, customer payment",1],["Pre-sales activities, order processing, customer payment, delivery, billing, inventory management",0],["Inventory management, delivery, pre-sales activities, customer payment, billing, order processing",0]]],[7,"The Sales and Distribution (SD) application component of the SAP system supports the sales clerk in processing customer orders, namely...",[["...from pre-sales activities through to billing the customer.",1],["...from pre-sales activities through to creating a revenue account.",0],["...from pre-sales activities through to defining a sales bill of material.",0],["...from pre-sales activities through to vendor evaluation.",0]]],[7,"In SAP terminology, the term logistics or logistics modules refers exclusively to...",[["...the procurement and warehouse area (application component: Materials Management).",0],["...the sales, procurement, warehouse and production areas (application components: SD, MM and PP).",1],["...the production area (application components: SD and MM).",0],["...the sales and procurement/warehouse areas (application components: SD and MM).",0],["...the sales area (application component: Sales and Distribution).",0]]],[7,"You want to create a customer inquiry. Which of the following statements is correct?",[["If you do not enter a sales area when creating the inquiry, it is automatically derived from the master data of the bill-to party or payer.",0],["If several sales areas exist for a sold-to party or ship-to party, then (if you did not enter the sales area directly on the initial screen) you receive a dialog box with the different sales areas.",1],["You must first enter the sales organization, distribution channel and division on the initial screen.",0]]],[7,"Which of the following statements about the goods issue posting are correct?",[["The goods issue posting can only be made once the document has been fully picked.",1],["The goods issue posting (within the sales process) has consequences only in the logistics modules of the SAP system.",0],["The SAP system is set up by default so that the goods issue posting takes place automatically after the invoice is created.",0],["The goods issue posting updates the stock level in terms of quantity.",1]]],[7,"Which of the following documents relate to shipping processing?",[["Delivery",1],["Scheduling agreement",0],["Shipment",1],["Contract",0]]],[7,"The sales process comprises a number of different activities. Which of the following statements about the SAP sales process (SD application component) is correct?",[["The sales process ends with the posting of the customer's incoming payments.",0],["The individual steps of the sales process can be represented by individual electronic documents linked to one another.",1],["The sales process covers the areas of sales and shipping.",0],["Customer order processing always begins with order creation.",0]]],[7,"Which statements about orders and deliveries are correct?",[["A single customer order can only lead to a single delivery.",0],["It is possible to combine individual items — from several orders — into a single delivery.",1],["It is possible to create deliveries as a background job.",1],["It is possible to combine several orders into a single delivery.",1]]],[7,"You are in the \"Display document flow\" view. Which of the following statements are correct?",[["By double-clicking a specific, selected cell, you reach the detailed information of the document.",1],["In the \"Display document flow\" view, you only find the documents that were created with reference to the other documents.",1],["Regardless of which transaction you call the document flow view from (inquiry, quotation, invoice, etc.), you always get the same view of the preceding and subsequent documents.",0],["If you click the \"Status overview\" button and the \"expand completely\" function has been called, then you find the item statuses of the material.",0]]],[7,"You have created a customer order. Now you want to analyze the associated pricing. Which of the following statements is correct?",[["Pricing cannot be called up from the customer order; the \"Analyze condition schema\" transaction must also be called up.",0],["Pricing is already carried out when the order is created. Pricing takes place already in the order creation phase.",1],["Pricing can only be analyzed via Controlling.",0]],"bild1.jpg"],[7,"A number of work steps occur in the course of sales process processing. Which of the following work steps belong to the sales process (SD application component)?",[["Billing",1],["Determining vendors",0],["Invoice verification",0],["Quotation creation",1],["Shipping",1]]],[7,"Which of the following statements about billing are correct?",[["Deliveries are only taken into account in billing if the goods issue has already been posted.",1],["When the invoice is created, the G/L accounts are updated automatically. (In the general ledger, the customer's debtor account is debited; the revenue account and any tax accounts are credited.)",1],["The SAP system is set up by default so that the goods issue posting also takes place in the course of creating the invoice.",0],["Billing takes place in the FI application component.",0]]],[7,"You find the given screen section in front of you. Which of the following statements are correct?",[["The delivery has already been saved but no goods issue has been posted yet.",1],["The delivery has not been picked yet.",1],["Picking for the delivery in question is carried out by maintaining the storage number and using the follow-up function \"Create shipment\".",0],["Based on the given illustration it cannot be said whether the delivery was created with or without reference to a preceding document.",1] g agreement, cash sale and immediate order.",0],["In Customizing you can set for which processes an availability check is carried out.",1],["In principle, the SAP system is set up by default so that the availability check only takes existing stocks into account. Future receipts and issues are not taken into account.",0],["You know that stocks of material MAT-4711 also exist in another plant. You therefore carry out an availability check for this plant. After a sufficient quantity of material MAT-4711 is in stock in this plant, you confirm the delivery to the customer for the requested delivery date.",1]],"bild2.jpg"],[7,"Which of the following statements about the \"customer order\" are correct?",[["The \"customer order\" contains the relevant information needed for customer order processing.",1],["The data in a sales document is always distributed exclusively across the header and item levels.",0],["In the \"customer order\", all goods or services ordered by a customer are recorded.",1],["The transaction for creating a customer order is located in the \"Shipping and Transportation\" area of the Easy Access menu.",0]]],[7,"You want to create a customer inquiry. Which of the following statements is correct?",[["If you do not enter a sales area when creating the inquiry, it is automatically derived from the master data of the bill-to party or payer.",0],["If several sales areas exist for a sold-to party or ship-to party, then (if you did not enter the sales area directly on the initial screen) you receive a dialog box with the different sales areas.",1],["You must first enter the sales organization, distribution channel and division on the initial screen.",0]]],[7,"You create a customer order. You have decided on the sales document type scheduling agreement (TA). Which of the following statements is correct in this context?",[["Credit check, pricing, availability check and other functions in the sales process are activated or deactivated, among other things, via the selected sales document type.",1],["A scheduling agreement is an order that — must be executed at a specific date.",0],["The choice of sales document type has an effect on the subsequent documents.",1],["A scheduling agreement always refers to the delivery of a physical good.",0]]],[7,"Which of the following statements about picking is correct?",[["The picking process can also be supported by automated transport systems.",1],["The terms commission agent and picker are used synonymously in SAP terminology.",0],["The picker's area of responsibility is governed by the German Commercial Code (HGB).",0]]],[7,"The Sales and Distribution (SD) application component supports all shipping activities. Shipping processing begins...",[["...with the creation of the delivery document (delivery).",1],["...with picking.",0],["...with the creation of the shipment.",0],["...with the creation of the customer order.",0]]],[7,"Which of the following statements in connection with billing are correct?",[["The billing document is divided into the header and item levels.",1],["By default, an automatic goods issue posting takes place after billing.",0],["When an invoice is created (F2), the prices are always taken from the underlying order and automatic pricing is no longer carried out.",1],["When an invoice is created, the conditions (prices, etc.) can no longer be changed. The changes must instead be made in the underlying order.",1]]],[8,"You have entered an order item. Since the availability check takes place at plant level, a specification of the (delivering) plant is required. Which of the following statements is correct in this context?",[["If neither the material master nor the customer master specifies a delivering plant, the system looks in a third step for an entry in a customer-material info record, if one exists.",0],["When determining the delivering plant, the system first accesses the material master and second the customer master of the ship-to party.",0],["A prerequisite for an availability check is that a delivering plant is determined for each item.",1]],"bild3.jpg"],[8,"You create a customer order for customer 200901. You enter the material with the number MAT-4711. The availability check shows that you cannot confirm a delivery for the requested delivery date. Which of the following statements about the availability check are correct (sensible)?",[["An availability check is only carried out for the sales document types scheduling agreement, cash sale and immediate order.",0],["In Customizing you can set for which processes an availability check is carried out.",1],["In principle, the SAP system is set up by default so that the availability check only takes existing stocks into account. Future receipts and issues are not taken into account.",0],["You know that stocks of material MAT-4711 also exist in another plant. You therefore carry out an availability check for this plant. After a sufficient quantity of material MAT-4711 is in stock in this plant, you confirm the delivery to the customer for the requested delivery date.",1]]],[8,"You have entered an order item. Since the availability check takes place at plant level, a specification of the (delivering) plant is required. Which of the following statements is correct in this context?",[["If neither the material master nor the customer master specifies a delivering plant, the system looks in a third step for an entry in a customer-material info record, if one exists.",0],["When determining the delivering plant, the system first accesses the material master and second the customer master of the ship-to party.",0],["A prerequisite for an availability check is that a delivering plant is determined for each item.",1]]],[8,"Which of the following statements about the given example are correct (Sundays and public holidays are not taken into account)? Order date: 17 January, customer's requested delivery date: 31 January, transit time: 6 days, loading time: 1 day, standard time (providing and setting up the material): 4 days, transportation planning lead time: 2 days",[["The customer's requested delivery date can be confirmed.",1],["The delivery must be created (at latest) on 21 January.",1],["In the given example, so-called forward scheduling is applied.",0],["The delivery must be created (at latest) on 23 January.",0]],"bild3.jpg"],[8,"You have created a customer order. Now you want to analyze the associated pricing. Which of the following statements is correct?",[["Pricing cannot be called up from the customer order; the \"Analyze condition schema\" transaction must also be called up.",0],["Pricing is already carried out when the order is created. Pricing takes place already in the order creation phase.",1],["Pricing can only be analyzed via Controlling.",0]]],[8,"Which of the following statements about the availability check are correct?",[["An availability check is only carried out if it has been set in Customizing for the respective process. For an availability check to be carried out when creating a customer order, a corresponding Customizing setting is required, among other things, for the process concerned (e.g. create scheduling agreement).",1],["Customizing defines which stocks, receipts and issues are taken into account in the availability check.",1],["The availability check can be carried out with or without including the replenishment lead time.",1],["The availability check takes place at shipping point level.",0]]],[8,"Backward and forward scheduling. Which of the following statements are correct?",[["The starting point of backward scheduling is the customer's requested delivery date.",1],["The starting point of forward scheduling is the material availability date.",1],["In principle, the forward scheduling procedure is applied, and only if that is not possible, the backward scheduling procedure.",0],["The goal of shipping and transportation scheduling is to keep transportation costs as low as possible.",0]]],[8,"Which of the following cope of check). Which of the following statements are correct in this context?",[["During order processing, you can manually enter plant 2000 and determine the corresponding availability situation.",1],["When an order schedule line is created, the availability check runs automatically. However, the result can also be called up manually at any time.",1],["Even if you have already left the availability check screen, you can view the result again and also display the scope of check.",1],["If a material item cannot be confirmed for the requested delivery date by the availability check, this only becomes visible to the user when he calls up the availability date manually.",0]]],[8,"Which of the answer options are correct for the initial situation described below? Initial situation for the availability check for a stock material in a customer order: available plant stock 100 units, existing vendor purchase orders: 50 and 60 units, existing customer orders: 100 and 40 and 50 units. The customer orders 20 units of the stock material and demands a complete delivery.",[["Complete delivery of the customer order item is possible before the purchase orders arrive if confirmed quantities are reduced in an existing customer order. By running the availability check again, the backlogged complete delivery can be brought forward.",1],["By switching the \"scope of check\" of the availability check in the customer order, the complete delivery desired by the customer can be produced in any case.",0],["The system confirms the full item quantity and delivery for the requested delivery date regardless of the purchase order receipt, since the current-day (at the time of order entry) arithmetical difference between 210 receipts and 190 issues yields a free ATP quantity (Available To Promise) of 20.",0],["Based on the customer's requested delivery date and taking into account all receipt and issue elements as well as shipping scheduling, the system determines the earliest possible date for the complete delivery of the item. This is after the receipt of the purchase order for 60 units.",1]]],[8,"Which of the given statements about the given initial situation are correct? Initial situation: plant stock: 100 units, existing vendor purchase orders: 50 and 60 units, existing customer orders: 100 and 40 and 50 units. You enter an additional customer order for 10 units.",[["Based on the availability check, exactly 10 units are confirmed.",1],["Based on the availability check, more than 10 units could be confirmed.",1],["The availability check shows that you confirm fewer than 10 units.",0],["Based on the availability check, more than 10 units are confirmed.",0]]],[8,"Which of the following statements about the availability check are correct? The availability check takes place...",[["...for none of the days mentioned above.",0],["...for the day the order is created.",0],["...for the day of delivery.",0],["...for the day of the availability date.",1]]]];

function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function CATS(){return Q.map(function(q){return q[0]}).filter(function(c,k,a){return a.indexOf(c)===k}).sort(function(a,b){return a-b})}

function help(){
  app.innerHTML='<div class="crow" style="align-items:center;margin-top:28px"><h1 style="margin:0">Help</h1><button class="ghost" id="back">Back</button></div><div class="help">'+
  '<h3>How a round works</h3><p>Each question has several answers. The top tells you how many of them are correct. Tap every answer you think is right, then tap “Check answer”. Green marks correctly selected answers, red wrongly selected ones. Dashed green are correct answers you did not select. “Next” takes you to the next question.</p>'+
  '<h3>Scoring</h3><p>You only get a point if exactly the correct answers are selected: all correct ones and no wrong one. This is deliberately strict so you really master the material.</p>'+
  '<h3>Ending</h3><p>You can stop any time with “End” at the top right or “End now” after checking. The result counts only the questions you answered. A question that is still open does not count.</p>'+
  '<h3>Start page</h3><ul>'+
  '<li><strong>Knowledge level:</strong> The percentage of questions you last answered correctly, overall and per category. Questions you have never answered count as not known. A wrong question counts again as soon as you answer it correctly.</li>'+
  '<li><strong>Shuffle all questions:</strong> All questions in random order.</li>'+
  '<li><strong>Exam:</strong> 20 random questions. Your best score is updated for rounds with at least 20 answered questions.</li>'+
  '<li><strong>Category:</strong> Only questions from one category.</li>'+
  '<li><strong>Practice mistakes:</strong> The questions you last got wrong. After the result you can repeat wrong questions right away.</li></ul>'+
  '<h3>Your progress</h3><p>Knowledge level, mistakes list and best score are stored only on your device in the browser. Nobody else sees them. Always use the same way in, either the app icon or the browser. At the very bottom of the start page you can delete them with “Reset progress”. If you clear the website data, your progress is gone as well.</p>'+
  '<h3>Install as an app</h3><ul>'+
  '<li><strong>Android (Chrome):</strong> Menu at the top right (three dots), then “Add to Home screen”.</li>'+
  '<li><strong>iPhone (Safari):</strong> Share icon, then “Add to Home Screen”.</li>'+
  '<li><strong>iPhone (Chrome):</strong> Share icon next to the address bar, then “Add to Home Screen”.</li></ul>'+
  '<h3>Language</h3><p>The questions are being translated step by step. Questions that are not translated yet appear in German. <a href="quiz.html" style="color:inherit">Deutsche Version</a></p>'+
  '<h3>Found a mistake?</h3><p>If a question looks wrong or unclear, or you have questions about the quiz, message me on WhatsApp.</p><p><a class="ghost" style="display:inline-block;text-decoration:none;color:inherit" href="https://wa.me/491726202875?text=Hi%20Stefan%2C%20about%20the%20SAP%20SD%20Quiz%3A%20" target="_blank" rel="noopener">Message on WhatsApp</a></p><h3>Privacy</h3><p>Your progress stays on your device. Statistics with Google Analytics only run with your consent. <a href="en.html#privacy" style="color:inherit">Details and withdrawal</a></p></div>'+
  '<button class="primary" id="back2">Back to start page</button><p class="hint" style="text-align:center;margin-top:24px">Copyright © 2026 by Stefan Steinweg</p>';
  var bk=function(){home();window.scrollTo(0,0)};
  document.getElementById("back").onclick=bk;document.getElementById("back2").onclick=bk;window.scrollTo(0,0);
}
function stats(){
  var n=Q.length,ok=0,bad=0;
  Q.forEach(function(q,k){if(know[k]===1)ok++;else if(know[k]===0)bad++});
  var pct=Math.round(ok/n*100);
  var h='<div class="stat"><div class="big">'+pct+' %</div><p class="sub" style="margin:0 0 10px">Knowledge level: '+ok+' of '+n+' questions last answered correctly</p><div class="bar" style="margin-bottom:14px"><span style="width:'+pct+'%"></span></div>';
  CATS().forEach(function(c){var t=0,g=0;Q.forEach(function(q,k){if(q[0]===c){t++;if(know[k]===1)g++}});var p=Math.round(g/t*100);h+='<div class="crow"><span>Category '+c+'</span><span>'+p+' %</span></div><div class="bar" style="height:4px;margin-bottom:10px"><span style="width:'+p+'%"></span></div>'});
  h+='<p class="hint" style="margin:4px 0 0">'+bad+' last wrong, '+(n-ok-bad)+' not answered yet.</p></div>';
  return h}
function home(){
  var cats=CATS(),h='<div class="crow" style="align-items:center;margin-top:28px"><h1 style="margin:0">SAP SD Quiz</h1><button class="ghost" id="help">Help</button></div><p class="sub" style="margin-top:6px">'+Q.length+' questions, multiple choice'+(best!==null?' – Best score '+best+' %':'')+'</p>'+
  stats()+'<button class="primary" id="all" style="margin-top:6px">Shuffle all questions</button>'+
  '<button class="primary" id="exam" style="background:var(--acs);color:var(--ink)">Exam: 20 random questions</button>'+
  '<p class="sub" style="margin:26px 0 10px">By category</p>';
  cats.forEach(function(c){var n=Q.filter(function(q){return q[0]===c}).length;h+='<button class="menu" data-c="'+c+'"><span>Category '+c+'</span><small>'+n+' questions</small></button>'});
  h+='<button class="menu" id="mis"'+(missed.length?'':' disabled style="opacity:.5"')+'><span>Practice mistakes</span><small>'+missed.length+' questions</small></button>';
  h+='<button class="ghost" id="rs" style="width:100%;margin-top:18px">Reset progress</button>';
  h+='<p class="hint" style="text-align:center;margin-top:24px">Copyright © 2026 by Stefan Steinweg</p>';
  app.innerHTML=h;
  document.getElementById("rs").onclick=function(){
    var b=this;
    if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="Really delete everything? Tap again";b.style.background="var(--nos)";
      setTimeout(function(){if(document.body.contains(b)){b.dataset.s="";b.textContent="Reset progress";b.style.background=""}},4000)}
    else{know={};missed=[];best=null;save("sd-know",{});save("sd-missed",[]);try{localStorage.removeItem("sd-best")}catch(e){}home()}
  };
  document.getElementById("help").onclick=help;
  document.getElementById("all").onclick=function(){start(Q)};
  document.getElementById("exam").onclick=function(){start(shuffle(Q).slice(0,20))};
  document.getElementById("mis").onclick=function(){if(missed.length)start(Q.filter(function(q,k){return missed.indexOf(k)>-1}))};
  app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){start(Q.filter(function(q){return q[0]===+b.dataset.c}))}});
}
function start(list){deck=shuffle(list);i=0;score=0;wrong=[];show()}
function show(){
  var q=deck[i],opts=shuffle(q[2]),nr=opts.filter(function(o){return o[1]}).length,sel={},done=false;
  app.innerHTML='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+deck.length+'" aria-valuenow="'+i+'"><span style="width:'+(i/deck.length*100)+'%"></span></div>'+
  '<div class="crow" style="align-items:center;margin-bottom:18px"><span class="sub" style="margin:0">Question '+(i+1)+' of '+deck.length+' – Category '+q[0]+'</span><button class="ghost" id="end" style="padding:8px 14px">End</button></div><h2>'+esc(q[1])+'</h2>'+(q[3]?'<img class="qimg" src="'+q[3]+'" alt="Question illustration" loading="lazy">':'')+
  '<p class="sub" style="margin-top:-12px">Choose '+nr+' correct answer'+(nr>1?'s':'')+'.</p>'+
  '<div>'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'" aria-pressed="false"><span class="box"></span><span class="tx">'+esc(o[0])+'</span></button>'}).join("")+'</div><div id="fb" aria-live="polite"><button class="primary" id="chk" disabled style="opacity:.5">Check answer</button></div>';
  var btns=app.querySelectorAll(".opt"),chk=document.getElementById("chk");document.getElementById("end").onclick=function(){var a=done?i+1:i;a>0?result(a):home()};
  btns.forEach(function(b){b.onclick=function(){if(done)return;var k=b.dataset.k;sel[k]=!sel[k];b.classList.toggle("sel",sel[k]);b.setAttribute("aria-pressed",sel[k]);b.firstChild.textContent=sel[k]?"\u2713":"";var any=Object.keys(sel).some(function(x){return sel[x]});chk.disabled=!any;chk.style.opacity=any?1:.5}});
  chk.onclick=function(){
    done=true;var good=true;
    btns.forEach(function(b,k){var s=!!sel[k],r=!!opts[k][1];b.disabled=true;b.classList.remove("sel");
      if(s&&r){b.classList.add("ok");b.firstChild.textContent="\u2713"}
      else if(s&&!r){b.classList.add("no");b.firstChild.textContent="\u2715";good=false}
      else if(!s&&r){b.classList.add("miss");b.insertAdjacentHTML("beforeend","");b.querySelector(".tx").insertAdjacentHTML("beforeend",'<span class="tag">Correct, but not selected</span>');good=false}});
    var id=idx(q);
    if(good){score++;missed=missed.filter(function(x){return x!==id})}else{wrong.push(q);if(missed.indexOf(id)<0)missed.push(id)}
    save("sd-missed",missed);know[id]=good?1:0;save("sd-know",know);
    document.getElementById("fb").innerHTML='<p class="exp"><strong>'+(good?"Correct.":"Not quite.")+'</strong> '+(good?"All correct answers selected, none wrong.":"For a point you must select exactly the correct answers.")+'</p><button class="primary" id="nx">'+(i+1<deck.length?"Next":"Show result")+'</button>'+(i+1<deck.length?'<button class="ghost" id="stop" style="width:100%;margin-top:10px">End now ('+(i+1)+' answered)</button>':'');
    var nx=document.getElementById("nx");nx.onclick=function(){i++;i<deck.length?show():result()};nx.focus();var sp=document.getElementById("stop");if(sp)sp.onclick=function(){result(i+1)};
  };
}
function result(n){n=n||deck.length;
  var pct=Math.round(score/n*100);
  if(n>=20&&(best===null||pct>best)){best=pct;save("sd-best",pct)}
  var msg=pct>=70?"Pass level reached.":pct>=50?"On your way – repeat the mistakes.":"Plenty of room to improve. Practice your mistakes.";
  app.innerHTML='<h1>Result</h1><div class="score">'+score+' / '+n+'</div><p class="sub">'+pct+' % correct – '+msg+'</p>'+
  (wrong.length?'<button class="primary" id="rep">Repeat wrong questions ('+wrong.length+')</button>':'')+
  '<button class="primary" id="again" style="background:var(--acs);color:var(--ink)">New round</button><button class="ghost" id="hm" style="width:100%;margin-top:12px">Back to start</button>';
  if(wrong.length)document.getElementById("rep").onclick=function(){start(wrong)};
  document.getElementById("again").onclick=function(){start(deck)};
  document.getElementById("hm").onclick=home;
}
home();
</script>
