<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAP SD Quiz">
<meta name="author" content="Stefan Steinweg">
<meta name="theme-color" content="#3B4BFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest-en.webmanifest">
<title>SAP SD Quiz</title>
<style>
:root{--bg:#EEF1F8;--sf:#fff;--ink:#14182B;--mute:#5B6280;--ac:#3B4BFF;--acs:#E3E6FF;--ok:#12A150;--oks:#D9F5E5;--no:#E5484D;--nos:#FDE3E4;--ln:#D6DAEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:28px 0 6px}
h2{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 22px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.primary{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:18px;margin-top:18px}
:root[data-theme="dark"] .primary{color:#0E1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0E1020}}
.ghost{padding:12px 16px;border-radius:12px;background:var(--acs);font-weight:600;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start}.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ln);margin-top:1px;display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .box{background:var(--ac);border-color:var(--ac);color:#fff}.opt.ok .box{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no .box{background:var(--no);border-color:var(--no);color:#fff}.opt.miss{border-color:var(--ok);border-style:dashed}.tag{display:block;font-size:13px;color:var(--mute);margin-top:4px}.menu{display:flex;justify-content:space-between;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);font-weight:600}.menu small{color:var(--mute);font-weight:400}.help h3{font-size:18px;margin:24px 0 6px}.help p,.help li{margin:0 0 8px;font-size:16px}.help ul{padding-left:20px;margin:0 0 8px}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:18px}.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:4px}.crow{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:2px solid var(--ln);font-size:17px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--no);background:var(--nos)}
.opt:disabled{cursor:default}
.exp{margin:14px 2px 0;color:var(--mute);font-size:15px}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;margin:30px 0 4px;line-height:1}
.row{display:flex;gap:10px;margin-top:12px}
details{margin-top:28px;background:var(--sf);border-radius:16px;padding:14px 16px;border:1px solid var(--ln)}
summary{font-weight:600;cursor:pointer}
textarea{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:15px/1.4 inherit;resize:vertical}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
#msg{font-size:14px;margin:10px 0 0;min-height:1em}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[[1,"Which of the following statements about the organizational units distribution channel and division are correct?",[["In addition to the sales organization and the division, you need at least one distribution channel to be able to map a sales area.",1],["You need at least one division to be able to create sales orders.",1],["If different distribution channels have already been created, there is no need to create separate divisions.",0],["With a cross-division division you can group several product lines.",1]]],[1,"Roughly speaking, SAP distinguishes between applications and Customizing. Which statements about Customizing are correct?",[["A distinction is made between client-dependent and client-independent Customizing.",1],["In Customizing you can make modifications (program enhancements) to the SAP system.",0],["In Customizing you can adapt the company-neutral functions delivered with the SAP system to the specific business requirements of your company.",1]]],[1,"Which of the following statements about the organizational units plant, shipping point, storage location and company code are correct?",[["The plant plays no role at all in the SD module.",0],["The shipping point specifies from where (spatially) a sales area ships.",1],["Inventory is valuated at plant level.",1],["A plant can be assigned to several sales organizations.",1]]],[1,"To map the sales process, ...",[["...no dedicated organizational units are required. The general organizational units are used.",0],["...dedicated organizational units are required.",1],["...only organizational units that are also used in the SD application component are used.",0],["...organizational units are used that are needed both in sales and in the other modules of the SAP system.",1]]],[1,"Which of the following statements about the organizational unit shipping point is correct?",[["The organizational unit shipping point requires the organizational unit storage location to exist.",0],["The term shipping point always refers to real physical facilities, such as a gate or a ramp, and only counts as additional information in the shipping process.",0],["A shipping point can be assigned to several plants.",1]]],[1,"Which of the following organizational units are required to map a sales area?",[["Shipping point",0],["Storage location",0],["Distribution channel",1],["Sales organization",1],["Division",1]]],[1,"As a sales clerk you often start your work with document entry. What can you do to get into this application faster?",[["You can enter the transaction code for the application in your favorites list to reach the initial screen faster.",1],["You can call a predefined transaction at the same time via your SAP GUI shortcut for quick logon.",1],["You can define a start transaction via the “Extras” menu so that the desired application opens immediately after logon.",1],["At the end of each working day you go to document entry. When you log on the next morning, the document entry transaction is displayed directly.",0]]],[1,"In transaction “VD03” you want to permanently preset the input field sales organization with a specific default value. How do you proceed?",[["In the Workplace you enter the parameter value on the “Field defaults” tab.",0],["In the user defaults you enter the combination of parameter name and value on the “Parameters” tab.",1],["In the entry screen you enter the value in the desired field. Then you right-click and select “Apply parameter value”.",0]]],[1,"Which of the following statements about the organizational unit storage location are correct?",[["Storage locations are always managed via so-called Lean Warehouse Management.",0],["The storage location is used to store material at different places or rooms within a plant.",0],["The organizational unit storage location can be used by all logistics areas of the SAP system.",1],["The storage location is used for quantity-based inventory management.",1]]],[1,"Which of the following statements about the organizational units shipping point/plant/storage location are correct?",[["A shipping point is always uniquely assigned to exactly one plant.",0],["The existence of the organizational unit plant is a prerequisite for deliveries to be created and physically shipped.",0],["The shipping point is the organizational unit in the SAP system responsible for processing shipping.",1],["A storage location designates a physically existing place within the warehouse.",0]]],[1,"Which of the following statements about company code and client are correct?",[["Completely separate customer master records are stored and maintained in each client.",1],["Completely separate customer master records are stored and maintained in each company code.",0],["A client can only have one company code.",0],["A balance sheet can be created for a company code.",1]]],[1,"An organizational unit is ...",[["...always also a legal entity.",0],["...always an organizational and (at the same time) legal entity.",0],["...a building block in the organizational structure of a company.",1],["...an organizational and sometimes (at the same time) also a legal entity.",1]]],[1,"You are in the transaction “Create Inquiry”. You want the document date you already entered to be available again when you restart the transaction, because you often enter several inquiries in a row with the same date. The document date should be available as a default value that you can overwrite. How do you proceed?",[["From the menu bar you choose “System > User Profile > Take Data”.",0],["From the menu bar you choose “System > User Profile > Own Data”.",0],["From the menu bar you choose “System > User Profile > Hold Data”.",1]]],[1,"With user defaults, for example, the sales organization can be set as a user parameter so that it is entered automatically as a default value in the fields in the future. What should you keep in mind regarding user defaults?",[["User parameters are lost after logging off and must be entered again after every logon.",0],["User parameters only apply to the user who entered them with their user name after logging on.",1],["User parameters cannot be changed later.",0],["Using user parameters saves time and reduces the number of input errors.",1]]],[1,"Which of the following statements about the shipping point are correct?",[["Each delivery is processed by exactly one shipping point.",1],["Several shipping points can be assigned to a plant.",1],["The existence of shipping points is a prerequisite for deliveries to be created.",1],["The shipping point is always at header level in the sales order.",0]]],[1,"You want to find a master record in an application (e.g. Sales). Which tools are available in the SAP system to search for master records created in the system?",[["If value help is available for an input field, there is a pushbutton next to the field. When you click this pushbutton, the search helps for the fields are displayed.",1],["You position the cursor in the relevant field. Then you press the function key “F4” and the search helps are displayed.",1],["You call up help with the function key “F1” and have all records created in the system displayed. Then you select the correct master record by double-clicking.",0]]],[1,"Which of the following statements about the sales area is correct?",[["A sales area is an independent organizational unit.",0],["The link from company code to sales area is made via the organizational unit sales organization.",1],["The sales area is a combination of sales organization, shipping point and division.",0]]],[1,"Which of the following statements about the organizational unit sales organization are correct?",[["Several sales organizations can be assigned to a company code.",1],["The sales organization assigns the sales area to the company code.",1],["A maximum of one distribution channel can be assigned to a sales organization.",0],["Several plants can be assigned to a sales organization.",1]]],[1,"With the help of sessions you can open several transactions at the same time. You use a session so that you can change master data at any time. Why should a session that is no longer needed be closed?",[["Many open sessions use more resources on your computer and slow it down.",1],["It can happen that you can no longer switch between many open sessions, because you can open any number of sessions.",0],["It can happen that data from your open session is overwritten by other users.",0],["It can happen that data from your open session cannot be edited by other users because it is locked for editing.",1]]],[1,"You are in the SAP system and want to display a master record. You have values displayed via the matchcode help. Although you are sure that the master record you are looking for exists, the list does not contain it. What could be the reason?",[["You do not have the necessary authorizations to display the master record.",0],["Your restrictions in the matchcode search exclude the master record.",1],["There are more entries than can be displayed by the “maximum number of hits”.",1]]],[1,"All sales documents can be output in the form of messages. Which statements about messages are correct?",[["Via the Print Preview icon in the order, the message can be displayed on screen.",1],["Messages must always be output immediately.",0],["Messages are usually output manually. A background job is only used in exceptional cases.",0],["Several options are available for outputting messages. For example, they can be printed, sent by email or faxed.",1]]],[2,"Which of the following statements about the billing document are correct?",[["Billing serves as a data source for Financial Accounting (FI) to support the accounting clerk with payment monitoring and processing.",1],["The billing document is divided into the three levels header, item and schedule line.",0],["Billing is a document of the shipping area.",0],["Several deliveries can be combined into one billing document, provided they share characteristics that are essential for billing.",1]]],[2,"You are explaining document number assignment in the SAP system to your substitute. In your company, all document numbers are assigned internally. You explain the relationship between document number range and documents. Which statement is correct?",[["No document type may be assigned to a number range.",0],["Several number ranges can be assigned to one document type.",0],["A number range must be assigned to a document type.",1]]],[2,"Which of the following statements about the delivery document are correct?",[["When the delivery document is created, important information from the sales order is copied into the delivery document.",1],["In contrast to the sales document, the delivery document can also have schedule lines.",0],["In SAP terminology, the delivery document is typically created by the sales employee.",1],["The delivery document is the central control element in the shipping process.",1]]],[2,"Which of the following statements about the delivery document are correct?",[["When creating the delivery document, data such as the materials and the confirmed quantities are copied from the sales order.",1],["The delivery document controls, supports and monitors all sub-processes of shipping processing.",1],["If you want to display a delivery document, the following path is to be selected: Logistics -> Sales -> Selling -> Shipping -> Display.",0],["A delivery document can only be created if a sales order has been created beforehand.",0]]],[2,"Documents are often created with reference to preceding documents. With reference to which preceding documents can customer inquiries be created?",[["Inquiry",1],["Order",1],["It is not possible to create an inquiry with reference to a preceding document.",0],["Quotation",1]]],[2,"Which of the following statements about sales and delivery documents is correct?",[["Delivery documents (deliveries) generally have the levels header, item and schedule line.",0],["Several delivery documents can be created from one sales document.",1],["Both sales documents and delivery documents (deliveries) are structured into the levels header, item and schedule line.",0],["Each item in the sales document corresponds to exactly one item in the delivery document.",0]]],[2,"In the application component (Sales & Distribution), various sales document types are distinguished. Which of the following document types are sales documents?",[["Credit memo",0],["Returns",1],["Invoice",0],["Scheduling agreement",1],["Delivery",0]]],[2,"Sales documents are documents that are created during presales and order processing. Which of the following statements about sales documents are correct?",[["A sales document, once created, always refers to a sales area. This depends on the ship-to party.",0],["A sales document is structured into the three levels header, item and schedule line.",1],["A sales document is usually created on an overview screen.",1],["A sales document, once created, always refers to a single sales area. This depends on the sold-to party.",1]]],[2,"Some document types consist of the levels header, item and schedule line. Which of the following statements are correct?",[["In the delivery schedule, the data is distributed across the levels header, item and schedule line.",1],["In the billing document, the data is distributed across the levels header, item and schedule line.",0],["In the transportation order, the data is distributed across the levels header, item and schedule line.",0],["In the sales order, the data is distributed across the levels header, item and schedule line.",1]]],[2,"Which statements about document types in sales are correct?",[["The sales document types control the documents in sales.",1],["The inquiry type controls the documents in presales activities.",0],["The delivery type controls the documents in shipping.",1],["The transportation type controls the documents in the picking process.",0],["The billing type controls the documents in billing.",1]]],[3,"You want to create a customer quotation. Which of the following statements are correct?",[["When creating a customer quotation with reference, both individual items of the inquiry and the inquiry as a whole can be copied into the customer quotation.",1],["If individual price agreements exist with a customer, manual price entries are always required when creating the quotation.",1],["If no sales area is entered when creating a customer quotation, it is derived from the master data of the sold-to party or the ship-to party.",1],["It is possible to create a customer quotation with reference to another customer quotation.",1],["Via the \"Create with reference\" button, you can only access inquiries created so far. Other document types cannot be used as a reference source.",0]]],[3,"If you do not enter a ship-to party when creating the order, then...",[["...the order cannot be saved.",0],["...the ship-to party must be entered subsequently during delivery.",0],["...the ship-to party is automatically set equal to the sold-to party.",1]]],[3,"Various document types can be created via the sales order. If the transaction VA01 (Create Sales Order) is called again, then...",[["...the sales document type TA (scheduling agreement) is always proposed.",0],["...depending on the preceding documents (inquiry, contact, etc.)automatically propose the correct sales document type.",0],["...propose the most recently used sales document type (if no other default value is stored in the user master record).",1]]],[3,"You have created a sales order. The incompletion log shows that the following data is missing: payment terms, gross weight, shipping point, and delivering plant. Which of the following statements are correct in this context?",[["The data listed above must (as long as the master data is not maintained accordingly) be entered manually each time an order is created.",1],["The functions of the incompletion log exist in the SD (Sales & Distribution) application component exclusively in the sales order and in the delivery.",1],["The term \"incompletion log\" does not exist in SAP terminology. The facts listed above are instead shown in the so-called error log.",0],["In Customizing, it is configured which fields belong to the incompletion log.",1]]],[3,"You have created a sales order. It comprises 2 items. Which of the following statements are correct?",[["By double-clicking on an item, you reach the item level. On the \"Conditions\" tab, you can view the pricing procedure for the item.",1],["You select the item whose pricing you want to analyze. Then choose Goto/Item/Conditions in the menu.",1],["It is not possible to analyze pricing from the SD application component. Pricing is analyzed via Controlling.",0],["It is not possible to analyze the pricing of the sales order as a whole (items 10 and 20 combined) from the \"Create Sales Order\" transaction.",1]]],[3,"If you do not enter organizational data (sales organization, distribution channel, etc.) on the initial screen when creating an order, then...",[["...the order is saved without organizational data.",0],["...the organizational data from the last order created is copied.",0],["...the system automatically derives the sales area from the customer master record.",1]]],[3,"Which of the following default values in the scheduling agreement are copied from the condition records?",[["Discount",1],["Delivery condition",0],["Freight",1],["Prices",1],["Volume",0]]],[3,"You create an order for customer 200901. You are not sure whether this customer accepts partial deliveries or insists on complete deliveries. Which of the following statements is correct in this context?",[["In the vendor-material info, it can be defined at schedule line level whether the order quantity may be split.",0],["You can find the indicator for complete delivery or partial delivery in the sales order at schedule line level.",0],["From order creation (Shipping tab), it can be seen whether partial deliveries are allowed.",1]]],[3,"Every sales document contains a large amount of data. Which statements are correct in this context?",[["A sales order can never be a data source for a delivery.",0],["Default values in sales documents can be copied from preceding documents and also from master data.",1],["A large part of the data is copied automatically from various sources. This data can be overwritten manually.",1],["The general data in the customer master record is irrelevant when creating a sales document.",0]]],[3,"An order, like other sales documents, consists of a document header and one or more items, with each of these items consisting of one or more schedule lines. Which statements apply in this context?",[["The document header always overrides the settings in the item details.",0],["The information in the document header, such as the payment terms, applies to the entire order.",1],["Information stored in the document header has no effect on the document items.",0],["Additional information that is not present in the document header can be maintained in the items of an order.",1]]],[3,"You create a delivery with reference to a sales order. The sales order has 3 schedule lines. Which of the following statements are correct?",[["The number of schedule lines in the delivery document also depends on whether a partial delivery agreement exists with the customer.",0],["Only schedule lines with confirmed quantities are taken into account.",1],["The delivery document subsequently has at least 3 schedule lines.",0]]],[3,"The central step in the sales process is the creation of a sales order. Which of the following statements about the sales order are correct?",[["If a sales order is created \"with reference,\" then most of the data from the preceding document is copied into the order (weighting 1).",1],["Changes in the header data of the sales order are automatically copied to order items that have already been entered.",1],["Even when the sales order is created, certain data for shipping is determined by the system.",1],["Even when the sales order is created, the condition schema is used and a corresponding sales price is calculated.",0]]],[3,"You create a sales order. You also want to enter materials from different divisions. Evaluate the following statements on sales order processing.",[["If you did not enter a division when creating the order, the division is determined from the material master of the first order item.",0],["In Customizing, it can be specified that materials from different divisions (cross-division sales) can also be entered in a single sales document.",1],["Every sales document must be assigned to a sales area. It is therefore not possible to enter materials from different divisions in a single sales document.",0],["If you did not enter a division when creating the order, then the division is determined from the customer master record of the sold-to party.",1]]],[4,"The partner roles for the customer master are stored in the customer master in the sales area data. Check which of the given partner roles are absolutely required for a complete sales and distribution process (incl. billing)?",[["Ship-to party",1],["Bill-to party",1],["Contact person",0],["Sold-to party",1],["Forwarding agent",0]]],[4,"Your company consists of various organizational levels that are represented in the SAP system. What does this mean for creating the Basic Data view of material master records?",[["They must be created per plant.",0],["They must be created per company code.",0],["They are created per client.",1]]],[4,"You want to enter an order. Which of the following statements about partner roles are correct?",[["The sold-to party can be specified both at header level and at item level in the document.",0],["It is possible to assign several ship-to parties to one customer master record. When entering the order, the processor must select the respective ship-to party.",1],["Orders used exclusively for processing services do not need a ship-to party, since no delivery has to be created either.",0],["Sold-to party, bill-to party, invoice recipient, and ship-to party are always determined from the customer master, but can also be changed in the header of the order.",1]]],[4,"You have stored several ship-to parties in the partner roles in the customer master record. Which of the following statements is correct?",[["It is possible to store more than one ship-to party in a customer master record.",1],["Orders used exclusively for processing services do not need a ship-to party, since no delivery has to be created either.",0],["If no ship-to party has been entered by the time the order is created, then in the SAP system the ship-to party is set by default to be the same as the sold-to party.",1],["It is not possible to create a delivery-relevant order without a ship-to party.",1]]],[4,"The material number can be entered externally. Which statement about external number assignment is correct?",[["The material number can consist of any number of characters.",0],["Only digits may be used.",0],["The material number can consist of letters and digits.",1],["Only letters may be used.",0]]],[4,"When creating materials, the material type controls the following things, among others.",[["The type of number assignment.",1],["The views that are offered for entry.",1],["The permitted procurement type.",1],["The storage location.",0]]],[4,"Which of the following statements about material master data are correct?",[["The storage location is stored in the material master data on the \"Billing disposition\" tab.",0],["Each material can - across all sales areas - be assigned to only a single division.",0],["Through Customizing settings, various fields within a tab can be made mandatory-entry fields.",1],["Each material master record is assigned a material type.",1]]],[4,"You have copied the material master data of material MAT-4711 to a new material MAT-4712. As a result, you notice that only part of the data was copied to the new material master. What could be the causes of this?",[["In the view selection, you selected only part of the views to be copied.",1],["You failed to specify from which sales view of the reference material you want to copy the master data.",0],["You did not mark all tabs whose contents you want to copy.",1],["Only the basic data can be copied from one material master to another material master, other views must be updated manually.",0]]],
[4,"The customer master is divided into General Data, Sales Area Data and Company Code Data. To make data maintenance easier, the data is split across different tabs. Which of the following tabs belong to the customer master Sales Area Data?",[["Billing",1],["Partner Functions",1],["Unloading Points",0],["Shipping",1],["Export Data",0]]],
[4,"The material MAT-4711 is sold through different sales organizations (V100 and V200) and different distribution channels (V1, V2 and V3). Which of the following statements is correct?",[["For any combination of sales organization and distribution channel, the same sales area data is used.",0],["If different sales master data is to apply to different combinations of sales organization and distribution channel, it must be created beforehand.",1],["For any combination of sales organization and distribution channel, the same general data (tabs Basic Data 1, Basic Data 2) is used.",1],["The master data from any combination of sales organization and distribution channel can also be copied to new sales areas when the sales view is created.",1]]],
[4,"Muster GmbH has set up 2 sales areas (A and B). In sales area A, two distribution channels are provided (retail and wholesale); in sales area B, one distribution channel is provided (resellers). The customer Name 200901 is served through both sales areas. The general data for debtor 200901 must be...",[["...created at least twice.",0],["...created three times.",0],["...created only once.",1]]],
[4,"Which of the following statements about customer master data are correct?",[["The sales area data in the customer master is identical for all sales areas.",0],["Several ship-to parties can be entered in the sales area data of a customer master.",1],["The sales area data depends on the chosen combination of sales organization, distribution channel and division.",1],["Through customizing settings, various fields within a tab can be hidden.",1]]],
[4,"Muster GmbH has 2 sales organizations (sales organization V100 and V200). You want to supply customer 200901 through both sales organizations. However, sales organization V200 has agreed different Incoterms with the customer than sales organization V100. Which of the following statements are correct?",[["Only a single sales organization can be assigned to an individual company (here Muster GmbH).",0],["A combination of sales organization, distribution channel and division forms a sales area.",1],["It is possible to maintain different Incoterms in the customer master for different sales organizations.",1],["In the SAP system, it is not provided by default that different sales organizations agree different Incoterms with one and the same customer.",0]]],
[4,"Which of the following statements about partner functions is correct?",[["The payer is responsible for paying the invoice.",1],["Bill-to party and payer are always identical.",0],["Sold-to party and payer are always identical.",0]]],
[4,"A customer-material info record exists for customer 200901 and material MAT-4711. Which of the following statements is correct?",[["If the material master MAT-4711 and the customer-material info record contain differing data, the material master data takes precedence over the customer-material info record during document processing.",0],["If the customer master 200901 and the customer-material info record contain differing data, the customer master data takes precedence over the customer-material info record during document processing.",0],["When you enter an order for the purchaser 200901, you can also enter the individual order items using the customer's material number.",1],["The customer-material info record is used to combine data of a specific customer and a specific material.",1]]],
[4,"Views must be selected when creating the material master. Which statements about views are correct?",[["There is no connection between the material type and the selectable views.",0],["The maintenance status provides information about the views currently maintained.",1],["All relevant views must be selected when first creating the material, because further views cannot be added at a later time.",0],["The views in the material master reduce the complexity of the information they contain by dividing it into logical groups.",1]]],
