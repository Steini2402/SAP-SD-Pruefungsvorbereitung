<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Extra Fragen">
<meta name="author" content="Stefan Steinweg">
<meta name="theme-color" content="#3B4BFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Extra Fragen</title>
<style>
:root{--bg:#EEF1F8;--sf:#fff;--ink:#14182B;--mute:#5B6280;--ac:#3B4BFF;--acs:#E3E6FF;--ok:#12A150;--oks:#D9F5E5;--no:#E5484D;--nos:#FDE3E4;--ln:#D6DAEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:28px 0 6px}
h2{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 22px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.primary{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:18px;margin-top:18px}
:root[data-theme="dark"] .primary{color:#0E1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0E1020}}
.ghost{padding:12px 16px;border-radius:12px;background:var(--acs);font-weight:600;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start}.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ln);margin-top:1px;display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .box{background:var(--ac);border-color:var(--ac);color:#fff}.opt.ok .box{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no .box{background:var(--no);border-color:var(--no);color:#fff}.opt.miss{border-color:var(--ok);border-style:dashed}.tag{display:block;font-size:13px;color:var(--mute);margin-top:4px}.menu{display:flex;justify-content:space-between;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);font-weight:600}.menu small{color:var(--mute);font-weight:400}.help h3{font-size:18px;margin:24px 0 6px}.help p,.help li{margin:0 0 8px;font-size:16px}.help ul{padding-left:20px;margin:0 0 8px}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:18px}.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:4px}.crow{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:2px solid var(--ln);font-size:17px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--no);background:var(--nos)}
.opt:disabled{cursor:default}
.exp{margin:14px 2px 0;color:var(--mute);font-size:15px}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;margin:30px 0 4px;line-height:1}
.row{display:flex;gap:10px;margin-top:12px}
details{margin-top:28px;background:var(--sf);border-radius:16px;padding:14px 16px;border:1px solid var(--ln)}
summary{font-weight:600;cursor:pointer}
textarea{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:15px/1.4 inherit;resize:vertical}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
#msg{font-size:14px;margin:10px 0 0;min-height:1em}
.qimg{display:block;width:100%;height:auto;border:1px solid var(--ln);border-radius:14px;margin:14px 0 18px;background:var(--sf)}
</style>
</head>

<main id="app"></main>
<script>
var Q=[[1,"Sie erstellen einen Kundenauftrag für Kunde 200901 und 50 Stück des Materials MAT-4711. Anhand der Verfügbarkeitsprüfung sehen Sie, dass die Lieferung nicht für das Wunschlieferdatum bestätigt werden kann. Welche Faktoren könnten bei der Ermittlung dieses Ergebnisses im Prüfungsumfang berücksichtigt worden sein?",[["Reservierungen von der Materialwirtschaft",1],["Materialbestände in alternativen Auslieferungswerken",0],["Zukünftige Wareneingänge aus Bestellungen",1],["Die Lieferpriorität des Kunden",0]],"","2fb0559d"],[1,"Welche Aussagen beschreiben zutreffend die Beziehung zwischen Kopf und Positionsdaten bei einem Kundenauftrag?",[["Im Belegkopf gespeicherte Informationen haben keinen Einfluss auf die Belegpositionen.",0],["Wenn Informationen in der Position eines Auftrags geändert werden, hat das keinen Einfluss auf die im Auftragskopf gespeicherten Informationen.",1],["Informationen im Belegkopf überschreiben stets Daten, die auf Positionsebene gespeichert sind.",0],["Manche Informationen im Belegkopf wie z. B. die Zahlungsbedingungen sind für den gesamten Auftrag gültig, können aber auf Positionsebene geändert werden.",1]],"","53a77efa"],[1,"Für die Geschäftspartnerpflege ist der Kundenstamm in allgemeine Daten, Vertriebsbereichsdaten und Buchungskreisdaten unterteilt. Innerhalb dieser Bereiche sind die Daten sind auf verschiedenen Registerkarten gruppiert. Welche der folgenden Registerkarten sind Teil der Vertriebsbereichsdaten des Kundenstamms?",[["Abladestellen",0],["Faktura",1],["Partnerrollen",1],["Exportdaten",0],["Versand",1]],"","d7fe19c0"],[1,"Welche Funktionen hat bei der Rückstandsbearbeitung in SAP S/4HANA das BOP-Segment?",[["Es legt Auswahlkriterien zur Ermittlung von Bedarfen fest, die während eines BOP-Laufs gleich gehandhabt werden müssen, beispielsweise Material oder Kunde.",1],["Es wendet einen Priorisierer an, der die Bedarfe in eine bestimmte Reihenfolge bringt, z.B. Lieferpriorität oder Kundengruppe.",1],["Es führt eine Massen-Verfügbarkeitsprüfung für Bedarfe durch (z.B. Kundenauftragspositionen), die online oder als Hintergrundjob eingeplant ausgeführt wird.",0],["Es steuert, welche Bestätigungsstrategie bei einem Rückstandsbearbeitungslauf anzuwenden ist, z.B. gewinnen, verlieren oder umverteilen.",0]],"","7fb5e3f5"],[1,"Zum Customizing von Verkaufsbelegarten gehören Parameter, mit deren Hilfe zwischen spartenbezogener und spartenübergreifender Verkaufsabwicklung gewählt werden kann. Was ist mithilfe dieser Parameter möglich?",[["Sie können festlegen, dass die Sparte in der Auftragsposition aus dem Kunden-Material-Informationsstammsatz kopiert wird.",0],["Sie können verhindern, dass Materialien mit einer Sparte, die sich von der Sparte im Auftragskopf unterscheidet, in den Kundenauftrag aufgenommen werden.",1],["Sie können sicherstellen, dass die Sparte aus dem Belegkopf stets in alle Positionen des Kundenauftrags kopiert wird.",1],["Sie können einen Unterschied zwischen den Sparten im Auftragskopf und in der Position mit einer Fehlermeldung zurückweisen, die Benutzer ggf. überschreiben können.",0]],"","68c95cdf"],[1,"Welche der folgenden Aspekte sind Merkmale des SAP Fiori Launchpad?",[["Jede Geschäftsanwendung wird mit einer Kachel dargestellt. Benutzer können Kacheln gruppieren, neu anordnen und entfernen.",1],["Es ist nicht möglich, die Namen vorhandener Kachelgruppen zu ändern.",0],["Sie können Standardwerte für wichtige Felder in Apps eingeben, z.B. Verkaufsorganisation, Vertriebsweg und Sparte.",1],["Sie müssen eine transaktionale App zur Überwachung und Analyse komplexer Themen verwenden.",0],["Das SAP Fiori Launchpad stellt die Kachelkataloge bereit, die alle für den Benutzer verfügbaren Kacheln enthalten.",1]],"","e77f7a34"],[1,"Sie haben einen Kundenauftrag mit drei Positionen angelegt. Sie möchten jetzt die detaillierte Preisfindung für die erste dieser Positionen einsehen. Wie gehen Sie vor?",[["Wechseln Sie zur SAP-Fiori-App Kostenanalyseblatt\".",0],["Wechseln Sie zur ersten Position, und wählen Sie die Registerkarte \"Fakturabeleg\".",0],["Wechseln Sie zum Auftragskopf, wählen Sie die Registerkarte \"Konditionen\", und führen Sie einen Drilldown auf die erste Position durch.",0],["Wechseln Sie zur ersten Position, und wählen Sie die Registerkarte \"Konditionen\".",1]],"","4d0d54fa"],[1,"Beim Anlegen eines Materialstamms müssen Sie die Sichten auswählen, die Sie anlegen wollen. Welche Aussagen treffen auf die Erstellung und Pflege dieser Sichten zu?",[["Die Grunddatensichten enthalten Informationen zum Material, die für den gesamten Mandanten gültig sind.",1],["Es gibt keinen Zusammenhang zwischen der Materialart und den auswählbaren Sichten.",0],["Alle relevanten Sichten müssen beim Anlegen ausgewählt werden, da zusätzliche Sichten zu einem späteren Zeitpunkt nicht mehr hinzugefügt werden können.",0],["Die Materialstammsichten, die verkaufsrelevante Informationen enthalten, hängen von der Verkaufsorganisation und dem Vertriebsweg ab.",1]],"","4f96fc27"],[1,"Wie reagiert das System, wenn Sie einen Auftrag anlegen, aber im Einstiegsbild KEINEN Vertriebsbereich angeben?",[["Das System gibt eine Fehlermeldung aus, da der Vertriebsbereich eine Pflichtangabe ist.",0],["Das System erstellt den Auftrag ohne Organisationsdaten.",0],["Der Vertriebsbereich wird automatisch anhand des Auftraggebers ermittelt.",1],["Das System verwendet den Vertriebsbereich des zuletzt angelegten Auftrags.",0]],"","883d6771"],[1,"Welche Aussagen treffen auf den Kundenstammsatz zu?",[["Sie können im Customizing die Einstellungen so ändern, dass bestimmte Felder im Kundenstamm nicht angezeigt werden.",1],["Wenn ein Kunde Bestellungen über mehrere Vertriebsbereiche hinweg aufgibt, müssen die Vertriebsbereichsdaten für diesen Kunden in allen Vertriebsbereichen identisch sein.",0],["In den Vertriebsbereichsdaten eines Kunden können mehrere Warenempfänger hinterlegt werden.",1],["Sobald ein Kundenstammsatz angelegt wurde, ist es nicht mehr möglich, diesem Stammsatz weitere Partnerrollen hinzuzufügen.",0],["Die Vertriebsbereichsdaten basieren auf einer Kombination aus Verkaufsorganisation, Vertriebsweg und Sparte.",1]],"","097744e0"],[1,"Welche Auswirkungen hat es, wenn der Warenausgang für eine Auslieferung gebucht wird?",[["Die Warenausgangsbuchung aktualisiert die Liefermenge mit der kommissionierten Menge.",0],["Die Warenausgangsbuchung für eine Lieferung hat keine Auswirkungen auf die Finanzbuchhaltung.",0],["Im Anschluss an die Warenausgangsbuchung kann die Auslieferung als Basis für die Fakturierung dienen.",1],["Die Warenausgangsbuchung aktualisiert den Bestand in der Bestandsführung.",1]],"","8c46aa91"],[1,"Der Anfangsbestand für das Material beträgt 100 Stück. Es liegen zwei Bestellungen für jeweils 50 und 60 Stück vor. Es liegen auch Kundenaufträge über 100, 40 und 50 Stück vor. Sie erfassen einen weiteren Kundenauftrag über 20 Stück, für den der Kunde so schnell wie möglich eine Lieferung wünscht und ggf. Teillieferungen akzeptiert. Welche Aussage ist in Anbetracht der geschilderten Bestandssituation (siehe Grafik) richtig?",[["Eine Einmallieferung von 20 Stück wird für ein Datum bestätigt, das nach dem Wunschlieferdatum liegt.",0],["Am Wunschlieferdatum des Kunden können 20 Stück geliefert werden",0],["Zwei Teillieferungen à 10 Stück werden bestätigt, können aber beide nicht am Wunschlieferdatum des Kunden geliefert werden.",1],["Zwei Teillieferungen à 10 Stück werden bestätigt, von denen die erste am Wunschlieferdatum des Kunden geliefert werden kann",0]],"../bild3.jpg","090a2a67"],[1,"In SAP S/4HANA liegt eine Anfrage vor. Dem Belegfluss zufolge hat sie den Bearbeitungsstatus \"Erledigt\". Welche der folgenden Aktionen hat diesen Status festgelegt?",[["Erstellung eines Angebots mit Bezug auf die Anfrage",1],["Erstellung eines separaten Angebots für denselben Kunden",0],["Erstellung der Anfrage",0],["Die Anfrage bleibt bis nach ihrem Gültig bis\" Datum unreferenziert.",0]],"","aad49c7b"],[1,"Was ist ein Merkmal des Vertriebsprozesses in SAP S/4HANA?",[["Der Vertriebsprozess umfasst die Bereiche Verkaufs-, Versand- und Rechnungsprüfung.",0],["Der Vertriebsprozess endet in der Regel mit der Erstellung einer Auslieferung.",0],["Einzelne Geschäftsvorfälle in SAP S/4HANA Sales werden in einer Abfolge miteinander verknüpfter Belege festgehalten.",1],["Der Vertriebsprozess beginnt immer mit der Erfassung eines Kundenauftrags.",0]],"","30b5f9b8"],[1,"Welche dieser Geschäftsvorfälle und Funktionen können direkt aus dem Kundenauftrag ausgelöst werden?",[["Bedarfsübergabe an die Disposition",1],["Anlegen eines Auslieferungsauftrags in SAP EWM",0],["Anlegen eines Fertigungssauftrags für die Montageabwicklung",1],["Verfügbarkeitsprüfung für die bestellten Materialien",1],["Bearbeitung und Überwachung des gesamten Fremdbeschaffungsprozesses",0]],"","63bf15ec"],[1,"In der SAP-Fiori-App Material anzeigen\" können Sie die Sicht \"Vertrieb: VerkaufsorgDaten 2\" auswählen. Welche Daten werden in dieser Sicht angezeigt?",[["Die Felder: Sparte und Basismengeneinheit",0],["Die Felder: Materialpreisgruppe und Positionstypengruppe",1],["Die Felder: Auslieferungswerk und Steuerklassifikation",0],["Die Felder: Verfügbarkeitsprüfung und Ladegruppe",0]],"","64bce6c5"],[1,"Welchen Zweck erfüllt ein Positionsvorschlag?",[["Sie möchten einem Kunden für seine Erstbestellung eine bestimmte Materialauswahl empfehlen.",1],["Sie möchten verschiedene Materialien mit der Materialnummer des Kunden in einen Kundenauftrag eingeben.",0],["Ein Kunde bestellt häufig dieselbe Materialkombination, und Sie möchten, dass sich die Aufträge dieses Kunden schneller erfassen lassen.",1],["Sie möchten einen Satz an kundenindividuellen Preisen für die von diesem Kunden bestellten Materialien anwenden.",0]],"","e249b188"],[1,"Welche Aussage beschreibt zutreffend die Bearbeitung der Auslieferung?",[["Auftragspositionen mit unterschiedlichen Incoterms können in eine einzelne Auslieferung zusammengefasst werden.",0],["Jede Auslieferung wird genau einer Route zugeordnet.",1],["Jede Position einer Auslieferung kann von einer anderen Versandstelle bearbeitet werden.",0],["Die Versandstelle in einer Auslieferung wird mithilfe der Versandstellenfindung bestimmt.",0]],"","711ec380"],[1,"Welche Aussagen beschreiben zutreffend die Nutzung der Versandstelle?",[["Eine Versandstelle kann mehreren Werken zugeordnet werden.",1],["Die Versandstelle wird einer Kombination aus Werk und Lagerort zugeordnet.",0],["Jede Lieferung wird von genau einer Versandstelle bearbeitet.",1],["Es muss mindestens eine Versandstelle vorhanden sein, damit Auslieferungen erstellt werden können.",1],["Die Versandstelle ist in einem Kundenauftrag auf Kopfebene zu finden.",0]],"","0d12a519"],[1,"Wie funktionieren Versand- und Transportterminierung in einem Kundenauftrag?",[["Ziel der Versand- und Transportterminierung ist es, die Transportkosten so gering wie möglich zu halten.",0],["Ausgangspunkt für die Vorwärtsterminierung ist das Materialbereitstellungsdatum.",1],["In der Regel führt das System zuerst eine Vorwärtsterminierung durch. Wenn das nicht erfolgreich ist, wird eine Rückwärtsterminierung durchgeführt.",0],["Ausgangspunkt für die Rückwärtsterminierung ist das Wunschlieferdatum des Kunden.",1]],"","d8ae6d59"],[1,"Welche Felder werden in der Sicht,,Vertrieb: allg./Werk\" eines Materials gepflegt?",[["Transportgruppe",1],["Positionstypengruppe",0],["Verfügbarkeitsprüfung",1],["Steuerklassifikation",0]],"","9001a7c9"],[1,"Was passiert, wenn Sie beim Anlegen eines Auftrags KEINEN Warenempfänger angeben?",[["Der Warenempfänger wird aus dem Stammsatz des Auftraggebers ermittelt.",1],["Der Warenempfänger muss bei der Erstellung der Auslieferung eingegeben werden.",0],["Der Auftrag kann nicht gespeichert werden.",0],["Es wird davon ausgegangen, dass der Warenempfänger und der Auftraggeber identisch sind.",0]],"","654d22a3"],[1,"Es wird ein Kunden-Material-Informationsstammsatz für Kunde 200901 und Material MAT-4711 angelegt. Die Materialnummer des Kunden wird zusammen mit anderen Informationen eingegeben. Inwiefern beeinflusst dieser neu angelegte Stammsatz die Erfassung von Kundenaufträgen?",[["Im Materialstamm sind die Kerndaten des Materials MAT-4711 hinterlegt. Für dieses Material wird ein separater Satz an Materialdaten im Kunden-Material-Informationsstammsatz hinterlegt. Beide Datensätze werden bei der Auftragserfassung abgerufen.",0],["Im Kundenstamm sind die Kerndaten des Kunden 200901 hinterlegt. Für diesen Kunden wird ein separater Satz an Kundendaten im Kunden-Material-Informationsstammsatz hinterlegt. Beide Datensätze werden bei der Auftragserfassung abgerufen.",0],["Der Kunden-Material-Informationsstammsatz enthält eine Vielzahl von Daten, die speziell für diese Kombination aus Kunde und Material zutreffen. Bei der Auftragserfassung überschreiben diese Daten die entsprechenden Informationen aus dem Kundenstamm und/oder dem Materialstamm.",1],["Wenn ein Auftrag für den Auftraggeber 200901 erfasst wird, lässt sich bei der Eingabe der Kundenauftragsposition anhand der Materialnummer des Kunden das Material MAT-4711 finden.",1]],"","e4568d73"],[1,"In der Bestandsübersicht wird die Bestandsmenge angezeigt. Auf welcher Ebene der Unternehmensstruktur zeigt SAP Bestandsführung (IM) die Bestandsmengen an?",[["Lagerortebene",1],["Lagerebene",0],["Lagertypebene",0],["Lagerplatzebene",0]],"","4da12196"],[1,"Der Inhalt welcher der folgenden Felder muss identisch sein, damit Kundenaufträge in dieselbe Lieferung zusammengefasst werden können?",[["Versandstelle",1],["Warenempfänger",1],["Werk",0],["Route",1],["Zahlungsbedingungen",0]],"","149ecc45"],[1,"Welche Aussagen beschreiben zutreffend die Nutzung der Partnerrolle \"Warenempfänger\"?",[["Es ist nicht möglich, einen lieferrelevanten Auftrag ohne Warenempfänger anzulegen.",1],["In einem Kundenstammsatz können mehrere Warenempfänger hinterlegt werden.",1],["Bei Aufträgen, die nur den Verkauf von Dienstleistungen beinhalten, ist kein Warenempfänger notwendig, da keine Lieferung erstellt wird.",0],["Im Kundenauftragskopf können bis zu vier Warenempfänger gespeichert werden.",0]],"","c3f3e1f2"],[1,"Es wird ein Kundenauftrag für ein Material eingegeben, das in ausreichender Menge vorhanden ist. Allerdings ist das Wunschlieferdatum zu früh, sodass es nicht bestätigt werden kann. Wie würde der Benutzer darauf aufmerksam gemacht werden?",[["Das System zeigt das Bild \"Verfügbarkeitskontrolle an, um auf das Problem aufmerksam zu machen.",0],["Ein Unvollständigkeitsprotokoll wird erstellt.",0],["Für die Auftragsposition werden mehrere Einteilungen festgelegt.",1]],"","13d3539d"],[1,"Welche Aussagen beschreiben zutreffend die Rolle des Lagerorts?",[["Der Lagerort wird für die mengenmäßige Bestandsführung (IM) verwendet.",1],["Jedem Werk muss mindestens ein Lagerort zugeordnet werden.",1],["Der Lagerort ist Teil der Struktur von SAP Extended Warehouse Management (EWM).",0],["Jeder Lagerort wird eindeutig einem Buchungskreis zugeordnet.",0]],"","083a4396"],[1,"Für welche Aufgaben eignet sich die SAP-App Erfüllung von Kundenaufträgen\"?",[["Zur Überwachung von Fakturen",0],["Zur Zuordnung eines Kundenauftrags zu einem anderen Vertriebsbereich",0],["Zur Bearbeitung der Zahlungsbedingungen in einem Kundenauftrag",1],["Zur Überwachung von Kundenaufträgen in kritischen Phasen",1],["Zum Beheben von Fehlern bei Kundenaufträgen, die für Lieferung oder Fakturierung gesperrt sind",1]],"","b6cc76b6"],[1,"Welche Aussagen beschreiben die Nutzung von Verkaufsbelegen, wenn physische Materialen an den Kunden versendet werden?",[["Der Vertriebsbereich im Verkaufsbeleg kann bis zur Fakturierung geändert werden.",0],["Verkaufsbelege werden normalerweise in einem Übersichtsbild erfasst.",1],["Der Vertriebsbereich eines Verkaufsbelegs ist im Belegkopf zu finden.",1],["Ein Verkaufsbeleg umfasst in der Regel zwei Ebenen: Kopf und Position.",0]],"","c96043f3"],[1,"Für ein Material gestaltet sich die anfängliche Bestandssituation wie folgt: • Der verfügbare Werksbestand beträgt 100 Stück. Geplante Wareneingänge aus Bestellungen belaufen sich auf 50 bzw. 60 Stück. • Der Bedarf aus vorhandenen Kundenaufträgen beläuft sich auf 100, 40 und 50 Stück • Sie erfassen einen zusätzlichen Kundenauftrag über 10 Stück. Welche Aussagen beschreiben die oben geschilderte Situation korrekt?",[["Nach der Verfügbarkeitsprüfung werden mehr als 10 Stück bestätigt.",0],["Nach der Verfügbarkeitsprüfung werden genau 10 Stück bestätigt.",1],["Abhängig vom Wunschlieferdatum des Kunden führt das System möglicherweise eine Vorwärtsterminierung durch.",1],["Die Verfügbarkeitsprüfung weist Sie darauf hin, dass weniger als 10 Stück bestätigt werden können.",0]],"","0ddd3fba"],[1,"Wenn Sie einen vorhandenen Stammsatz verwenden möchten, z.B. für den Auftraggeber, welche Hilfe steht in SAP S/4HANA für die Suche nach den korrekten Daten zur Verfügung?",[["Setzen Sie den Cursor in das relevante Feld. Drücken Sie dann F4, und das System zeigt die Suchmöglichkeiten an.",1],["Drücken Sie die Funktionstaste F1-Hilfe\", um alle im System angelegten Datensätze anzuzeigen. Doppelklicken Sie dann auf den gewünschten Stammsatz.",0],["In allen Apps steht die Funktion \"Daten auswählen\" zur Verfügung. Nach dem Aufruf dieser Funktion können Sie mithilfe der Auswahlfelder nach den gewünschten Stammdaten suchen.",0],["Klicken Sie rechts neben dem relevanten Feld auf das Lupensymbol. Das System zeigt die zuletzt verwendeten Stammsätze an.",0]],"","3cc3fd87"],[1,"Der Eingang einer Kundenreklamation führt zur Erstellung einer Gutschriftsanforderung. Es wird allerdings entschieden, dass die Reklamation ungerechtfertigt ist. Wie wird das in der Gutschriftsanforderung dokumentiert?",[["Der Preis der Position wird auf null gesetzt.",0],["Es wird ein passender Absagegrund eingegeben.",1],["Die Materialmenge in der Position wird auf null gesetzt.",0],["Die entsprechende Einzelposition wird gelöscht.",0]],"","8206b650"],[1,"Welche Aussagen beschreiben zutreffend die Erstellung von Auslieferungen?",[["Auslieferungen können automatisch erstellt werden, z. B. von einem Hintergrundjob.",1],["Kundenaufträge, die in eine Auslieferung zusammengeführt werden sollen, müssen dasselbe Werk haben.",0],["Sämtliche Positionen eines Kundenauftrags müssen immer in eine einzelne Auslieferung kopiert werden.",0],["Generell ist es möglich, für einen Kundenauftrag mehrere Auslieferungen zu erstellen.",1]],"","158d3e6d"],[1,"Ihr Unternehmen hat eine komplexe Organisationsstruktur, die in SAP S/4HANA abgebildet ist. Welche Bedeutung hat das für die Erstellung der Grunddatensichten für Materialstammsätze?",[["Sie werden für jeden Buchungskreis erstellt.",0],["Sie werden für jedes Werk erstellt.",0],["Sie werden für jede Verkaufsorganisation und jeden Vertriebsweg erstellt.",0],["Sie werden für jeden Mandanten erstellt.",1]],"","e08efd6a"],[1,"Was sind in der Unternehmensstruktur zulässige Zuordnungen?",[["Eine Verkaufsorganisation kann nur einem Vertriebsbereich zugeordnet werden.",0],["Eine Kombination aus Verkaufsorganisation und Vertriebsweg kann mehreren Werken zugeordnet werden.",1],["Eine Verkaufsorganisation kann maximal einem Vertriebsweg zugeordnet werden.",0],["Einem Buchungskreis können mehrere Verkaufsorganisationen zugeordnet werden.",1],["Eine Verkaufsorganisation kann nur einem Buchungskreis zugeordnet werden.",1]],"","f1e8bc7e"],[1,"Wozu können Sie den Belegfluss nutzen?",[["Um den Bearbeitungsstatus von Belegen zu ändern",0],["Um Stammdaten zu pflegen",0],["Um direkt in die Belege zu verzweigen",1],["Um Vorgängerbelege anzuzeigen",1]],"","21a0f230"],[1,"Sie haben einen Kundenauftrag mit drei Positionen erfasst. Welche Auswirkungen hat es, wenn Sie wichtige Daten in einer dieser Auftragspositionen ändern?",[["Bei Änderung des Warenempfängers wird die betreffende Änderung automatisch in den Auftragskopf kopiert.",0],["Werden Preise geändert, berechnet das System den Gesamtpreis des Kundenauftrags neu.",1],["Änderungen der Zahlungsbedingungen führen zu mehreren Fakturabelegen für den Auftrag.",1],["Bei Änderung der Versandstelle bestimmt das System das Auslieferungswerk neu.",0]],"","23be3500"],[1,"Welche Aussage trifft auf den Vertriebsprozess in SAP S/4HANA zu?",[["In der Bestandsführung wird der Bestand bei Erstellung eines Fakturabelegs aktualisiert.",0],["In SAP S/4HANA werden Kundenaufträge in Form von Auslieferungen erfasst.",0],["Für eine Kundenauftragsposition können mehrere Auslieferungen erstellt werden.",1],["Anforderungen aus dem Kundenauftrag werden an SAP Extended Warehouse Management (EWM) übertragen.",0]],"","756058e7"],[1,"Welche Aussagen beschreiben zutreffend die Nutzung wichtiger Vorlaufzeiten und Datumsangaben bei der Versandterminierung?",[["Die Versandterminierung kann zu einem anderen Ergebnis führen, wenn Sie das Auslieferungswerk in der Kundenauftragsposition manuell mit einem anderen Werk überschreiben.",1],["Die Transportdispositionsvorlaufzeit gibt die Zeit an, die für den Transport der Waren zum Standort des Kunden benötigt wird.",0],["Das System nutzt die Richtzeit zur Rückwärtsterminierung vom Ladedatum, um das Materialbereitstellungsdatum zu ermitteln.",1],["Das Transportdispositionsdatum gibt das Datum an, an dem die Waren das Auslieferungswerk verlassen müssen.",0]],"","d24a6859"],[1,"Ihre Firma hat zwei Verkaufsorganisationen: V100 und V200. Beide Verkaufsorganisationen möchten an denselben Kunden verkaufen. Allerdings hat sich Verkaufsorganisation V200 mit dem Kunden auf andere Incoterms und Zahlungsbedingungen geeinigt als Verkaufsorganisation V100. Wie kann SAP S/4HANA Sales diese Anforderung unterstützen?",[["Durch Festlegung unterschiedlicher Zahlungsbedingungen für unterschiedliche Vertriebsbereiche im Kundenstamm",1],["Durch Festlegung unterschiedlicher Incoterms für unterschiedliche Auslieferungswerke",0],["Durch Festlegung unterschiedlicher Incoterms für unterschiedliche Vertriebsbereiche im Kundenstamm",1],["Durch Festlegung unterschiedlicher Incoterms für unterschiedliche Buchungskreise im Kundenstamm",0]],"","74433b01"],[1,"Nachdem Sie einen Fakturabeleg angelegt haben, stellen Sie fest, dass das System die falschen Zahlungsbedingungen ermittelt hat. Wie lassen sich die Zahlungsbedingungen korrigieren?",[["Sie können im Kundenstamm korrigiert werden, wodurch der Fakturabeleg automatisch aktualisiert wird.",0],["Sie können im Zuge des Zahlungslaufs in der Finanzbuchhaltung korrigiert werden.",0],["Sie können im Fakturabeleg korrigiert werden, selbst wenn bereits die Übermittlung an die Buchhaltung erfolgt ist.",0],["Sie können im Kundenauftrag korrigiert werden, aber erst nachdem der Fakturabeleg storniert wurde.",1]],"","d6032fb7"],[1,"Welche Aussage beschreibt zutreffend die Nutzung von Vertriebsbereichen in Verkaufsbelegen?",[["Jede Position in einem Kundenauftrag kann einem anderen Vertriebsbereich zugeordnet werden.",0],["Beim Anlegen eines Kundenauftrags muss der Vertriebsbereich im Einstiegsbild erfasst werden.",0],["Jeder Verkaufsbeleg wird genau einem Vertriebsbereich zugeordnet, aber diese Zuordnung kann nachträglich geändert werden.",0],["Jeder Verkaufsbeleg wird genau einem Vertriebsbereich zugeordnet, und diese Zuordnung kann nicht geändert werden.",1]],"","0910fcf2"],[1,"Welche der folgenden Aussagen beschreiben zutreffend die Nutzung von Fakturabelegen?",[["Ein Fakturabeleg dient als Datenquelle für die Finanzbuchhaltung (FI), damit z.B. Zahlungen bearbeitet werden können.",1],["Ein Fakturabeleg hat drei Ebenen: Kopf, Position und Einteilung.",0],["Ein Fakturabeleg ist eine Verkaufsbelegart.",0],["Mehrere Auslieferungen können in einem Fakturabeleg zusammengefasst werden, wenn sie in den Fakturasplitkriterien übereinstimmen.",1]],"","0a0ac37f"],[1,"Welche Aussage zu Versandterminierung und Verfügbarkeitsprüfung ist richtig?",[["Die Auslieferung muss immer am Materialbereitstellungsdatum erstellt werden.",0],["Anhand der Transitzeit berechnet das System das Ladedatum aus dem Wunschlieferdatum des Kunden.",0],["Das entscheidende Datum für die Verfügbarkeitsprüfung ist das Materialbereitstellungsdatum.",1],["Die Verfügbarkeitsprüfung wird vor der Versandterminierung durchgeführt.",0]],"","ec2d0954"],[1,"Welche der folgenden Aussagen beschreibt zutreffend die Bearbeitung eines Kundenauftrags?",[["In einem Kundenauftrag sind alle Einzelheiten zu den vom Kunden bestellten Materialien oder Dienstleistungen erfasst.",1],["Ein Kundenauftrag enthält bestätigte Liefermengen und bestätigte Liefertermine auf Positionsebene.",0],["Ein Kundenauftrag enthält Informationen, die zur Durchführung des gesamten Vertriebsprozesses nötig sind.",1],["Ein Kundenauftrag muss immer auf der Grundlage auftragsbezogener Fakturierung in Rechnung gestellt werden.",0]],"","af03504d"],[1,"Welche der folgenden Aussagen beschreiben die Auswirkungen des Wunschlieferdatums in einem Verkaufsbeleg?",[["Eine Änderung am Wunschlieferdatum kann das Ergebnis der Verfügbarkeitsprüfung beeinflussen.",1],["Bei der Terminierung eines Kundenauftrags beginnt das System mit dem Wunschlieferdatum und führt eine Vorwärtsterminierung durch.",0],["Eine Änderung des Wunschlieferdatum im Auftragskopf wird automatisch auf die Positionen übernommen, die bereits eingegeben wurden.",0],["Mehrere Auftragspositionen mit verschiedenen Wunschlieferdaten können zu einem Liefersplit führen.",1]],"","73ad3676"],[1,"Welche Aussagen beschreiben zutreffend die Nutzung der Auslieferung?",[["Beim Anlegen einer Auslieferung werden wichtige Informationen aus dem Kundenauftrag in die Auslieferung kopiert.",1],["Die Auslieferung dient als wichtiger Beleg für die Planung, Bearbeitung und Überwachung von Versandaktivitäten.",1],["Für Bearbeitung und Pflege von Auslieferungen ist eine Verkaufsorganisation zuständig.",0],["Im Gegensatz zum Verkaufsbeleg enthält die Auslieferung Einteilungen.",0]],"","c078f2b3"],[1,"Welche Aussagen beschreiben zutreffend die Nachrichtenverarbeitung?",[["Nachrichten müssen immer manuell verarbeitet werden.",0],["Für Nachrichten können verschiedene Ausgabekanäle werden, z. B. Druck oder E-Mail.",1],["Nachrichten müssen immer sofort verarbeitet werden.",0],["Es ist möglich, eine Vorschau der Nachricht anzuzeigen.",1]],"","f284728d"],[1,"Was ist in SAP S/4HANA Sales der Beginn für die Lieferabwicklung?",[["Anlegen des Kundenauftrags",0],["Kommissionierung",0],["Anlegen der Auslieferung",1],["Buchen des Warenausgangs",0]],"","f468a176"],[1,"Welche Art von Daten stellt SAP HANA Core Data Services (CDS) für in SAP S/4HANA integrierte Analysefunktionen bereit?",[["Live-Bewegungsdaten",1],["Aggregierte Daten",0],["Replizierte Bewegungsdaten",0],["Zusammengefasste Daten",0]],"","45109301"],[1,"Ein Kunde hat Waren zurückgeschickt, weil sie beschädigt sind. Sie haben die Rücksendung mithilfe eines Retourenauftrags und einer Retourenanlieferung bearbeitet. Welche Folgeaktionen stehen je nach Präferenz des Kunden zur Verfügung?",[["Sie können dem Kunden den Kaufpreis erstatten, indem Sie eine Gutschrift mit Bezug auf den Retourenauftrag erstellen.",1],["Sie können dem Kunden eine kostenlose Ersatzlieferung zukommen lassen, indem Sie eine kostenlose Nachlieferung mit Bezug auf den Retourenauftrag erstellen.",1],["Sie können dem Kunden den Kaufpreis erstatten, indem Sie eine Gutschriftsanforderung mit Bezug auf den Retourenauftrag erstellen.",0],["Sie müssen dem Kunden eine kostenlose Ersatzlieferung zukommen lassen, indem Sie eine kostenlose Nachlieferung mit Bezug auf den ursprünglichen Kundenauftrag erstellen.",0]],"","717399f2"],[1,"Welcher der folgenden Prozessabläufe beschreibt einen Standardprozess in SAP S/4HANA Sales?",[["Presales-Aktivitäten ? Auftragsbearbeitung ? Versand ? Fakturierung ? Kundenzahlung",1],["Bestandsführung ? Lieferung ? Verkaufsbearbeitung ? Fakturierung ? Auftragsbearbeitung",0],["Presales-Aktivitäten ? Auftragsbearbeitung ? Kundenzahlung ? Lieferung ? Bestandsführung",0],["Bestandsführung ? Presales-Aktivitäten ? Auftragsbearbeitung ? Fakturierung ? Versand",0]],"","0d5881a2"],[1,"Ihre Firma hat vier Vertriebsbereiche (Kombinationen aus Verkaufsorganisation, Vertriebsweg und Sparte). Und zwar 1000/10/00, 1000/12/00, 2000/10/00 und 2000/12/00. Kunde 200901 erteilt Aufträge in allen diesen Vertriebsbereichen. Wie oft müssen die allgemeinen Daten für diesen Kunden erstellt werden?",[["Einmal",1],["Mindestens zweimal",0],["Viermal",0],["Dreimal",0]],"","bdd1c637"],[1,"Welche Aussagen beschreiben zutreffend die Nutzung von Auslieferungen?",[["Sie können mehrere Kundenaufträge in einer Auslieferung zusammenfassen unter der Voraussetzung, dass die Warenempfänger für die Aufträge unterschiedlich sind.",0],["Die Versandstelle einer Auslieferung kann jederzeit geändert werden.",0],["Jede Auslieferung in SAP S/4HANA ist eindeutig einer Versandstelle zugeordnet.",1],["Wenn Sie eine Auslieferung mit Bezug auf einen Kundenauftrag anlegen, können relevante Daten aus dem Kundenauftrag kopiert werden.",1]],"","1d111f19"],[1,"Welchem Zweck dient der Belegfluss?",[["Damit kann jeder Beleg per Doppelklick angezeigt werden.",0],["Damit wird die Historie der Folgebelege angezeigt.",1],["Damit lässt sich der Vertriebsprozess überwachen.",1],["Damit lassen sich Folgebelege direkt erstellen.",0]],"","a8ccfb32"],[1,"Welchen der folgenden Elemente können in der Unternehmensstruktur Versandstellen zugeordnet werden?",[["Mehreren Vertriebswegen",0],["Einer Kombination aus Werk und Lagerort",0],["Mehreren Werken",1],["Genau einem Buchungskreis",0]],"","3bd968bd"],[1,"Welche der folgenden Aussagen trifft auf die Kommissionierung in einem mit SAP Extended Warehouse Management (EWM) verwalteten Lager zu?",[["Wenn eine Auslieferung für die Kommissionierung relevant ist, werden die dazugehörigen Einzelheiten an SAP EWM übermittelt, wo ein Auslieferungsauftrag erstellt wird.",1],["SAP-EWM-Auslieferungsaufträge werden in Lageraufträgen gebündelt, auf deren Grundlage die Arbeitslast der Lagerressourcen gesteuert wird.",0],["Die mit SAP EWM zu kommissionierende Menge wird dem Kundenauftrag entnommen.",0],["Bei der Warenausgangsbuchung in SAP EWM werden die dazugehörigen Lageraufgaben automatisch bestätigt.",0]],"","ad4701f0"],[1,"Welche der folgenden Werte in einem Kundenauftrag werden anhand von Konditionssätzen bestimmt?",[["Versandbedingungen",0],["Preis",1],["Fracht",1],["Rabatt",1],["Volumen",0]],"","ae0d0d7e"],[1,"Welche Aussagen treffen auf die Retouren- und Gutschriftbearbeitung zu?",[["Gutschriftsanforderungen können mit Bezug auf Fakturabelege und Aufträge angelegt.",1],["Beim Wareneingang für eine Retourenanlieferung wird Bestand in den frei verwendbaren Bestand gebucht.",0],["Eine Retourengutschrift wird mit Bezug auf eine Retourenanlieferung angelegt.",0],["Retouren können mit Bezug auf Aufträge angelegt werden.",1],["Retouren und Gutschriftsanforderungen sind Beispiele für Verkaufsbelegarten.",1]],"","a8d50ff2"]];

function help(){
  app.innerHTML='<div class="crow" style="align-items:center;margin-top:28px"><h1 style="margin:0">Hilfe</h1><button class="ghost" id="back">Zurück</button></div><div class="help">'+
  '<h3>So läuft eine Runde</h3><p>Du bekommst eine Frage mit mehreren Antworten. Oben steht, wie viele davon richtig sind. Tippe alle Antworten an, die du für richtig hältst, und dann auf „Antwort prüfen“. Grün markiert richtig gewählte Antworten, rot falsch gewählte. Gestrichelt grün sind richtige Antworten, die du nicht gewählt hast. Mit „Weiter“ kommt die nächste Frage. Mit „Zum Wiederholen markieren“ merkst du eine Frage vor, zum Beispiel wenn du nur geraten hast: Sie kommt in die Fehlerliste und zählt im Wissensstand als nicht gewusst, bis du sie später richtig beantwortest.</p>'+
  '<h3>Punkte</h3><p>Einen Punkt gibt es nur, wenn genau die richtigen Antworten gewählt sind: alle richtigen und keine falsche. Das ist bewusst streng, damit du den Stoff wirklich sicher kannst.</p>'+
  '<h3>Beenden</h3><p>Mit „Beenden“ oben rechts oder „Jetzt beenden“ nach dem Prüfen kannst du jederzeit aufhören. Das Ergebnis zählt nur die Fragen, die du beantwortet hast. Eine gerade offene Frage zählt nicht mit.</p>'+
  '<h3>Startseite</h3><ul>'+
  '<li><strong>Wissensstand:</strong> Er zeigt in Prozent, wie viele Fragen du zuletzt richtig beantwortet hast. Fragen, die du noch nie beantwortet hast, zählen als nicht gewusst. Eine falsche Frage zählt wieder, sobald du sie richtig beantwortest.</li>'+
  '<li><strong>Alle Fragen mischen:</strong> Alle Fragen in zufälliger Reihenfolge.</li>'+
  '<li><strong>Prüfung:</strong> 20 zufällige Fragen. Dein Bestwert wird bei Runden mit mindestens 20 beantworteten Fragen aktualisiert.</li>'+
  '<li><strong>Fehlerliste:</strong> Fragen, die du zuletzt falsch hattest oder zum Wiederholen markiert hast. Nach dem Ergebnis kannst du die falschen Fragen auch direkt wiederholen.</li></ul>'+
  '<h3>Dein Stand</h3><p>Wissensstand, Fehlerliste und Bestwert werden nur auf deinem Gerät im Browser gespeichert. Niemand sonst sieht sie. Nutze immer denselben Weg, also entweder das App-Symbol oder den Browser. Ganz unten auf der Startseite kannst du ihn mit „Lernstand zurücksetzen“ selbst löschen. Wenn du die Website-Daten im Browser löschst, ist er ebenfalls weg.</p>'+
  '<h3>Als App aufs Handy legen</h3><ul>'+
  '<li><strong>Android (Chrome):</strong> Menü oben rechts (drei Punkte), dann „Zum Startbildschirm hinzufügen“.</li>'+
  '<li><strong>iPhone (Safari):</strong> Teilen-Symbol, dann „Zum Home-Bildschirm“.</li>'+
  '<li><strong>iPhone (Chrome):</strong> Teilen-Symbol neben der Adresszeile, dann „Zum Home-Bildschirm“.</li></ul>'+
  '<h3>Fehler gefunden?</h3><p>Wenn eine Frage falsch oder unklar wirkt oder du Fragen zum Quiz hast, schreib mir per WhatsApp.</p><p><a class="ghost" style="display:inline-block;text-decoration:none;color:inherit" href="https://wa.me/491726202875?text=Hallo%20Stefan%2C%20zu%20den%20Extra%20Fragen%3A%20" target="_blank" rel="noopener">Per WhatsApp schreiben</a></p><h3>Datenschutz</h3><p>Dein Lernstand bleibt auf deinem Gerät. Eine Statistik mit Google Analytics läuft nur mit deiner Zustimmung. <a href="index.html#datenschutz" style="color:inherit">Details und Widerruf</a></p></div>'+
  '<button class="primary" id="back2">Zur Startseite</button><p class="hint" style="text-align:center;margin-top:24px">Copyright © 2026 by Stefan Steinweg</p>';

function stats(){
  var n=Q.length,ok=0,bad=0;
  Q.forEach(function(q){if(know[q[4]]===1)ok++;else if(know[q[4]]===0)bad++});
  var pct=Math.round(ok/n*100);
  var h='<div class="stat"><div class="big">'+pct+' %</div><p class="sub" style="margin:0 0 10px">Wissensstand: '+ok+' von '+n+' Fragen zuletzt richtig</p><div class="bar" style="margin-bottom:14px"><span style="width:'+pct+'%"></span></div>';
  (CATS().length>1?CATS():[]).forEach(function(c){var t=0,g=0;Q.forEach(function(q){if(q[0]===c){t++;if(know[q[4]]===1)g++}});var p=Math.round(g/t*100);h+='<div class="crow"><span>'+LB(c)+'</span><span>'+p+' %</span></div><div class="bar" style="height:4px;margin-bottom:10px"><span style="width:'+p+'%"></span></div>'});
  h+='<p class="hint" style="margin:4px 0 0">'+bad+' zuletzt falsch, '+(n-ok-bad)+' noch nicht beantwortet.</p></div>';
  return h}
function home(){
  var cats=CATS(),h='<div class="crow" style="align-items:center;margin-top:28px"><h1 style="margin:0">Extra Fragen</h1><button class="ghost" id="help">Hilfe</button></div><p class="sub" style="margin-top:6px">'+Q.length+' Fragen, Mehrfachauswahl'+(best!==null?' – Bestwert '+best+' %':'')+'</p>'+
  stats()+'<button class="primary" id="all" style="margin-top:6px">Alle Fragen mischen</button>'+
  '<button class="primary" id="exam" style="background:var(--acs);color:var(--ink)">Prüfung: 20 Zufallsfragen</button>'+
  (CATS().length>1?'<p class="sub" style="margin:26px 0 10px">Nach Kategorie</p>':'');
  (cats.length>1?cats:[]).forEach(function(c){var n=Q.filter(function(q){return q[0]===c}).length;h+='<button class="menu" data-c="'+c+'"><span>'+LB(c)+'</span><small>'+n+' Fragen</small></button>'});
  h+='<button class="menu" id="mis"'+(missed.length?'':' disabled style="opacity:.5"')+'><span>Fehlerliste üben</span><small>'+missed.length+' Fragen</small></button>';
  h+='<button class="ghost" id="rs" style="width:100%;margin-top:18px">Lernstand zurücksetzen</button>';
  h+='<p class="hint" style="text-align:center;margin-top:24px">Copyright © 2026 by Stefan Steinweg (mit Hilfe von KI erstellt) </p>';
  app.innerHTML=h;

  };
  document.getElementById("help").onclick=help;
  document.getElementById("all").onclick=function(){start(Q)};

  app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){start(Q.filter(function(q){return q[0]===+b.dataset.c}))}});
}
function start(list){deck=shuffle(list);i=0;score=0;wrong=[];show()}
function show(){
  var q=deck[i],opts=shuffle(q[2]),nr=opts.filter(function(o){return o[1]}).length,sel={},done=false;
  app.innerHTML='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+deck.length+'" aria-valuenow="'+i+'"><span style="width:'+(i/deck.length*100)+'%"></span></div>'+
  '<div class="crow" style="align-items:center;margin-bottom:18px"><span class="sub" style="margin:0">Frage '+(i+1)+' von '+deck.length+(CATS().length>1?' – '+LB(q[0]):'')+'</span><button class="ghost" id="end" style="padding:8px 14px">Beenden</button></div><h2>'+esc(q[1])+'</h2>'+(q[3]?'<img class="qimg" src="'+q[3]+'" alt="Abbildung zur Frage" loading="lazy">':'')+
  '<p class="sub" style="margin-top:-12px">Wähle '+nr+' richtige Antwort'+(nr>1?'en':'')+'.</p>'+
  '<div>'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'" aria-pressed="false"><span class="box"></span><span class="tx">'+esc(o[0])+'</span></button>'}).join("")+'</div><div id="fb" aria-live="polite"><button class="primary" id="chk" disabled style="opacity:.5">Antwort prüfen</button></div>';
  var btns=app.querySelectorAll(".opt"),chk=document.getElementById("chk");document.getElementById("end").onclick=function(){var a=done?i+1:i;a>0?result(a):home()};
  btns.forEach(function(b){b.onclick=function(){if(done)return;var k=b.dataset.k;sel[k]=!sel[k];b.classList.toggle("sel",sel[k]);b.setAttribute("aria-pressed",sel[k]);b.firstChild.textContent=sel[k]?"\u2713":"";var any=Object.keys(sel).some(function(x){return sel[x]});chk.disabled=!any;chk.style.opacity=any?1:.5}});
  chk.onclick=function(){
    done=true;var good=true;
    btns.forEach(function(b,k){var s=!!sel[k],r=!!opts[k][1];b.disabled=true;b.classList.remove("sel");
      if(s&&r){b.classList.add("ok");b.firstChild.textContent="\u2713"}
      else if(s&&!r){b.classList.add("no");b.firstChild.textContent="\u2715";good=false}
      else if(!s&&r){b.classList.add("miss");b.insertAdjacentHTML("beforeend","");b.querySelector(".tx").insertAdjacentHTML("beforeend",'<span class="tag">Richtig, aber nicht gewählt</span>');good=false}});
    var id=idx(q);
    if(good){score++;missed=missed.filter(function(x){return x!==id})}else{wrong.push(q);if(missed.indexOf(id)<0)missed.push(id)}
    save("ex-missed",missed);know[id]=good?1:0;save("ex-know",know);
    document.getElementById("fb").innerHTML='<p class="exp"><strong>'+(good?"Richtig.":"Nicht ganz.")+'</strong> '+(good?"Alle richtigen Antworten gewählt, keine falsche.":"Für einen Punkt müssen genau die richtigen Antworten gewählt sein.")+'</p><button class="ghost" id="mk" style="width:100%;margin-top:6px" aria-pressed="false">Zum Wiederholen markieren</button><button class="primary" id="nx">'+(i+1<deck.length?"Weiter":"Ergebnis anzeigen")+'</button>'+(i+1<deck.length?'<button class="ghost" id="stop" style="width:100%;margin-top:10px">Jetzt beenden ('+(i+1)+' beantwortet)</button>':'');
    var nx=document.getElementById("nx");nx.onclick=function(){i++;i<deck.length?show():result()};nx.focus();var sp=document.getElementById("stop");if(sp)sp.onclick=function(){result(i+1)};
    var mk=document.getElementById("mk");mk.onclick=function(){
      var on=mk.getAttribute("aria-pressed")!=="true";mk.setAttribute("aria-pressed",on?"true":"false");mk.textContent=on?"Markiert – antippen zum Aufheben":"Zum Wiederholen markieren";
      if(on){know[id]=0;if(missed.indexOf(id)<0)missed.push(id);if(wrong.indexOf(q)<0)wrong.push(q)}
      else if(good){know[id]=1;missed=missed.filter(function(x){return x!==id});wrong=wrong.filter(function(x){return x!==q})}
      save("ex-missed",missed);save("ex-know",know)};
  };
}
function result(n){n=n||deck.length;
  var pct=Math.round(score/n*100);
  if(n>=20&&(best===null||pct>best)){best=pct;save("ex-best",pct)}
  var msg=pct>=70?"Bestanden-Niveau erreicht.":pct>=50?"Auf dem Weg – wiederhole die Fehler.":"Noch viel Luft nach oben. Übe die Fehlerliste.";
  app.innerHTML='<h1>Ergebnis</h1><div class="score">'+score+' / '+n+'</div><p class="sub">'+pct+' % richtig – '+msg+'</p>'+
  (wrong.length?'<button class="primary" id="rep">Falsche und markierte Fragen wiederholen ('+wrong.length+')</button>':'')+
  '<button class="primary" id="again" style="background:var(--acs);color:var(--ink)">Neue Runde</button><button class="ghost" id="hm" style="width:100%;margin-top:12px">Zum Start</button>';
  if(wrong.length)document.getElementById("rep").onclick=function(){start(wrong)};
  document.getElementById("again").onclick=function(){start(deck)};
  document.getElementById("hm").onclick=home;
}
home();
</script>
