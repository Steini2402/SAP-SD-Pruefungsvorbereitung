<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Extra Questions">
<meta name="author" content="Stefan Steinweg">
<meta name="theme-color" content="#3B4BFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest-en.webmanifest">
<title>Extra Questions</title>
<style>
:root{--bg:#EEF1F8;--sf:#fff;--ink:#14182B;--mute:#5B6280;--ac:#3B4BFF;--acs:#E3E6FF;--ok:#12A150;--oks:#D9F5E5;--no:#E5484D;--nos:#FDE3E4;--ln:#D6DAEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1020;--sf:#1A1D33;--ink:#ECEEFA;--mute:#9AA1C4;--ac:#8793FF;--acs:#2A2F5C;--ok:#3DD68C;--oks:#12382A;--no:#FF6B70;--nos:#411B1F;--ln:#2B3050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:28px 0 6px}
h2{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 22px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.primary{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:18px;margin-top:18px}
:root[data-theme="dark"] .primary{color:#0E1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0E1020}}
.ghost{padding:12px 16px;border-radius:12px;background:var(--acs);font-weight:600;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start}.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ln);margin-top:1px;display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .box{background:var(--ac);border-color:var(--ac);color:#fff}.opt.ok .box{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no .box{background:var(--no);border-color:var(--no);color:#fff}.opt.miss{border-color:var(--ok);border-style:dashed}.tag{display:block;font-size:13px;color:var(--mute);margin-top:4px}.menu{display:flex;justify-content:space-between;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);font-weight:600}.menu small{color:var(--mute);font-weight:400}.help h3{font-size:18px;margin:24px 0 6px}.help p,.help li{margin:0 0 8px;font-size:16px}.help ul{padding-left:20px;margin:0 0 8px}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:18px}.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:4px}.crow{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-bottom:14px}
.bar span{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;background:var(--sf);border:2px solid var(--ln);font-size:17px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--no);background:var(--nos)}
.opt:disabled{cursor:default}
.exp{margin:14px 2px 0;color:var(--mute);font-size:15px}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;margin:30px 0 4px;line-height:1}
.row{display:flex;gap:10px;margin-top:12px}
details{margin-top:28px;background:var(--sf);border-radius:16px;padding:14px 16px;border:1px solid var(--ln)}
summary{font-weight:600;cursor:pointer}
textarea{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:15px/1.4 inherit;resize:vertical}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
#msg{font-size:14px;margin:10px 0 0;min-height:1em}
.qimg{display:block;width:100%;height:auto;border:1px solid var(--ln);border-radius:14px;margin:14px 0 18px;background:var(--sf)}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[[1,"You are creating a sales order for customer 200901 and 50 pieces of material MAT-4711. The availability check shows that the delivery cannot be confirmed for the requested delivery date. Which factors could have been taken into account in the scope of check when determining this result?",[["Reservations from Materials Management",1],["Material stocks in alternative delivering plants",0],["Future goods receipts from purchase orders",1],["The customer's delivery priority",0]],"","2fb0559d"],[1,"Which statements correctly describe the relationship between header data and item data in a sales order?",[["Information stored in the document header has no effect on the document items.",0],["If information is changed in an order item, this has no effect on the information stored in the order header.",1],["Information in the document header always overrides data stored at item level.",0],["Some information in the document header, such as the payment terms, is valid for the entire order but can be changed at item level.",1]],"","53a77efa"],[1,"For business partner maintenance, the customer master is divided into general data, sales area data and company code data. Within these areas, the data is grouped on different tabs. Which of the following tabs are part of the sales area data of the customer master?",[["Unloading points",0],["Billing",1],["Partner functions",1],["Export data",0],["Shipping",1]],"","d7fe19c0"],[1,"What functions does the BOP segment have in backorder processing in SAP S/4HANA?",[["It defines selection criteria for determining requirements that must be handled in the same way during a BOP run, for example material or customer.",1],["It applies a prioritizer that puts the requirements into a specific sequence, for example delivery priority or customer group.",1],["It performs a mass availability check for requirements (for example sales order items), which is run online or scheduled as a background job.",0],["It controls which confirmation strategy is to be applied in a backorder processing run, for example win, lose or redistribute.",0]],"","7fb5e3f5"],[1,"Customizing for sales document types includes parameters that let you choose between division-specific and cross-division sales processing. What is possible with these parameters?",[["You can specify that the division in the order item is copied from the customer-material info record.",0],["You can prevent materials with a division that differs from the division in the order header from being included in the sales order.",1],["You can ensure that the division from the document header is always copied to all items of the sales order.",1],["You can reject a difference between the divisions in the order header and in the item with an error message that users can override if necessary.",0]],"","68c95cdf"],[1,"Which of the following are characteristics of the SAP Fiori launchpad?",[["Each business application is represented by a tile. Users can group, rearrange and remove tiles.",1],["It is not possible to change the names of existing tile groups.",0],["You can enter default values for important fields in apps, for example sales organization, distribution channel and division.",1],["You must use a transactional app to monitor and analyze complex topics.",0],["The SAP Fiori launchpad provides the tile catalogs that contain all tiles available to the user.",1]],"","e77f7a34"],[1,"You have created a sales order with three items. You now want to view the detailed pricing for the first of these items. How do you proceed?",[["Switch to the SAP Fiori app Cost Analysis Sheet.",0],["Go to the first item and choose the “Billing Document” tab.",0],["Go to the order header, choose the “Conditions” tab and drill down to the first item.",0],["Go to the first item and choose the “Conditions” tab.",1]],"","4d0d54fa"],[1,"When creating a material master, you must select the views you want to create. Which statements apply to the creation and maintenance of these views?",[["The basic data views contain information about the material that is valid for the entire client.",1],["There is no connection between the material type and the views that can be selected.",0],["All relevant views must be selected during creation, because additional views cannot be added later.",0],["The material master views that contain sales-relevant information depend on the sales organization and the distribution channel.",1]],"","4f96fc27"],[1,"How does the system react if you create an order but specify NO sales area on the initial screen?",[["The system issues an error message because the sales area is mandatory.",0],["The system creates the order without organizational data.",0],["The sales area is determined automatically from the sold-to party.",1],["The system uses the sales area of the most recently created order.",0]],"","883d6771"],[1,"Which statements apply to the customer master record?",[["In Customizing you can change the settings so that certain fields in the customer master are not displayed.",1],["If a customer places orders across several sales areas, the sales area data for this customer must be identical in all sales areas.",0],["Several ship-to parties can be stored in a customer's sales area data.",1],["Once a customer master record has been created, it is no longer possible to add further partner functions to this record.",0],["The sales area data is based on a combination of sales organization, distribution channel and division.",1]],"","097744e0"],[1,"What effects does it have when the goods issue is posted for a delivery?",[["The goods issue posting updates the delivery quantity with the picked quantity.",0],["The goods issue posting for a delivery has no effect on Financial Accounting.",0],["After the goods issue posting, the delivery can serve as the basis for billing.",1],["The goods issue posting updates the stock in inventory management.",1]],"","8c46aa91"],[1,"The initial stock for the material is 100 pieces. There are two purchase orders for 50 and 60 pieces respectively. There are also sales orders for 100, 40 and 50 pieces. You enter another sales order for 20 pieces, for which the customer wants delivery as soon as possible and, if necessary, accepts partial deliveries. Which statement is correct given the described stock situation (see chart)?",[["A single delivery of 20 pieces is confirmed for a date that is after the requested delivery date.",0],["20 pieces can be delivered on the customer's requested delivery date.",0],["Two partial deliveries of 10 pieces each are confirmed, but neither can be delivered on the customer's requested delivery date.",1],["Two partial deliveries of 10 pieces each are confirmed, the first of which can be delivered on the customer's requested delivery date.",0]],"../bild3.jpg","090a2a67"],[1,"In SAP S/4HANA there is an inquiry. According to the document flow, it has the processing status “Completed”. Which of the following actions set this status?",[["Creation of a quotation with reference to the inquiry",1],["Creation of a separate quotation for the same customer",0],["Creation of the inquiry",0],["The inquiry remains unreferenced until after its “Valid to” date.",0]],"","aad49c7b"],[1,"What is a characteristic of the sales process in SAP S/4HANA?",[["The sales process comprises the areas of sales, shipping and invoice verification.",0],["The sales process usually ends with the creation of a delivery.",0],["Individual business transactions in SAP S/4HANA Sales are recorded in a sequence of linked documents.",1],["The sales process always begins with the entry of a sales order.",0]],"","30b5f9b8"],[1,"Which of these business transactions and functions can be triggered directly from the sales order?",[["Transfer of requirements to planning",1],["Creating an outbound delivery order in SAP EWM",0],["Creating a production order for assembly processing",1],["Availability check for the ordered materials",1],["Processing and monitoring of the entire external procurement process",0]],"","63bf15ec"],[1,"In the SAP Fiori app Display Material you can select the view “Sales: Sales Org. Data 2”. What data is displayed in this view?",[["The fields: Division and base unit of measure",0],["The fields: Material pricing group and item category group",1],["The fields: Delivering plant and tax classification",0],["The fields: Availability check and loading group",0]],"","64bce6c5"],[1,"What purpose does an item proposal serve?",[["You want to recommend a specific selection of materials to a customer for their first order.",1],["You want to enter different materials with the customer's material number into a sales order.",0],["A customer frequently orders the same combination of materials, and you want this customer's orders to be entered faster.",1],["You want to apply a set of customer-specific prices for the materials ordered by this customer.",0]],"","e249b188"],[1,"Which statement correctly describes delivery processing?",[["Order items with different incoterms can be combined into a single delivery.",0],["Each delivery is assigned to exactly one route.",1],["Each item of a delivery can be processed by a different shipping point.",0],["The shipping point in a delivery is determined using shipping point determination.",0]],"","711ec380"],[1,"Which statements correctly describe the use of the shipping point?",[["A shipping point can be assigned to several plants.",1],["The shipping point is assigned to a combination of plant and storage location.",0],["Each delivery is processed by exactly one shipping point.",1],["At least one shipping point must exist so that deliveries can be created.",1],["The shipping point can be found in a sales order at header level.",0]],"","0d12a519"],[1,"How do delivery and transportation scheduling work in a sales order?",[["The aim of delivery and transportation scheduling is to keep transportation costs as low as possible.",0],["The starting point for forward scheduling is the material availability date.",1],["As a rule, the system first performs forward scheduling. If that is not successful, backward scheduling is performed.",0],["The starting point for backward scheduling is the customer's requested delivery date.",1]],"","d8ae6d59"],[1,"Which fields are maintained in the view “Sales: General/Plant” of a material?",[["Transportation group",1],["Item category group",0],["Availability check",1],["Tax classification",0]],"","9001a7c9"],[1,"What happens if you specify NO ship-to party when creating an order?",[["The ship-to party is determined from the master record of the sold-to party.",1],["The ship-to party must be entered when the delivery is created.",0],["The order cannot be saved.",0],["The ship-to party and the sold-to party are assumed to be identical.",0]],"","654d22a3"],[1,"A customer-material info record is created for customer 200901 and material MAT-4711. The customer's material number is entered along with other information. How does this newly created master record affect the entry of sales orders?",[["The core data of material MAT-4711 is stored in the material master. A separate set of material data for this material is stored in the customer-material info record. Both data records are retrieved during order entry.",0],["The core data of customer 200901 is stored in the customer master. A separate set of customer data for this customer is stored in the customer-material info record. Both data records are retrieved during order entry.",0],["The customer-material info record contains a variety of data that applies specifically to this combination of customer and material. During order entry, this data overrides the corresponding information from the customer master and/or the material master.",1],["When an order is entered for sold-to party 200901, material MAT-4711 can be found by means of the customer's material number when entering the sales order item.",1]],"","e4568d73"],[1,"The stock quantity is displayed in the stock overview. At which level of the enterprise structure does SAP Inventory Management (IM) display stock quantities?",[["Storage location level",1],["Warehouse level",0],["Storage type level",0],["Storage bin level",0]],"","4da12196"],[1,"The content of which of the following fields must be identical so that sales orders can be combined into the same delivery?",[["Shipping point",1],["Ship-to party",1],["Plant",0],["Route",1],["Payment terms",0]],"","149ecc45"],[1,"Which statements correctly describe the use of the partner function “ship-to party”?",[["It is not possible to create a delivery-relevant order without a ship-to party.",1],["Several ship-to parties can be stored in a customer master record.",1],["For orders that contain only the sale of services, no ship-to party is necessary because no delivery is created.",0],["Up to four ship-to parties can be stored in the sales order header.",0]],"","c3f3e1f2"],[1,"A sales order is entered for a material that is available in sufficient quantity. However, the requested delivery date is too early, so it cannot be confirmed. How would the user be made aware of this?",[["The system displays the “Availability control” screen to draw attention to the problem.",0],["An incompletion log is created.",0],["Several schedule lines are defined for the order item.",1]],"","13d3539d"],[1,"Which statements correctly describe the role of the storage location?",[["The storage location is used for quantity-based inventory management (IM).",1],["At least one storage location must be assigned to each plant.",1],["The storage location is part of the structure of SAP Extended Warehouse Management (EWM).",0],["Each storage location is uniquely assigned to a company code.",0]],"","083a4396"],[1,"For which tasks is the SAP app “Sales Order Fulfillment” suitable?",[["To monitor billing documents",0],["To assign a sales order to a different sales area",0],["To edit the payment terms in a sales order",1],["To monitor sales orders in critical phases",1],["To resolve errors in sales orders that are blocked for delivery or billing",1]],"","b6cc76b6"],[1,"Which statements describe the use of sales documents when physical materials are shipped to the customer?",[["The sales area in the sales document can be changed until billing.",0],["Sales documents are normally entered on an overview screen.",1],["The sales area of a sales document can be found in the document header.",1],["A sales document usually comprises two levels: header and item.",0]],"","c96043f3"],[1,"Für ein Material gestaltet sich die anfängliche Bestandssituation wie folgt: • Der verfügbare Werksbestand beträgt 100 Stück. Geplante Wareneingänge aus Bestellungen belaufen sich auf 50 bzw. 60 Stück. • Der Bedarf aus vorhandenen Kundenaufträgen beläuft sich auf 100, 40 und 50 Stück • Sie erfassen einen zusätzlichen Kundenauftrag über 10 Stück. Welche Aussagen beschreiben die oben geschilderte Situation korrekt?",[["Nach der Verfügbarkeitsprüfung werden mehr als 10 Stück bestätigt.",0],["Nach der Verfügbarkeitsprüfung werden genau 10 Stück bestätigt.",1],["Abhängig vom Wunschlieferdatum des Kunden führt das System möglicherweise eine Vorwärtsterminierung durch.",1],["Die Verfügbarkeitsprüfung weist Sie darauf hin, dass weniger als 10 Stück bestätigt werden können.",0]],"","0ddd3fba"],[1,"Wenn Sie einen vorhandenen Stammsatz verwenden möchten, z.B. für den Auftraggeber, welche Hilfe steht in SAP S/4HANA für die Suche nach den korrekten Daten zur Verfügung?",[["Setzen Sie den Cursor in das relevante Feld. Drücken Sie dann F4, und das System zeigt die Suchmöglichkeiten an.",1],["Drücken Sie die Funktionstaste F1-Hilfe\", um alle im System angelegten Datensätze anzuzeigen. Doppelklicken Sie dann auf den gewünschten Stammsatz.",0],["In allen Apps steht die Funktion \"Daten auswählen\" zur Verfügung. Nach dem Aufruf dieser Funktion können Sie mithilfe der Auswahlfelder nach den gewünschten Stammdaten suchen.",0],["Klicken Sie rechts neben dem relevanten Feld auf das Lupensymbol. Das System zeigt die zuletzt verwendeten Stammsätze an.",0]],"","3cc3fd87"],[1,"Der Eingang einer Kundenreklamation führt zur Erstellung einer Gutschriftsanforderung. Es wird allerdings entschieden, dass die Reklamation ungerechtfertigt ist. Wie wird das in der Gutschriftsanforderung dokumentiert?",[["Der Preis der Position wird auf null gesetzt.",0],["Es wird ein passender Absagegrund eingegeben.",1],["Die Materialmenge in der Position wird auf null gesetzt.",0],["Die entsprechende Einzelposition wird gelöscht.",0]],"","8206b650"],[1,"Welche Aussagen beschreiben zutreffend die Erstellung von Auslieferungen?",[["Auslieferungen können automatisch erstellt werden, z. B. von einem Hintergrundjob.",1],["Kundenaufträge, die in eine Auslieferung zusammengeführt werden sollen, müssen dasselbe Werk haben.",0],["Sämtliche Positionen eines Kundenauftrags müssen immer in eine einzelne Auslieferung kopiert werden.",0],["Generell ist es möglich, für einen Kundenauftrag mehrere Auslieferungen zu erstellen.",1]],"","158d3e6d"],[1,"Ihr Unternehmen hat eine komplexe Organisationsstruktur, die in SAP S/4HANA abgebildet ist. Welche Bedeutung hat das für die Erstellung der Grunddatensichten für Materialstammsätze?",[["Sie werden für jeden Buchungskreis erstellt.",0],["Sie werden für jedes Werk erstellt.",0],["Sie werden für jede Verkaufsorganisation und jeden Vertriebsweg erstellt.",0],["Sie werden für jeden Mandanten erstellt.",1]],"","e08efd6a"],[1,"Was sind in der Unternehmensstruktur zulässige Zuordnungen?",[["Eine Verkaufsorganisation kann nur einem Vertriebsbereich zugeordnet werden.",0],["Eine Kombination aus Verkaufsorganisation und Vertriebsweg kann mehreren Werken zugeordnet werden.",1],["Eine Verkaufsorganisation kann maximal einem Vertriebsweg zugeordnet werden.",0],["Einem Buchungskreis können mehrere Verkaufsorganisationen zugeordnet werden.",1],["Eine Verkaufsorganisation kann nur einem Buchungskreis zugeordnet werden.",1]],"","f1e8bc7e"],[1,"Wozu können Sie den Belegfluss nutzen?",[["Um den Bearbeitungsstatus von Belegen zu ändern",0],["Um Stammdaten zu pflegen",0],["Um direkt in die Belege zu verzweigen",1],["Um Vorgängerbelege anzuzeigen",1]],"","21a0f230"],[1,"Sie haben einen Kundenauftrag mit drei Positionen erfasst. Welche Auswirkungen hat es, wenn Sie wichtige Daten in einer dieser Auftragspositionen ändern?",[["Bei Änderung des Warenempfängers wird die betreffende Änderung automatisch in den Auftragskopf kopiert.",0],["Werden Preise geändert, berechnet das System den Gesamtpreis des Kundenauftrags neu.",1],["Änderungen der Zahlungsbedingungen führen zu mehreren Fakturabelegen für den Auftrag.",1],["Bei Änderung der Versandstelle bestimmt das System das Auslieferungswerk neu.",0]],"","23be3500"],[1,"Welche Aussage trifft auf den Vertriebsprozess in SAP S/4HANA zu?",[["In der Bestandsführung wird der Bestand bei Erstellung eines Fakturabelegs aktualisiert.",0],["In SAP S/4HANA werden Kundenaufträge in Form von Auslieferungen erfasst.",0],["Für eine Kundenauftragsposition können mehrere Auslieferungen erstellt werden.",1],["Anforderungen aus dem Kundenauftrag werden an SAP Extended Warehouse Management (EWM) übertragen.",0]],"","756058e7"],[1,"Welche Aussagen beschreiben zutreffend die Nutzung wichtiger Vorlaufzeiten und Datumsangaben bei der Versandterminierung?",[["Die Versandterminierung kann zu einem anderen Ergebnis führen, wenn Sie das Auslieferungswerk in der Kundenauftragsposition manuell mit einem anderen Werk überschreiben.",1],["Die Transportdispositionsvorlaufzeit gibt die Zeit an, die für den Transport der Waren zum Standort des Kunden benötigt wird.",0],["Das System nutzt die Richtzeit zur Rückwärtsterminierung vom Ladedatum, um das Materialbereitstellungsdatum zu ermitteln.",1],["Das Transportdispositionsdatum gibt das Datum an, an dem die Waren das Auslieferungswerk verlassen müssen.",0]],"","d24a6859"],[1,"Ihre Firma hat zwei Verkaufsorganisationen: V100 und V200. Beide Verkaufsorganisationen möchten an denselben Kunden verkaufen. Allerdings hat sich Verkaufsorganisation V200 mit dem Kunden auf andere Incoterms und Zahlungsbedingungen geeinigt als Verkaufsorganisation V100. Wie kann SAP S/4HANA Sales diese Anforderung unterstützen?",[["Durch Festlegung unterschiedlicher Zahlungsbedingungen für unterschiedliche Vertriebsbereiche im Kundenstamm",1],["Durch Festlegung unterschiedlicher Incoterms für unterschiedliche Auslieferungswerke",0],["Durch Festlegung unterschiedlicher Incoterms für unterschiedliche Vertriebsbereiche im Kundenstamm",1],["Durch Festlegung unterschiedlicher Incoterms für unterschiedliche Buchungskreise im Kundenstamm",0]],"","74433b01"],[1,"Nachdem Sie einen Fakturabeleg angelegt haben, stellen Sie fest, dass das System die falschen Zahlungsbedingungen ermittelt hat. Wie lassen sich die Zahlungsbedingungen korrigieren?",[["Sie können im Kundenstamm korrigiert werden, wodurch der Fakturabeleg automatisch aktualisiert wird.",0],["Sie können im Zuge des Zahlungslaufs in der Finanzbuchhaltung korrigiert werden.",0],["Sie können im Fakturabeleg korrigiert werden, selbst wenn bereits die Übermittlung an die Buchhaltung erfolgt ist.",0],["Sie können im Kundenauftrag korrigiert werden, aber erst nachdem der Fakturabeleg storniert wurde.",1]],"","d6032fb7"],[1,"Welche Aussage beschreibt zutreffend die Nutzung von Vertriebsbereichen in Verkaufsbelegen?",[["Jede Position in einem Kundenauftrag kann einem anderen Vertriebsbereich zugeordnet werden.",0],["Beim Anlegen eines Kundenauftrags muss der Vertriebsbereich im Einstiegsbild erfasst werden.",0],["Jeder Verkaufsbeleg wird genau einem Vertriebsbereich zugeordnet, aber diese Zuordnung kann nachträglich geändert werden.",0],["Jeder Verkaufsbeleg wird genau einem Vertriebsbereich zugeordnet, und diese Zuordnung kann nicht geändert werden.",1]],"","0910fcf2"],[1,"Welche der folgenden Aussagen beschreiben zutreffend die Nutzung von Fakturabelegen?",[["Ein Fakturabeleg dient als Datenquelle für die Finanzbuchhaltung (FI), dam
